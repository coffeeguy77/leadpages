<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mum's Book">
  <title>Mum's Book</title>
  <defs>
    <linearGradient id="mb-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B8461"/>
      <stop offset="1" stop-color="#4C6344"/>
    </linearGradient>
    <linearGradient id="mb-bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF3E2"/>
      <stop offset="1" stop-color="#E7D6AF"/>
    </linearGradient>
    <linearGradient id="mb-soup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2594B"/>
      <stop offset="1" stop-color="#D8402F"/>
    </linearGradient>
    <clipPath id="mb-round"><rect width="512" height="512" rx="112"/></clipPath>
    <clipPath id="mb-inside"><path d="M86 286 H426 C426 286 416 420 256 420 C96 420 86 286 86 286 Z"/></clipPath>
  </defs>

  <g clip-path="url(#mb-round)">
    <rect width="512" height="512" fill="url(#mb-ground)"/>
    <circle cx="118" cy="80" r="224" fill="#FFFFFF" opacity=".07"/>

    <!-- steam -->
    <g stroke="#F6EEDC" stroke-width="21" stroke-linecap="round" fill="none">
      <path d="M190 230 C164 198 210 180 186 146"/>
      <path d="M258 220 C230 182 282 162 256 122"/>
      <path d="M326 232 C302 200 348 182 324 150"/>
    </g>

    <!-- bowl -->
    <path d="M86 286 H426 C426 286 416 420 256 420 C96 420 86 286 86 286 Z" fill="url(#mb-bowl)"/>
    <g clip-path="url(#mb-inside)">
      <path d="M86 300 H426 V420 H86 Z" fill="url(#mb-soup)"/>
      <ellipse cx="256" cy="300" rx="172" ry="17" fill="#F7695B"/>
    </g>
    <rect x="70" y="266" width="372" height="42" rx="21" fill="#FBF3E2"/>
  </g>
</svg>
