<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mum's Book — Matthews &amp; friends</title>
<meta name="description" content="Matthews & friends — the family recipe book. Her handwriting, her paintings, and everything we've cooked since.">
<meta name="theme-color" content="#2F4A33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   Mum's Book — tokens sampled from the printed recipe cards
   =========================================================== */
:root{
  --parchment:#F6EFDF; --parchment-2:#EFE4CC; --card:#FCF7EA;
  --forest:#2F4A33; --forest-2:#22371F;
  --gold:#9C7534; --gold-2:#C8A76A;
  --ink:#3B3226; --ink-soft:#7A6B54; --rust:#8C4A2F;
  --f-display:'Cinzel', Georgia, serif;
  --f-body:'EB Garamond', Georgia, serif;
  --pad:clamp(16px,3vw,40px); --maxw:1680px; --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--f-body);font-size:18px;line-height:1.6;color:var(--ink);
  background:var(--parchment);
  background-image:radial-gradient(ellipse at 12% 0%,rgba(200,167,106,.16),transparent 55%),
                   radial-gradient(ellipse at 88% 100%,rgba(47,74,51,.09),transparent 55%);
  background-attachment:fixed;min-height:100vh;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.5;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.28'/></svg>")}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--forest)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad);position:relative;z-index:3}
.narrow{max-width:900px}

/* ornamental page frame */
.frame{position:fixed;inset:10px;pointer-events:none;z-index:2;border:1px solid var(--gold-2);opacity:.5}
.frame::before{content:"";position:absolute;inset:5px;border:1px solid var(--gold-2);opacity:.5}
@media (max-width:640px){.frame{inset:6px}.frame::before{display:none}}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--forest);border-bottom:2px solid var(--gold)}
.topbar .wrap{display:flex;align-items:center;gap:14px;height:62px}
.mark{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.16em;color:var(--gold-2);
  text-transform:uppercase;text-decoration:none;white-space:nowrap}
.mark span{color:#EFE4CC}
.spacer{flex:1}
.tnav{display:flex;align-items:center;gap:4px}
.tnav button{font-family:var(--f-display);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:#DED2B6;padding:9px 12px;border-radius:2px;transition:.18s var(--ease)}
.tnav button:hover{color:#fff;background:rgba(255,255,255,.09)}
.tnav button.on{color:var(--forest);background:var(--gold-2)}
.whoami{display:flex;align-items:center;gap:8px;padding-left:12px;margin-left:4px;border-left:1px solid rgba(200,167,106,.35)}
.avatar{width:29px;height:29px;border-radius:50%;flex:none;background:var(--gold-2);color:var(--forest-2);
  font-family:var(--f-display);font-size:12px;font-weight:600;display:grid;place-items:center}
.whoami .nm{font-size:14px;color:#DED2B6}
@media (max-width:820px){.whoami .nm{display:none}.tnav button{padding:9px}}
@media (max-width:440px){.mark{font-size:13px;letter-spacing:.09em}}

/* ---------- type ---------- */
.eyebrow{font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold)}
.orn::before,.orn::after{content:"";height:1px;background:currentColor;opacity:.5;flex:1;max-width:70px}
.orn b{font-size:11px;letter-spacing:.3em;font-weight:400}
.banner{display:inline-block;background:var(--forest);color:var(--gold-2);font-family:var(--f-display);
  font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;padding:7px 20px 6px;border-radius:2px}

/* ---------- hero ---------- */
.hero{padding:clamp(28px,5vw,60px) 0 6px;text-align:center}
.hero h1{font-family:var(--f-display);color:var(--forest);font-size:clamp(38px,8vw,78px);line-height:1;margin:14px 0 0}
.hero .sub{max-width:52ch;margin:16px auto 0;font-style:italic;color:var(--ink-soft);font-size:clamp(16px,2.2vw,20px)}
.searchbox{position:relative;max-width:640px;margin:30px auto 0}
.searchbox input{width:100%;padding:17px 50px 16px 22px;background:var(--card);border:1px solid var(--gold-2);
  border-radius:2px;font-size:18px;font-style:italic;box-shadow:0 1px 0 #fff inset,0 6px 22px rgba(59,50,38,.09);transition:.2s var(--ease)}
.searchbox input::placeholder{color:#A6957A}
.searchbox input:focus{outline:none;border-color:var(--forest);box-shadow:0 0 0 3px rgba(47,74,51,.13),0 6px 22px rgba(59,50,38,.09)}
.searchbox .ic{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--gold);pointer-events:none;font-size:20px}
.hint{margin:11px 0 0;font-size:14px;color:var(--ink-soft);font-style:italic}

/* ---------- lately ---------- */
.lately{margin:40px 0 0;border-top:1px solid rgba(156,117,52,.3);border-bottom:1px solid rgba(156,117,52,.3);padding:18px 0}
.lately .hd{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.lately .hd i{flex:1;height:1px;background:rgba(156,117,52,.3)}
.logrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.logitem{flex:none;text-align:left;background:var(--card);border:1px solid rgba(156,117,52,.35);border-radius:2px;
  padding:10px 14px;min-width:200px;transition:.18s var(--ease)}
.logitem:hover{border-color:var(--forest);transform:translateY(-2px)}
.logitem .d{font-family:var(--f-display);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.logitem .t{font-family:var(--f-display);font-size:15px;color:var(--forest);margin-top:3px;line-height:1.25}
.logitem .w{font-size:13px;font-style:italic;color:var(--ink-soft);margin-top:2px}

/* ---------- filters ---------- */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:34px 0 10px}
.chips{display:flex;gap:7px;flex-wrap:wrap;flex:1}
.chip{font-family:var(--f-display);font-size:11px;letter-spacing:.13em;text-transform:uppercase;padding:8px 15px;
  border:1px solid rgba(156,117,52,.5);border-radius:100px;color:var(--ink-soft);background:rgba(252,247,234,.6);transition:.18s var(--ease)}
.chip:hover{border-color:var(--forest);color:var(--forest)}
.chip.on{background:var(--forest);border-color:var(--forest);color:var(--gold-2)}
.subchips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 20px}
.subchip{font-size:13px;font-style:italic;padding:5px 12px;border:1px solid rgba(156,117,52,.35);border-radius:100px;color:var(--ink-soft);transition:.16s var(--ease)}
.subchip:hover{border-color:var(--forest);color:var(--forest)}
.subchip.on{background:var(--gold-2);border-color:var(--gold);color:var(--forest-2)}
.count{font-size:14px;font-style:italic;color:var(--ink-soft);white-space:nowrap}

.btn{font-family:var(--f-display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:11px 22px;
  border-radius:2px;background:var(--forest);color:var(--gold-2);border:1px solid var(--forest);transition:.18s var(--ease);white-space:nowrap}
.btn:hover{background:var(--forest-2)}
.btn.ghost{background:transparent;color:var(--forest);border-color:var(--gold)}
.btn.ghost:hover{background:rgba(156,117,52,.1)}
.btn.wide{width:100%;padding:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;padding-bottom:30px}
.rcard{position:relative;text-align:left;background:var(--card);border:1px solid rgba(156,117,52,.4);border-radius:2px;
  overflow:hidden;box-shadow:0 2px 10px rgba(59,50,38,.07);display:flex;flex-direction:column;
  transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .22s var(--ease)}
.rcard:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(59,50,38,.16);border-color:var(--gold)}
.rcard:focus-visible{outline:2px solid var(--forest);outline-offset:3px}
.rthumb{aspect-ratio:4/3.1;background:var(--parchment-2);overflow:hidden;position:relative;border-bottom:1px solid rgba(156,117,52,.3)}
.rthumb img{width:100%;height:100%;object-fit:cover;object-position:top center;transition:transform .5s var(--ease)}
.rcard:hover .rthumb img{transform:scale(1.04)}
.stamp{position:absolute;top:10px;left:10px;background:rgba(47,74,51,.93);color:var(--gold-2);font-family:var(--f-display);
  font-size:9px;letter-spacing:.16em;text-transform:uppercase;padding:5px 10px;border-radius:2px}
.rbody{padding:15px 17px 17px;flex:1;display:flex;flex-direction:column}
.rbody h3{font-family:var(--f-display);font-size:18px;color:var(--forest);line-height:1.22;margin:0;font-weight:600}
.rbody .by{margin-top:auto;padding-top:12px;font-family:var(--f-display);font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--gold);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rbody .by em{font-family:var(--f-body);font-style:italic;letter-spacing:0;text-transform:none;font-size:13px;color:var(--ink-soft)}
.empty{text-align:center;padding:70px 20px;border:1px dashed rgba(156,117,52,.5);border-radius:2px;background:rgba(252,247,234,.4)}
.empty h3{font-family:var(--f-display);font-size:22px;color:var(--forest);margin:0}
.empty p{font-style:italic;color:var(--ink-soft);max-width:44ch;margin:10px auto 20px}

/* ---------- recipe sheet ---------- */
.backlink{font-family:var(--f-display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);
  padding:26px 0 0;display:inline-flex;gap:8px;align-items:center}
.backlink:hover{color:var(--forest)}
.sheet{background:var(--card);border:1px solid var(--gold-2);border-radius:2px;box-shadow:0 10px 40px rgba(59,50,38,.13);
  margin:14px 0 60px;overflow:hidden}
.sheet-in{padding:clamp(22px,3.5vw,52px)}
.rhead{text-align:center;border-bottom:1px solid rgba(156,117,52,.35);padding-bottom:26px}
.rhead h1{font-family:var(--f-display);color:var(--forest);font-size:clamp(28px,4.4vw,50px);line-height:1.06;margin:12px 0 0}
.kicker{font-family:var(--f-display);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-top:14px}
.facts{display:flex;flex-wrap:wrap;justify-content:center;margin:24px auto 0;border:1px solid rgba(156,117,52,.45);
  border-radius:2px;width:max-content;max-width:100%;background:rgba(239,228,204,.5)}
.fact{min-width:118px;padding:13px 20px;text-align:center;border-right:1px solid rgba(156,117,52,.3)}
.fact:last-child{border-right:0}
.fact .k{font-family:var(--f-display);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.fact .v{font-family:var(--f-display);font-size:17px;color:var(--forest);margin-top:3px}
.flip{display:flex;margin:26px auto 0;border:1px solid var(--gold);border-radius:100px;overflow:hidden;width:max-content;background:var(--parchment-2)}
.flip button{font-family:var(--f-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:9px 22px;color:var(--ink-soft);transition:.2s var(--ease)}
.flip button.on{background:var(--forest);color:var(--gold-2)}
.scanwrap{margin:26px 0 0;text-align:center}
.scanwrap img{margin:0 auto;border:1px solid rgba(156,117,52,.5);box-shadow:0 8px 30px rgba(59,50,38,.18);width:auto}
.scanwrap .cap{font-style:italic;color:var(--ink-soft);font-size:14px;margin-top:14px}

.cols{display:grid;grid-template-columns:minmax(260px,.85fr) minmax(0,1.6fr);gap:clamp(24px,3vw,56px);margin-top:34px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr;gap:30px}}
.ingpanel{background:rgba(239,228,204,.55);border:1px solid rgba(156,117,52,.35);border-radius:2px;padding:22px 20px;position:sticky;top:78px}
@media (max-width:900px){.ingpanel{position:static}}
.iggroup{margin-bottom:20px}
.iggroup:last-child{margin-bottom:0}
.iggroup h4{font-family:var(--f-display);font-size:12px;letter-spacing:.17em;text-transform:uppercase;color:var(--rust);margin:0 0 9px;font-weight:600}
.iggroup ul{list-style:none;margin:0;padding:0}
.iggroup li{position:relative;padding:5px 0 5px 17px;font-size:17px;line-height:1.5;border-bottom:1px dotted rgba(156,117,52,.28)}
.iggroup li:last-child{border-bottom:0}
.iggroup li::before{content:"";position:absolute;left:3px;top:15px;width:4px;height:4px;border-radius:50%;background:var(--gold)}
.step{display:flex;gap:16px;padding:0 0 22px;margin-bottom:22px;border-bottom:1px dotted rgba(156,117,52,.3)}
.step:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.step .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--forest);color:var(--gold-2);
  font-family:var(--f-display);font-size:14px;display:grid;place-items:center;margin-top:2px}
.step h4{font-family:var(--f-display);font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--rust);margin:0 0 7px;font-weight:600;line-height:1.3}
.step p{margin:0 0 9px;line-height:1.62}
.step p:last-child{margin-bottom:0}
.footnotes{display:grid;grid-template-columns:1fr 1fr;margin-top:38px;border-top:1px solid rgba(156,117,52,.4)}
@media (max-width:760px){.footnotes{grid-template-columns:1fr}}
.fn{padding:22px 24px 6px;border-right:1px solid rgba(156,117,52,.3)}
.fn:last-child{border-right:0}
.fn h4{font-family:var(--f-display);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--forest);margin:0 0 9px}
.fn p{margin:0;font-size:16.5px;line-height:1.6;color:var(--ink-soft)}
.checkbox{margin-top:28px;background:rgba(140,74,47,.06);border-left:2px solid var(--rust);padding:14px 18px;border-radius:2px}
.checkbox h4{font-family:var(--f-display);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--rust);margin:0 0 7px}
.checkbox p{margin:0 0 6px;font-size:15.5px;font-style:italic;color:var(--ink-soft);line-height:1.55}
.checkbox ul{margin:6px 0 0;padding-left:18px;font-size:15.5px;color:var(--ink-soft)}
.cookbar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between;margin-top:34px;padding-top:22px;border-top:1px solid rgba(156,117,52,.4)}
.cookbar .hist{font-style:italic;color:var(--ink-soft);font-size:15px}

/* ---------- forms / auth ---------- */
.field{margin-bottom:19px}
.field label{display:block;font-family:var(--f-display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--forest);margin-bottom:6px}
.field .help{font-size:14px;font-style:italic;color:var(--ink-soft);margin:0 0 7px}
.field input,.field textarea{width:100%;padding:11px 13px;background:#fff;border:1px solid rgba(156,117,52,.55);border-radius:2px;font-size:17px;transition:.18s var(--ease)}
.field textarea{resize:vertical;line-height:1.6;min-height:120px;font-family:var(--f-body)}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--forest);box-shadow:0 0 0 3px rgba(47,74,51,.12)}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media (max-width:620px){.three{grid-template-columns:1fr}}
.checkline{display:flex;gap:10px;align-items:flex-start;padding:14px;border:1px solid rgba(156,117,52,.4);border-radius:2px;background:rgba(239,228,204,.45)}
.checkline input{margin-top:5px;width:17px;height:17px;accent-color:var(--forest);flex:none}
.checkline .t{font-family:var(--f-display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--forest)}
.checkline .d{font-size:14.5px;font-style:italic;color:var(--ink-soft);margin-top:3px}
.drop{border:1px dashed rgba(156,117,52,.6);border-radius:2px;padding:26px 18px;text-align:center;background:rgba(252,247,234,.6);transition:.18s var(--ease);cursor:pointer;display:block}
.drop:hover{border-color:var(--forest);background:rgba(239,228,204,.6)}
.drop .d1{font-family:var(--f-display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--forest)}
.drop .d2{font-size:14px;font-style:italic;color:var(--ink-soft);margin-top:6px}
.drop img{max-height:230px;margin:0 auto;border:1px solid rgba(156,117,52,.5)}
.authpage{min-height:100vh;display:grid;place-items:center;padding:40px var(--pad);position:relative;z-index:3}
.authcard{width:100%;max-width:452px;background:var(--card);border:1px solid var(--gold-2);box-shadow:0 18px 60px rgba(59,50,38,.2);padding:clamp(28px,5vw,44px);text-align:center;border-radius:2px}
.authcard h1{font-family:var(--f-display);color:var(--forest);font-size:clamp(30px,7vw,42px);line-height:1.05;margin:14px 0 0}
.authcard .sub{font-style:italic;color:var(--ink-soft);margin:14px 0 26px;font-size:16.5px}
.authcard .field{text-align:left}
.switcher{margin-top:20px;font-size:15px;color:var(--ink-soft);font-style:italic}
.switcher button{color:var(--forest);text-decoration:underline;text-underline-offset:3px}
.note{font-size:14.5px;color:var(--ink-soft);background:rgba(239,228,204,.6);border-left:2px solid var(--gold);padding:11px 14px;text-align:left;margin-top:22px;line-height:1.55}
.err{color:var(--rust);font-size:15px;font-style:italic;margin:0 0 14px;text-align:left}

/* ---------- family ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:26px}
.person{background:var(--card);border:1px solid rgba(156,117,52,.4);border-radius:2px;padding:20px;display:flex;gap:14px;align-items:center}
.person .avatar{width:46px;height:46px;font-size:16px}
.person .pn{font-family:var(--f-display);font-size:17px;color:var(--forest);line-height:1.2}
.person .pr{font-size:14px;font-style:italic;color:var(--ink-soft);margin-top:2px}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(140%);background:var(--forest);color:var(--gold-2);
  padding:13px 26px;border-radius:2px;z-index:90;font-family:var(--f-display);font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;box-shadow:0 10px 30px rgba(0,0,0,.28);transition:transform .35s var(--ease);border:1px solid var(--gold)}
.toast.up{transform:translateX(-50%) translateY(0)}
.foot{text-align:center;padding:36px 0 46px;color:var(--ink-soft);font-style:italic;font-size:14.5px;position:relative;z-index:3}
.foot .orn{margin-bottom:12px}
.fade{animation:fade .45s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
:focus-visible{outline:2px solid var(--forest);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
@media print{.topbar,.frame,.flip,.cookbar,.backlink,.foot{display:none}.sheet{box-shadow:none;border:0}}
</style>
</head>
<body>
<div class="frame" aria-hidden="true"></div>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ============================================================
   1. CONFIG — paste your two Supabase values to go live.
      Leave blank and the book runs in open mode (no login,
      nothing new is saved).
   ============================================================ */
const CONFIG = {
  SUPABASE_URL: "",
  SUPABASE_ANON_KEY: "",
  BOOK_TITLE: "Mum's Book",
  BOOK_SUB: "Matthews & friends — for the children, grandchildren and great grandchildren. Her handwriting, her paintings, and everything we've cooked since.",
};
const LIVE = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
const sb = LIVE ? supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;

/* ============================================================
   2. Shaun's own recipe — the one that started the cooking log
   ============================================================ */
const SEED = [{
  id:"own-chicken",
  title:"Creamy white wine & herb braised chicken",
  sub:"Chicken", section:"ours", kind:"recipe",
  serves:"8–10", prep:"25 min", cook:"1½–2 hrs",
  source:"family", added_by_name:"Shaun", created_at:"2026-08-16",
  image:"", thumb:"",
  ingredients:[

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nl2p=s=>String(s||"").split(/\n+/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join("");
const initials=n=>String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const fmtDate=d=>{const t=new Date(d);return isNaN(t)?String(d):t.toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"})};
const fmtShort=d=>{const t=new Date(d);return isNaN(t)?String(d):t.toLocaleDateString("en-AU",{day:"numeric",month:"short"})};
const SECTIONS={primi:"Primi",contorni:"Contorni",secondi:"Secondi",dolce:"Dolce",bits:"Bits & bobs",ours:"Ours",art:"Artwork"};

let toastT;
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("up");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("up"),2600)}
function go(v,id){S.view=v;S.id=id||null;S.err="";S.limit=60;window.scrollTo({top:0,behavior:"instant"});render()}

/* ============================================================
   4. Data
   ============================================================ */
async function loadBook(){
  try{const r=await fetch("recipes.json",{cache:"no-cache"});return r.ok?await r.json():[]}
  catch(e){return []}
}
async function loadAll(){
  const book=await loadBook();
  const base=[{name:"Mum",relation:"Wrote the book"},{name:"Shaun",relation:"Typed it all up"}];
  if(!LIVE){
    S.recipes=[...SEED.map(r=>({...r})),...book];
    S.people=base; return;
  }
  const [{data:rs},{data:ps}]=await Promise.all([
    sb.from("recipes").select("*").order("created_at",{ascending:false}),
    sb.from("profiles").select("*").order("joined_at",{ascending:true})]);
  S.recipes=[...SEED.map(r=>({...r})),...(rs||[]).map(r=>({...r,cooks:r.cooks||[]})),...book];
  S.people=(ps&&ps.length)?[...base,...ps]:base;
}
async function saveRecipe(rec){
  if(!LIVE){S.recipes.unshift({...rec,id:"local-"+Date.now()});return}
  const row={...rec};delete row.id;row.added_by=S.user.id;
  const {data,error}=await sb.from("recipes").insert(row).select().single();
  if(error)throw error;
  S.recipes.unshift({...data,cooks:data.cooks||[]});
}
async function logCook(r){
  const entry={by:(S.profile&&S.profile.name)||"Someone",on:new Date().toISOString().slice(0,10)};
  r.cooks=[entry,...(r.cooks||[])];
  try{
    if(LIVE&&!String(r.id).startsWith("p")&&!String(r.id).startsWith("own")){
      await sb.from("recipes").update({cooks:r.cooks}).eq("id",r.id);
    }else if(LIVE){
      await sb.from("cooks").insert({recipe_key:r.id,recipe_title:r.title,by_name:entry.by,on_date:entry.on});
    }
  }catch(e){}
  toast("Logged — nice one");render();
}
async function uploadScan(file){
  if(!LIVE)return await fileToDataURL(file);
  const path=`${S.user.id}/${Date.now()}-${file.name.replace(/[^\w.\-]/g,"_")}`;
  const {error}=await sb.storage.from("scans").upload(path,file);
  if(error)throw error;
  return sb.storage.from("scans").getPublicUrl(path).data.publicUrl;
}
const fileToDataURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});

/* ============================================================
   5. Search
   ============================================================ */
function haystack(r){
  if(r._h)return r._h;
  r._h=[r.title,r.sub,r.note,r.serve_with,r.added_by_name,(r.tags||[]).join(" "),
    SECTIONS[r.section]||r.section,
    (r.ingredients||[]).map(g=>g.group+" "+(g.items||[]).join(" ")).join(" "),
    (r.method||[]).map(m=>m.title+" "+m.body).join(" "),
    r.book_page?("page "+r.book_page):""].join(" ").toLowerCase();
  return r._h;
}
function visible(){
  const words=S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return S.recipes.filter(r=>{
    const back=["index","notes","front"].includes(r.kind);
    if(S.filter==="ours"){if(r.source==="mum")return false}
    else if(S.filter==="art"){if(r.kind!=="art")return false}
    else if(S.filter!=="all"){if(r.section!==S.filter)return false}
    else if(back&&!words.length)return false;
    if(S.sub!=="all"&&r.sub!==S.sub)return false;
    if(!words.length)return true;
    const h=haystack(r);
    return words.every(w=>h.includes(w));
  });
}
function subsFor(f){
  const set=new Set();
  S.recipes.forEach(r=>{if(r.kind==="recipe"&&(f==="all"||r.section===f)&&r.sub)set.add(r.sub)});
  return [...set].sort();
}
function recentCooks(){
  const out=[];
  S.recipes.forEach(r=>(r.cooks||[]).forEach(c=>out.push({...c,title:r.title,id:r.id})));
  return out.sort((a,b)=>new Date(b.on)-new Date(a.on)).slice(0,12);
}

        Names she wrote beside the recipes — friends and family who gave her the dish.</p>
      <div class="subchips" style="justify-content:center">${top.map(([n,c])=>
        `<button class="subchip" data-search="${esc(n)}">${esc(n)}${c>1?` · ${c}`:""}</button>`).join("")}</div>
    </section>`:""}
    <div class="note" style="max-width:660px;margin:34px auto 0">
      <strong>Inviting someone.</strong> Send them the address of this page. ${LIVE
        ?`They pick "Join the family book" and they're in.`
        :`It's open to anyone with the link at the moment.`}
    </div></main>${vFoot()}`;
}

const vFoot=()=>{
  const n=S.recipes.filter(r=>r.kind==="recipe").length;
  const art=S.recipes.filter(r=>r.kind==="art").length;
  return `<footer class="foot"><div class="orn"><b>&#10086;</b></div>
    ${n} recipes &middot; ${art} paintings &middot; kept for the family</footer>`;
};

/* ============================================================
   7. Render + events
   ============================================================ */
function render(){
  const app=$("#app");
  if(LIVE&&!S.user){app.innerHTML=vAuth();return}
  app.innerHTML=({home:vHome,recipe:vRecipe,add:vAdd,family:vFamily}[S.view]||vHome)();
}

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-nav],[data-open],[data-filter],[data-sub],[data-face],[data-act],[data-search],#a-go,#a-swap,#f-save");
  if(!t)return;
  if(t.dataset.nav){e.preventDefault();if(t.dataset.nav==="add")S.draftImage=null;return go(t.dataset.nav)}
  if(t.dataset.open){S.face="typed";return go("recipe",t.dataset.open)}
  if(t.dataset.filter){S.filter=t.dataset.filter;S.sub="all";S.limit=60;return render()}
  if(t.dataset.sub){S.sub=t.dataset.sub;S.limit=60;return render()}
  if(t.dataset.face){S.face=t.dataset.face;return render()}
  if(t.dataset.search){S.q=t.dataset.search;S.filter="all";S.sub="all";return go("home")}
  if(t.dataset.act==="more"){S.limit+=60;return render()}
  if(t.dataset.act==="out"){if(LIVE)await sb.auth.signOut();S.user=null;S.profile=null;return render()}
  if(t.dataset.act==="cooked"){const r=S.recipes.find(x=>String(x.id)===String(S.id));if(r)await logCook(r);return}
  if(t.id==="a-swap"){S.authMode=S.authMode==="up"?"in":"up";S.err="";return render()}
  if(t.id==="a-go")return doAuth();
  if(t.id==="f-save")return doSave();
});

let qT;
document.addEventListener("input",e=>{
  if(e.target.id!=="q")return;
  S.q=e.target.value;S.limit=60;
  clearTimeout(qT);
  qT=setTimeout(()=>{const pos=$("#q").selectionStart;render();const n=$("#q");if(n){n.focus();n.setSelectionRange(pos,pos)}},140);
});
document.addEventListener("change",async e=>{
  if(e.target.id==="f-img"){const f=e.target.files[0];if(!f)return;S.draftImage=await fileToDataURL(f);S._file=f;render()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&LIVE&&!S.user&&["a-email","a-pass","a-name","a-rel"].includes(e.target.id))doAuth();
});

/* ---- auth ---- */
async function doAuth(){
  const email=($("#a-email")||{}).value,pass=($("#a-pass")||{}).value,
        name=($("#a-name")||{}).value,rel=($("#a-rel")||{}).value;
  if(!email||!pass){S.err="Enter your email and a password to continue.";return render()}
  if(S.authMode==="up"&&!name){S.err="Add your name so the family knows who wrote what.";return render()}
  S.busy=true;S.err="";render();
  try{
    if(S.authMode==="up"){
      const {data,error}=await sb.auth.signUp({email:email.trim(),password:pass});
      if(error)throw error;
      if(!data.session){S.busy=false;S.err="Check your email, confirm the link, then sign in.";S.authMode="in";return render()}
      S.user=data.user;
      await sb.from("profiles").insert({id:data.user.id,name:name.trim(),relation:(rel||"").trim()||null});
      S.profile={name:name.trim(),relation:rel};
    }else{
      const {data,error}=await sb.auth.signInWithPassword({email:email.trim(),password:pass});
      if(error)throw error;
      S.user=data.user;
      const {data:p}=await sb.from("profiles").select("*").eq("id",data.user.id).single();
      S.profile=p||{name:email.split("@")[0]};
    }
    await loadAll();S.busy=false;go("home");
  }catch(err){
    S.busy=false;
    S.err=/Invalid login/i.test(err.message||"")?"That email and password don't match. Try again.":(err.message||"Something went wrong.");
    render();
  }
}

/* ---- parsing ---- */
function parseIngredients(txt){
  const groups=[];let cur={group:"",items:[]};
  String(txt||"").split("\n").forEach(line=>{
    const l=line.trim();if(!l)return;
    if(/:$/.test(l)){if(cur.items.length)groups.push(cur);cur={group:l.replace(/:$/,""),items:[]}}
    else cur.items.push(l.replace(/^[-*•]\s*/,""));
  });
  if(cur.items.length)groups.push(cur);
  return groups;
}
function parseMethod(txt){
  return String(txt||"").split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean).map(block=>{
    const lines=block.split("\n").map(l=>l.trim()).filter(Boolean),first=lines[0];
    if(lines.length>1&&first.length<62&&!/[.!?]$/.test(first))
      return {title:first.replace(/^\d+[.)]\s*/,""),body:lines.slice(1).join("\n")};
    return {title:"",body:lines.join("\n")};
  }).map((s,i)=>({title:s.title||`Step ${i+1}`,body:s.body}));
}

async function doSave(){
  const v=id=>(($("#"+id)||{}).value||"").trim();
  const title=v("f-title");
  if(!title){S.err="Give it a name — even a rough one.";return render()}
  S.busy=true;S.err="";render();
  try{
    let image=null;
    if(S._file)image=await uploadScan(S._file);
    else if(S.draftImage)image=S.draftImage;
    const mum=($("#f-mum")||{}).checked;
    await saveRecipe({
      title,sub:v("f-sub"),section:mum?"secondi":"ours",kind:"recipe",
      serves:v("f-serves"),prep:v("f-prep"),cook:v("f-cook"),
      source:mum?"mum":"family",image,thumb:image,
      ingredients:parseIngredients(v("f-ing")),method:parseMethod(v("f-method")),
      note:v("f-note"),serve_with:v("f-serve"),check:[],book_page:null,
      tags:[v("f-sub").toLowerCase()].filter(Boolean),
      added_by_name:(S.profile&&S.profile.name)||"Family",
      created_at:new Date().toISOString().slice(0,10),cooks:[]
    });
    S._file=null;S.draftImage=null;S.busy=false;
    toast("Saved to the book");go("home");
  }catch(err){S.busy=false;S.err=err.message||"Couldn't save that. Try again.";render()}
}

/* ---- boot ---- */
(async()=>{
  if(LIVE){
    const {data:{session}}=await sb.auth.getSession();
    if(session){
      S.user=session.user;
      const {data:p}=await sb.from("profiles").select("*").eq("id",session.user.id).single();
      S.profile=p||{name:session.user.email.split("@")[0]};
    }
  }
  await loadAll();
  render();
})();
</script>
