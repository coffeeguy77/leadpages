<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mum's Book — her recipes, our family</title>
<meta name="description" content="Her recipes. Our family. Written by Mum, cooked and shared by all of us.">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   Mum's Book
   ========================================================== */
:root{
  --bg:#F7F6F3;
  --card:#FFFFFF;
  --ink:#1A1A18;
  --ink-2:#44443F;
  --muted:#79796F;
  --line:#E6E4DE;
  --line-2:#EFEDE8;
  --accent:#EF4A3C;
  --accent-dk:#D83A2D;
  --accent-soft:#FDF0EE;
  --sage:#ECF0EA;
  --sage-ink:#4A5A46;
  --r-sm:8px; --r:12px; --r-lg:18px; --r-xl:26px;
  --ease:cubic-bezier(.2,.7,.3,1);
  --pad:clamp(18px,4vw,56px);
  --maxw:1280px;
  --shadow:0 1px 2px rgba(26,26,24,.05), 0 8px 24px -12px rgba(26,26,24,.12);
  --shadow-lg:0 2px 6px rgba(26,26,24,.06), 0 26px 60px -22px rgba(26,26,24,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 16px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.022em;line-height:1.15}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad)}
.icon{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:60;background:rgba(247,246,243,.88);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line-2)}
.nav .wrap{display:flex;align-items:center;gap:10px;height:66px}
.brand{font-weight:800;font-size:16px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.brand b{font-weight:500}
.nav .sp{flex:1}
.nlink{font-size:14.5px;font-weight:500;color:var(--ink-2);padding:8px 12px;border-radius:999px;transition:.16s var(--ease);white-space:nowrap}
.nlink:hover{background:rgba(26,26,24,.05);color:var(--ink)}
.nlink.on{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.nlink.add{color:var(--accent);font-weight:600}
.nlink.add:hover{background:var(--accent-soft)}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:999px;color:var(--ink-2);font-size:18px;transition:.16s var(--ease)}
.iconbtn:hover{background:rgba(26,26,24,.06);color:var(--ink)}
.who{display:flex;align-items:center;gap:8px;padding-left:10px;margin-left:4px;border-left:1px solid var(--line)}
.av{width:30px;height:30px;border-radius:999px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
@media(max-width:760px){.who .nm{display:none}}
@media(max-width:620px){
  .nav .wrap{gap:2px;height:60px}
  .brand{font-size:14px;letter-spacing:.05em}
  .nlink{padding:8px 9px;font-size:14px}
  .nlink.add{font-size:0;padding:8px 11px}
  .nlink.add::before{content:"+";font-size:19px;font-weight:600;line-height:1}
}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14.5px;font-weight:600;
  padding:11px 18px;border-radius:999px;transition:.16s var(--ease);white-space:nowrap;line-height:1}
.btn .icon{font-size:16px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dk)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#000}
.btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{border-color:#CFCCC4;background:#fff}
.btn-soft{background:#F2F0EB;color:var(--ink-2);width:100%;font-weight:500;font-size:13.5px;padding:10px}
.btn-soft:hover{background:#EBE8E2;color:var(--ink)}
.btn-soft .icon{color:var(--accent);font-size:15px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-lg{padding:14px 24px;font-size:15px}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.82fr);gap:40px;align-items:start;padding:clamp(28px,5vw,60px) 0 10px}
.hero h1{font-size:clamp(40px,6.4vw,70px);font-weight:800;letter-spacing:-.035em;line-height:1.02}
.hero p.lede{color:var(--muted);font-size:17px;margin:16px 0 0;max-width:40ch}
.searchrow{position:relative;margin:26px 0 0;max-width:430px}
.searchrow input{width:100%;padding:13px 16px 13px 44px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:15px;transition:.16s var(--ease)}
.searchrow input::placeholder{color:#9A998F}
.searchrow input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(26,26,24,.07)}
.searchrow .si{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:17px;pointer-events:none}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 0}
.pill{font-size:13.5px;font-weight:500;padding:9px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink-2);transition:.16s var(--ease)}
.pill:hover{border-color:#CFCCC4;color:var(--ink)}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.herocard{position:relative;margin:4px 0 0;max-height:460px;overflow:hidden;border-radius:var(--r)}
.herocard img{width:100%;border-radius:var(--r);box-shadow:var(--shadow-lg);transform:rotate(2deg) scale(1.04);border:1px solid rgba(26,26,24,.06)}
.herocard::after{content:"";position:absolute;left:0;right:0;bottom:0;height:120px;
  background:linear-gradient(to bottom,rgba(247,246,243,0),var(--bg));pointer-events:none}
@media(max-width:880px){.hero{grid-template-columns:1fr;gap:26px}.herocard{display:none}}

/* ---------- section heads ---------- */
.sechead{display:flex;align-items:baseline;gap:14px;margin:42px 0 20px}
.sechead h2{font-size:clamp(21px,2.4vw,26px);font-weight:700}
.sechead .sp{flex:1}
.seeall{font-size:14px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;transition:.16s var(--ease)}
.seeall:hover{color:var(--accent);gap:9px}
.cnt{font-size:14px;color:var(--muted)}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:20px}
.rc{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-lg);overflow:hidden;text-align:left;
  display:flex;flex-direction:column;transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease)}
.rc:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--line)}
.rc:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.rc .shot{aspect-ratio:1/1.08;overflow:hidden;background:#F1EFE9;position:relative;cursor:pointer}
.rc .shot img{width:100%;height:100%;object-fit:cover;object-position:top center;transition:transform .45s var(--ease)}
.rc:hover .shot img{transform:scale(1.035)}
.rc .shot.none{display:grid;place-items:center;padding:24px;text-align:center;
  background:linear-gradient(#FBFAF8,#F1EFE9);
  box-shadow:inset 0 0 0 1px var(--line-2)}
.rc .shot.none span{font-size:16px;font-weight:650;color:var(--ink-2);line-height:1.32;letter-spacing:-.015em}
.tag{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.94);color:var(--ink-2);font-size:10.5px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;padding:5px 9px;border-radius:999px}
.rc .cb{padding:14px 15px 15px;display:flex;flex-direction:column;gap:3px;flex:1}
.rc h3{font-size:15.5px;font-weight:600;letter-spacing:-.012em;line-height:1.28;cursor:pointer}
.rc .mt{font-size:13px;color:var(--muted)}
.rc .cb .btn-soft{margin-top:12px}
.photocount{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--accent);font-weight:600;margin-top:10px}

.empty{text-align:center;padding:72px 24px;background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-lg)}
.empty h3{font-size:19px;margin-bottom:8px}
.empty p{color:var(--muted);max-width:42ch;margin:0 auto 20px}

/* ---------- story banner ---------- */
.banner{display:flex;align-items:center;gap:22px;flex-wrap:wrap;background:var(--sage);border-radius:var(--r-lg);padding:24px 28px;margin:34px 0 0}
.banner .bi{width:42px;height:42px;color:var(--sage-ink);opacity:.6;font-size:38px;flex:none}
.banner h3{font-size:18px;color:var(--sage-ink)}
.banner p{margin:4px 0 0;font-size:14.5px;color:var(--sage-ink);opacity:.82}
.banner .sp{flex:1;min-width:20px}

/* ---------- detail ---------- */
.back{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--muted);padding:26px 0 0;transition:.16s var(--ease)}
.back:hover{color:var(--ink);gap:10px}
.dhead{margin:18px 0 0}
.dhead h1{font-size:clamp(28px,4.2vw,42px);font-weight:700;letter-spacing:-.03em;max-width:22ch}
.dsub{color:var(--muted);font-size:16px;margin:10px 0 0;max-width:62ch}
.metarow{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin:22px 0 0;padding-bottom:24px;border-bottom:1px solid var(--line-2)}
.meta{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;color:var(--ink-2)}
.meta .icon{font-size:17px;color:var(--muted)}
.metarow .sp{flex:1;min-width:8px}
.metarow .acts{display:flex;gap:10px;flex-wrap:wrap}

.dcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.92fr);gap:clamp(26px,4vw,52px);margin:30px 0 0;align-items:start}
@media(max-width:940px){.dcols{grid-template-columns:1fr;gap:32px}}
.dcols h2{font-size:21px;margin-bottom:14px}
.ingblock{margin-bottom:26px}
.ingblock h4{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:9px}
.ings{list-style:none;margin:0;padding:0}
.ings li{border-bottom:1px solid var(--line-2)}
.ings li:last-child{border-bottom:0}
.ck{display:flex;align-items:flex-start;gap:11px;padding:7px 2px;cursor:pointer;font-size:15.5px;line-height:1.5;transition:.14s var(--ease);width:100%;text-align:left}
.ck:hover{color:#000}
.box{width:17px;height:17px;border:1.5px solid #C9C6BE;border-radius:5px;flex:none;margin-top:3px;display:grid;place-items:center;transition:.14s var(--ease)}
.box .icon{font-size:12px;color:#fff;opacity:0;stroke-width:3}
.ck.done .box{background:var(--accent);border-color:var(--accent)}
.ck.done .box .icon{opacity:1}
.ck.done .tx{color:#A9A79E;text-decoration:line-through;text-decoration-thickness:1px}
.steps{counter-reset:s;margin-top:4px}
.stp{display:flex;gap:14px;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line-2)}
.stp:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.stp .n{width:26px;height:26px;border-radius:999px;background:#F1EFE9;color:var(--ink-2);font-size:12.5px;font-weight:700;
  display:grid;place-items:center;flex:none;margin-top:1px}
.stp h4{font-size:15px;font-weight:650;margin-bottom:5px}
.stp p{margin:0 0 7px;font-size:15.5px;line-height:1.62;color:var(--ink-2)}
.stp p:last-child{margin-bottom:0}

.scanbox{position:sticky;top:86px}
.scanwrap{position:relative;background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.scanwrap img{width:100%}
.expand{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:999px;background:rgba(255,255,255,.95);
  display:grid;place-items:center;font-size:15px;color:var(--ink-2);box-shadow:0 2px 8px rgba(0,0,0,.12);transition:.16s var(--ease)}
.expand:hover{background:#fff;color:var(--ink);transform:scale(1.06)}
.scancap{text-align:center;font-size:13px;color:var(--muted);margin-top:10px}

.callout{display:flex;gap:12px;background:var(--accent-soft);border-radius:var(--r);padding:16px 18px;margin:28px 0 0}
.callout .ci{color:var(--accent);font-size:18px;flex:none;margin-top:2px}
.callout h4{font-size:13.5px;font-weight:700;color:var(--accent);margin-bottom:3px}
.callout p{margin:0;font-size:15px;line-height:1.55;color:var(--ink-2)}
.callout.check{background:#FFF8E8}
.callout.check .ci,.callout.check h4{color:#A07A1C}
.callout.check ul{margin:6px 0 0;padding-left:18px;font-size:14.5px;color:var(--ink-2)}

.kitchen{background:var(--sage);border-radius:var(--r-lg);padding:26px 28px;margin:30px 0 60px;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:26px;align-items:center}
@media(max-width:800px){.kitchen{grid-template-columns:1fr}}
.kitchen h3{font-size:19px;color:var(--sage-ink)}
.kitchen p{margin:6px 0 0;font-size:14.5px;color:var(--sage-ink);opacity:.82}
.dropzone{border:1.5px dashed #BFC9BB;border-radius:var(--r);padding:22px;text-align:center;background:rgba(255,255,255,.5);transition:.16s var(--ease);cursor:pointer;display:block}
.dropzone:hover{border-color:var(--accent);background:rgba(255,255,255,.8)}
.dropzone .dz2{font-size:12.5px;color:var(--sage-ink);opacity:.75;margin-top:9px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:18px}
.shot-card{background:#fff;border-radius:var(--r);overflow:hidden;border:1px solid rgba(0,0,0,.05)}
.shot-card img{width:100%;aspect-ratio:1/1;object-fit:cover}
.shot-card .sm{padding:9px 11px;font-size:12.5px;color:var(--muted)}
.shot-card .sm b{color:var(--ink-2);font-weight:600}

/* ---------- cooking mode ---------- */
.cook{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column}
.cook.on{display:flex}
.cook-top{display:flex;align-items:center;gap:14px;padding:16px var(--pad);border-bottom:1px solid var(--line-2)}
.cook-top .ct{font-size:15px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cook-bar{height:3px;background:var(--line-2);border-radius:999px;overflow:hidden;margin:0 var(--pad)}
.cook-bar i{display:block;height:100%;background:var(--accent);transition:width .3s var(--ease)}
.cook-body{flex:1;overflow:auto;display:grid;place-items:center;padding:30px var(--pad)}
.cook-in{max-width:760px;width:100%}
.cook-in .sn{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.cook-in h2{font-size:clamp(26px,4.6vw,42px);font-weight:700;letter-spacing:-.03em;margin:12px 0 18px}
.cook-in p{font-size:clamp(17px,2.2vw,21px);line-height:1.62;color:var(--ink-2);margin:0 0 12px}
.cook-ing{margin-top:30px;border-top:1px solid var(--line-2);padding-top:18px}
.cook-ing summary{font-size:14.5px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.cook-ing .ings{margin-top:10px;max-width:460px}
.cook-foot{display:flex;gap:12px;padding:16px var(--pad) calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line-2);background:var(--card)}
.cook-foot .sp{flex:1}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:210;background:rgba(20,20,18,.9);display:none;place-items:center;padding:24px;overflow:auto}
.lb.on{display:grid}
.lb img{max-width:min(960px,100%);border-radius:8px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.lb .x{position:fixed;top:18px;right:20px;width:40px;height:40px;border-radius:999px;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center;font-size:18px}
.lb .x:hover{background:rgba(255,255,255,.28)}

/* ---------- forms / auth ---------- */
.panel{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:clamp(22px,3vw,34px)}
.field{margin-bottom:17px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field .hlp{font-size:13px;color:var(--muted);margin:0 0 7px}
.field input,.field textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;font-size:15px;transition:.16s var(--ease)}
.field textarea{resize:vertical;min-height:110px;line-height:1.6;font-family:inherit}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(26,26,24,.07)}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}
@media(max-width:620px){.three{grid-template-columns:1fr}}
.rowck{display:flex;gap:11px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:var(--r-sm);background:#FCFBF9}
.rowck input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent);flex:none}
.authpage{min-height:100vh;display:grid;place-items:center;padding:40px var(--pad)}
.authcard{width:100%;max-width:420px}
.authcard h1{font-size:30px;font-weight:800;letter-spacing:-.03em;text-align:center}
.authcard .lede{color:var(--muted);text-align:center;margin:10px 0 24px;font-size:15px}
.swap{text-align:center;margin-top:16px;font-size:14px;color:var(--muted)}
.swap button{color:var(--accent);font-weight:600}
.err{color:var(--accent);font-size:14px;margin:0 0 14px}
.note{background:#FCFBF9;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:12px 14px;font-size:13.5px;color:var(--muted);line-height:1.55}

/* ---------- people ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:22px}
.person{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);padding:16px;display:flex;gap:12px;align-items:center}
.person .av{width:40px;height:40px;font-size:14px;background:#F1EFE9;color:var(--ink-2)}
.person .pn{font-size:15px;font-weight:600}
.person .pr{font-size:13px;color:var(--muted);margin-top:1px}
.namechips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.namechip{font-size:13.5px;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink-2);transition:.16s var(--ease)}
.namechip:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(150%);background:var(--ink);color:#fff;
  padding:12px 22px;border-radius:999px;z-index:300;font-size:14px;font-weight:500;transition:transform .32s var(--ease);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.up{transform:translateX(-50%) translateY(0)}
.foot{text-align:center;padding:40px 0 56px;color:var(--muted);font-size:13.5px;border-top:1px solid var(--line-2);margin-top:50px}
.fade{animation:fd .34s var(--ease) both}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto}}
@media print{.nav,.back,.metarow .acts,.kitchen,.foot,.banner{display:none}.dcols{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="cook" id="cook" role="dialog" aria-label="Cooking mode"></div>
<div class="lb" id="lb" role="dialog" aria-label="Full page"><button class="x" data-act="lb-close" aria-label="Close">&#10005;</button><img id="lb-img" alt=""></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* =========================================================
   1. CONFIG — add your two Supabase values to let the family
      sign in, add recipes and share their photos.
   ========================================================= */

/* =========================================================
   5. Derived metadata
   ========================================================= */
function ovenTemp(r){
  const t=(r.method||[]).map(m=>m.body).join(" ");
  const m=/(\d{2,3})\s*(?:°\s*C|°C|\bC\b)/.exec(t);
  if(!m) return ""; const n=+m[1];
  return (n>=80&&n<=300)?n+"°C":"";
}
function timing(r){
  if(r.cook) return r.cook;
  const t=(r.method||[]).map(m=>m.body).join(" ");
  const m=/(\d+\s*(?:[–\-]\s*\d+)?)\s*(mins?|minutes?|hrs?|hours?)/i.exec(t);
  if(!m) return "";
  const u=/h/i.test(m[2])?"hrs":"mins";
  return m[1].replace(/\s+/g,"")+" "+u;
}

async function loadBook(){
  try{const r=await fetch("recipes.json",{cache:"no-cache"});return r.ok?await r.json():[]}catch(e){return []}
}
async function loadAll(){
  const book=await loadBook();
  const base=[{name:"Mum",relation:"Wrote the book"},{name:"Shaun",relation:"Typed it all up"}];
  if(!LIVE){S.recipes=[...SEED.map(r=>({...r})),...book];S.people=base;return}
  const [{data:rs},{data:ps},{data:ph}]=await Promise.all([
    sb.from("recipes").select("*").order("created_at",{ascending:false}),
    sb.from("profiles").select("*").order("joined_at",{ascending:true}),
    sb.from("photos").select("*").order("created_at",{ascending:false})]);
  S.recipes=[...SEED.map(r=>({...r})),...(rs||[]).map(r=>({...r,cooks:r.cooks||[]})),...book];
  S.people=(ps&&ps.length)?[...base,...ps]:base;
  (ph||[]).forEach(p=>{(S.photos[p.recipe_key]=S.photos[p.recipe_key]||[]).push(p)});
}
async function saveRecipe(rec){
  if(!LIVE){S.recipes.unshift({...rec,id:"local-"+Date.now()});return}
  const row={...rec};delete row.id;row.added_by=S.user.id;
  const {data,error}=await sb.from("recipes").insert(row).select().single();
  if(error)throw error;
  S.recipes.unshift({...data,cooks:data.cooks||[]});
}

const toDataURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});

async function shrink(file,max){
  const url=await toDataURL(file);
  return await new Promise(res=>{
    const im=new Image();
    im.onload=()=>{
      const s=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement("canvas");
      c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",.82));
    };
    im.onerror=()=>res(url); im.src=url;
  });
}
async function addPhoto(recipeKey,file,title){
  const small=await shrink(file,1400);
  const by=(S.profile&&S.profile.name)||"Someone";
  const entry={recipe_key:recipeKey,recipe_title:title,url:small,by_name:by,created_at:new Date().toISOString(),local:!LIVE};
  if(LIVE){
    try{
      const path=`${S.user.id}/${Date.now()}.jpg`;
      const blob=await (await fetch(small)).blob();
      const {error}=await sb.storage.from("photos").upload(path,blob,{contentType:"image/jpeg"});
      if(error)throw error;
      entry.url=sb.storage.from("photos").getPublicUrl(path).data.publicUrl; entry.local=false;
      await sb.from("photos").insert({recipe_key:recipeKey,recipe_title:title,url:entry.url,by_name:by});
    }catch(e){ toast("Couldn't upload — showing it here only"); }
  }
  (S.photos[recipeKey]=S.photos[recipeKey]||[]).unshift(entry);
  toast(LIVE?"Shared with the family":"Added — on this device only");
  render();
}

function hay(r){
  if(r._h)return r._h;
  r._h=[r.title,r.sub,r.note,r.serve_with,r.added_by_name,(r.tags||[]).join(" "),SECTIONS[r.section]||r.section,
    (r.ingredients||[]).map(g=>g.group+" "+(g.items||[]).join(" ")).join(" "),
    (r.method||[]).map(m=>m.title+" "+m.body).join(" "),
    r.book_page?("page "+r.book_page):""].join(" ").toLowerCase();
  return r._h;
}
const RANK={recipe:0,art:1,divider:2,front:3,index:4,notes:4};
function visible(){
  const w=S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const out=S.recipes.filter(r=>{
    const back=["index","notes","front"].includes(r.kind);
    if(S.filter==="ours"){if(r.source==="mum")return false}
    else if(S.filter==="art"){if(r.kind!=="art")return false}
    else if(S.filter!=="all"){if(r.section!==S.filter)return false}
    else if(back&&!w.length)return false;
    if(!w.length)return true;
    const h=hay(r); return w.every(x=>h.includes(x));
  });
  // cooking comes first: recipes, then her paintings, then the section plates
  return out.sort((a,b)=>(RANK[a.kind]??9)-(RANK[b.kind]??9));
}
const recentCooks=()=>{const o=[];S.recipes.forEach(r=>(r.cooks||[]).forEach(c=>o.push({...c,title:r.title,id:r.id})));
  return o.sort((a,b)=>new Date(b.on)-new Date(a.on)).slice(0,8)};

  const steps=r.method||[], i=Math.min(S.cook.step,steps.length-1), m=steps[i]||{};
  return `<div class="cook-top">
      <button class="iconbtn" data-act="cook-close" aria-label="Close">${ic("x")}</button>
      <div class="ct">${esc(r.title)}</div>
      <div class="cnt">${i+1} / ${steps.length}</div></div>
    <div class="cook-bar"><i style="width:${((i+1)/steps.length)*100}%"></i></div>
    <div class="cook-body"><div class="cook-in">
      <div class="sn">Step ${i+1}</div>
      <h2>${esc(m.title||"")}</h2>
      ${nl2p(m.body)}
      <details class="cook-ing"><summary>Ingredients</summary>${ingList(r)}</details>
    </div></div>
    <div class="cook-foot">
      <button class="btn btn-ghost btn-lg" data-act="cook-prev" ${i===0?"disabled":""}>Back</button>
      <div class="sp"></div>
      ${i<steps.length-1
        ?`<button class="btn btn-dark btn-lg" data-act="cook-next">Next step ${ic("arrow")}</button>`
        :`<button class="btn btn-primary btn-lg" data-act="cook-done">${ic("check")} Done — I cooked this</button>`}
    </div>`;
}

function vAdd(){
  return `${vNav()}<main class="wrap" style="max-width:760px">
    <button class="back" data-nav="home">${ic("back")} All recipes</button>
    <div class="dhead" style="margin-bottom:22px"><h1>Add a recipe</h1>
      <p class="dsub">Half a recipe written down now beats a perfect one nobody ever types.</p></div>
    <div class="panel fade">
      ${S.err?`<p class="err">${esc(S.err)}</p>`:""}
      <div class="field"><label>A photo of it</label>
        <p class="hlp">Your own card, or a page she wrote that isn't in the book. Shoot it flat, in daylight.</p>
        <label class="dropzone" for="f-img" style="border-color:var(--line)">
          ${S.draftImage?`<img src="${esc(S.draftImage)}" alt="" style="max-height:220px;margin:0 auto;border-radius:8px">`
            :`<span class="btn btn-ghost">${ic("camera")} Choose a photo</span><div class="dz2" style="color:var(--muted)">JPG or PNG</div>`}
        </label><input id="f-img" type="file" accept="image/*" hidden></div>
      <div class="field"><div class="rowck"><input id="f-mum" type="checkbox">
        <label for="f-mum" style="margin:0;font-weight:500">
          <span style="font-weight:600;display:block">This one is in Mum's hand</span>
          <span style="font-size:13.5px;color:var(--muted)">Files it with her pages.</span></label></div></div>
      <div class="field"><label for="f-title">Recipe name</label><input id="f-title" placeholder="Sunday lamb with rosemary"></div>
      <div class="field"><label for="f-sub">Category</label><input id="f-sub" placeholder="Lamb &middot; Cake &middot; Sauces"></div>
      <div class="three">
        <div class="field"><label for="f-serves">Serves</label><input id="f-serves" placeholder="6–8"></div>
        <div class="field"><label for="f-prep">Prep</label><input id="f-prep" placeholder="20 min"></div>
        <div class="field"><label for="f-cook">Cook</label><input id="f-cook" placeholder="3 hrs"></div></div>
      <div class="field"><label for="f-ing">Ingredients</label>
        <p class="hlp">One per line. A heading ending in a colon starts a new section — like <em>Marinade:</em></p>
        <textarea id="f-ing" rows="7" placeholder="Chicken:&#10;2 kg bone-in thighs&#10;120 g plain flour"></textarea></div>
      <div class="field"><label for="f-method">Method</label>
        <p class="hlp">Blank line between steps. A short first line becomes that step's heading.</p>
        <textarea id="f-method" rows="9" placeholder="Brown the meat&#10;Get the pan properly hot, then colour the lamb all over."></textarea></div>
      <div class="field"><label for="f-note">A note</label><textarea id="f-note" rows="2" placeholder="The trick nobody tells you."></textarea></div>
      <button class="btn btn-primary btn-lg" id="f-save" style="width:100%" ${S.busy?"disabled":""}>${S.busy?"Saving…":"Save to the book"}</button>
    </div></main>${vFoot()}`;
}

function vFamily(){
  const counts={};
  S.recipes.forEach(r=>{if(r.kind==="recipe"){const k=r.added_by_name||"Family";counts[k]=(counts[k]||0)+1}});
  const cred={};
  S.recipes.forEach(r=>{const m=/(?:~|-|from|thks|thanks)\s*([A-Z][a-zA-Z'&. ]{2,24})/.exec(r.note||"");
    if(m)cred[m[1].trim()]=(cred[m[1].trim()]||0)+1});
  const top=Object.entries(cred).sort((a,b)=>b[1]-a[1]).slice(0,20);
  return `${vNav()}<main class="wrap">
    <div class="hero" style="grid-template-columns:1fr;padding-bottom:0">
      <div><h1 style="font-size:clamp(34px,5vw:52px,52px)">The family</h1>
      <p class="lede">Anyone in the family can join and add to the book.</p></div></div>
    <div class="people">${S.people.map(p=>`<div class="person">
      <div class="av">${esc(inits(p.name))}</div>
      <div><div class="pn">${esc(p.name)}</div>
      <div class="pr">${esc(p.relation||"Family")}${counts[p.name]?` &middot; ${counts[p.name]} recipes`:""}</div></div></div>`).join("")}</div>
    ${top.length?`<div class="sechead" style="margin-top:44px"><h2>Credited in her pages</h2></div>
      <p style="color:var(--muted);font-size:15px;margin:-10px 0 0">Names she wrote beside the recipes — the friends and family who gave her the dish.</p>
      <div class="namechips" style="justify-content:flex-start;margin-top:18px">
        ${top.map(([n,c])=>`<button class="namechip" data-search="${esc(n)}">${esc(n)}${c>1?` &middot; ${c}`:""}</button>`).join("")}</div>`:""}
    <div class="note" style="margin-top:34px;max-width:640px">
      <strong>Inviting someone.</strong> Send them this address. ${LIVE?`They pick "Join the family book" and they're in.`:`It's open to anyone with the link at the moment.`}
    </div></main>${vFoot()}`;
}

function vAuth(){
  const up=S.authMode==="up";
  return `<div class="authpage"><div class="authcard fade">
    <h1>Mum's Book</h1>
    <p class="lede">${up?"Add your name to the book. You'll be able to read every recipe and add your own.":"Welcome back. The kettle's on."}</p>
    <div class="panel">
      ${S.err?`<p class="err">${esc(S.err)}</p>`:""}
      ${up?`<div class="field"><label for="a-name">Your name</label><input id="a-name" placeholder="Shaun" autocomplete="name"></div>
      <div class="field"><label for="a-rel">Who you are in this family</label><input id="a-rel" placeholder="Her son &middot; Grandson &middot; Married in"></div>`:""}
      <div class="field"><label for="a-email">Email</label><input id="a-email" type="email" autocomplete="email" placeholder="you@example.com"></div>
      <div class="field"><label for="a-pass">Password</label><input id="a-pass" type="password" autocomplete="${up?"new-password":"current-password"}" placeholder="At least 6 characters"></div>
      <button class="btn btn-primary btn-lg" id="a-go" style="width:100%" ${S.busy?"disabled":""}>${S.busy?"One moment…":(up?"Join the book":"Sign in")}</button>
      <p class="swap">${up?"Already in the book?":"First time here?"} <button id="a-swap">${up?"Sign in":"Join"}</button></p>
    </div></div></div>`;
}

const vFoot=()=>{
  const n=S.recipes.filter(r=>r.kind==="recipe").length, a=S.recipes.filter(r=>r.kind==="art").length;
  return `<footer class="foot">${n} recipes &middot; ${a} paintings &middot; kept for the family</footer>`;
};

/* =========================================================
   9. Render + events
   ========================================================= */
function render(){
  const app=$("#app");
  if(LIVE&&!S.user){app.innerHTML=vAuth();return}
  app.innerHTML=({home:vHome,recipe:vRecipe,add:vAdd,family:vFamily}[S.view]||vHome)();
  const c=$("#cook");
  c.className="cook"+(S.cook.on?" on":"");
  c.innerHTML=S.cook.on?vCook():"";
}

let wake=null;
async function keepAwake(on){
  try{
    if(on&&"wakeLock" in navigator){wake=await navigator.wakeLock.request("screen")}
    else if(wake){wake.release();wake=null}
  }catch(e){}
}

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-nav],[data-open],[data-filter],[data-act],[data-tick],[data-zoom],[data-search],[data-photo],#a-go,#a-swap,#f-save");
  if(!t)return;
  const d=t.dataset;
  if(d.nav){e.preventDefault();if(d.nav==="add")S.draftImage=null;return go(d.nav)}
  if(d.open)return go("recipe",d.open);
  if(d.filter){S.filter=d.filter;S.limit=24;return render()}
  if(d.search){S.q=d.search;S.filter="all";return go("home")}
  if(d.zoom){$("#lb-img").src=d.zoom;$("#lb").classList.add("on");return}
  if(d.photo){const r=S.recipes.find(x=>String(x.id)===String(d.photo));if(r){S.id=r.id;pickPhoto(r)}return}
  if(d.tick!==undefined){
    const k=S.id, tk=S.ticked[k]=S.ticked[k]||{};
    tk[d.tick]=!tk[d.tick]; LS.set("mb-tick-"+k,tk); return render();
  }
  switch(d.act){
    case "focus-search":{if(S.view!=="home"){go("home");setTimeout(()=>{const q=$("#q");q&&q.focus()},60)}else{const q=$("#q");q&&q.focus()}return}
    case "clear":S.q="";S.filter="all";S.limit=24;return render();
    case "more":S.limit+=36;return render();
    case "scroll-top":window.scrollTo({top:0,behavior:"smooth"});return;
    case "lb-close":$("#lb").classList.remove("on");return;
    case "out":if(LIVE)await sb.auth.signOut();S.user=null;S.profile=null;return render();
    case "cooked":{const r=S.recipes.find(x=>String(x.id)===String(S.id));if(r)await logCook(r);return}
    case "cookmode":S.cook={on:true,step:0};keepAwake(true);return render();
    case "cook-close":S.cook.on=false;keepAwake(false);return render();
    case "cook-prev":S.cook.step=Math.max(0,S.cook.step-1);return render();
    case "cook-next":S.cook.step++;return render();
    case "cook-done":{S.cook.on=false;keepAwake(false);
      const r=S.recipes.find(x=>String(x.id)===String(S.id));if(r)await logCook(r);return}
  }
  if(t.id==="a-swap"){S.authMode=up()?"in":"up";S.err="";return render()}
  if(t.id==="a-go")return doAuth();
  if(t.id==="f-save")return doSave();
});
const up=()=>S.authMode==="up";

function pickPhoto(r){
  const inp=document.createElement("input");
  inp.type="file";inp.accept="image/*";
  inp.onchange=async()=>{if(inp.files[0])await addPhoto(r.id,inp.files[0],r.title)};
  inp.click();
}

let qT;
document.addEventListener("input",e=>{
  if(e.target.id!=="q")return;
  S.q=e.target.value;S.limit=24;
  clearTimeout(qT);
  qT=setTimeout(()=>{const p=$("#q").selectionStart;render();const n=$("#q");if(n){n.focus();n.setSelectionRange(p,p)}},150);
});
document.addEventListener("change",async e=>{
  if(e.target.id==="shotfile"){const f=e.target.files[0];if(f)await addPhoto(e.target.dataset.for,f,(S.recipes.find(x=>x.id===e.target.dataset.for)||{}).title);return}
  if(e.target.id==="f-img"){const f=e.target.files[0];if(!f)return;S.draftImage=await shrink(f,1500);S._file=f;render()}
});
document.addEventListener("keydown",e=>{
  if($("#lb").classList.contains("on")&&e.key==="Escape"){$("#lb").classList.remove("on");return}
  if(S.cook.on){
    if(e.key==="Escape"){S.cook.on=false;keepAwake(false);return render()}
    if(e.key==="ArrowRight"){const r=S.recipes.find(x=>String(x.id)===String(S.id));
      if(r&&S.cook.step<(r.method||[]).length-1){S.cook.step++;render()}return}
    if(e.key==="ArrowLeft"){S.cook.step=Math.max(0,S.cook.step-1);return render()}
  }
  if(e.key==="/"&&S.view==="home"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();const q=$("#q");q&&q.focus()}
  if(e.key==="Enter"&&LIVE&&!S.user&&["a-email","a-pass","a-name","a-rel"].includes(e.target.id))doAuth();
});
$("#lb").addEventListener("click",e=>{if(e.target.id==="lb")e.currentTarget.classList.remove("on")});

/* ---- auth ---- */
async function doAuth(){
  const g=id=>(($("#"+id)||{}).value||"").trim();
  const email=g("a-email"),pass=($("#a-pass")||{}).value,name=g("a-name"),rel=g("a-rel");
  if(!email||!pass){S.err="Enter your email and a password to continue.";return render()}
  if(up()&&!name){S.err="Add your name so the family knows who wrote what.";return render()}
  S.busy=true;S.err="";render();
  try{
    if(up()){
      const {data,error}=await sb.auth.signUp({email,password:pass});
      if(error)throw error;
      if(!data.session){S.busy=false;S.err="Check your email, confirm the link, then sign in.";S.authMode="in";return render()}
      S.user=data.user;
      await sb.from("profiles").insert({id:data.user.id,name,relation:rel||null});
      S.profile={name,relation:rel};
    }else{
      const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
      S.user=data.user;
      const {data:p}=await sb.from("profiles").select("*").eq("id",data.user.id).single();
      S.profile=p||{name:email.split("@")[0]};
    }
    await loadAll();S.busy=false;go("home");
  }catch(err){
    S.busy=false;
    S.err=/Invalid login/i.test(err.message||"")?"That email and password don't match. Try again.":(err.message||"Something went wrong.");
    render();
  }
}

/* ---- parsing ---- */
function parseIng(txt){
  const gs=[];let cur={group:"",items:[]};
  String(txt||"").split("\n").forEach(l=>{l=l.trim();if(!l)return;
    if(/:$/.test(l)){if(cur.items.length)gs.push(cur);cur={group:l.replace(/:$/,""),items:[]}}
    else cur.items.push(l.replace(/^[-*•]\s*/,""))});
  if(cur.items.length)gs.push(cur);return gs;
}
function parseMethod(txt){
  return String(txt||"").split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean).map(b=>{
    const ls=b.split("\n").map(l=>l.trim()).filter(Boolean),f=ls[0];
    if(ls.length>1&&f.length<62&&!/[.!?]$/.test(f))return {title:f.replace(/^\d+[.)]\s*/,""),body:ls.slice(1).join("\n")};
    return {title:"",body:ls.join("\n")};
  }).map((s,i)=>({title:s.title||`Step ${i+1}`,body:s.body}));
}
async function doSave(){
  const v=id=>(($("#"+id)||{}).value||"").trim();
  const title=v("f-title");
  if(!title){S.err="Give it a name — even a rough one.";return render()}
  S.busy=true;S.err="";render();
  try{
    let image=S.draftImage||null;
    if(LIVE&&S._file){
      try{
        const path=`${S.user.id}/${Date.now()}.jpg`;
        const blob=await (await fetch(S.draftImage)).blob();
        const {error}=await sb.storage.from("photos").upload(path,blob,{contentType:"image/jpeg"});
        if(!error)image=sb.storage.from("photos").getPublicUrl(path).data.publicUrl;
      }catch(e){}
    }
    const mum=($("#f-mum")||{}).checked;
    await saveRecipe({title,sub:v("f-sub"),section:mum?"secondi":"ours",kind:"recipe",
      serves:v("f-serves"),prep:v("f-prep"),cook:v("f-cook"),source:mum?"mum":"family",
      image,thumb:image,ingredients:parseIng(v("f-ing")),method:parseMethod(v("f-method")),
      note:v("f-note"),serve_with:"",check:[],book_page:null,
      tags:[v("f-sub").toLowerCase()].filter(Boolean),
      added_by_name:(S.profile&&S.profile.name)||"Family",
      created_at:new Date().toISOString().slice(0,10),cooks:[]});
    S._file=null;S.draftImage=null;S.busy=false;toast("Saved to the book");go("home");
  }catch(err){S.busy=false;S.err=err.message||"Couldn't save that. Try again.";render()}
}

/* ---- boot ---- */
(async()=>{
  if(LIVE){
    const {data:{session}}=await sb.auth.getSession();
    if(session){
      S.user=session.user;
      const {data:p}=await sb.from("profiles").select("*").eq("id",session.user.id).single();
      S.profile=p||{name:session.user.email.split("@")[0]};
    }
  }
  await loadAll();
  S.recipes.forEach(r=>{const t=LS.get("mb-tick-"+r.id,null);if(t)S.ticked[r.id]=t});
  render();
})();
</script>
