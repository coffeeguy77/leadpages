<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mum's Book — her recipes, our family</title>
<meta name="description" content="Her recipes. Our family. Written by Mum. Cooked and shared by all of us.">
<meta name="theme-color" content="#F7F6F3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F6F3; --card:#FFFFFF;
  --ink:#1A1A18; --ink-2:#44443F; --muted:#79796F;
  --line:#E6E4DE; --line-2:#EFEDE8;
  --accent:#EF4A3C; --accent-dk:#D83A2D; --accent-soft:#FDF0EE;
  --sage:#EEF1EA; --sage-2:#E4E9DF; --sage-ink:#4A5A46; --sage-line:#D8DFD2;
  --r-sm:8px; --r:12px; --r-lg:18px;
  --ease:cubic-bezier(.2,.7,.3,1);
  --pad:clamp(18px,4vw,56px); --maxw:1280px;
  --shadow:0 1px 2px rgba(26,26,24,.05),0 8px 24px -12px rgba(26,26,24,.12);
  --shadow-lg:0 2px 6px rgba(26,26,24,.06),0 26px 60px -22px rgba(26,26,24,.28);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 16px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.022em;line-height:1.15}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad)}
.icon{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.sp{flex:1}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:60;background:rgba(247,246,243,.9);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line-2)}
.nav .wrap{display:flex;align-items:center;gap:6px;height:66px}
.brand{font-weight:800;font-size:16px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.brand b{font-weight:500}
.nlink{font-size:14.5px;font-weight:500;color:var(--ink-2);padding:8px 12px;border-radius:999px;white-space:nowrap;transition:.16s var(--ease)}
.nlink:hover{background:rgba(26,26,24,.05);color:var(--ink)}
.nlink.on{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.nlink.add{color:var(--accent);font-weight:600}
.nlink.add:hover{background:var(--accent-soft)}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:999px;color:var(--ink-2);font-size:18px;transition:.16s var(--ease)}
.iconbtn:hover{background:rgba(26,26,24,.06);color:var(--ink)}
.who{display:flex;align-items:center;gap:8px;padding-left:10px;margin-left:4px;border-left:1px solid var(--line)}
.av{width:30px;height:30px;border-radius:999px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
@media(max-width:860px){.who .nm{display:none}}
@media(max-width:680px){
  .nav .wrap{gap:1px;height:60px}.brand{font-size:13px;letter-spacing:.04em}
  .nlink{padding:8px 8px;font-size:13.5px}
  .nlink.add{font-size:0;padding:8px 10px}
  .nlink.add::before{content:"+";font-size:19px;font-weight:600;line-height:1}
}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14.5px;font-weight:600;
  padding:11px 18px;border-radius:999px;transition:.16s var(--ease);white-space:nowrap;line-height:1}
.btn .icon{font-size:16px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dk)}
.btn-dark{background:var(--ink);color:#fff}.btn-dark:hover{background:#000}
.btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{border-color:#CFCCC4}
.btn-lg{padding:14px 24px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.78fr);gap:clamp(24px,4vw,56px);align-items:start;padding:clamp(26px,4.5vw,54px) 0 6px}
.hero h1{font-size:clamp(38px,5.8vw,62px);font-weight:800;letter-spacing:-.035em;line-height:1.03}
.hero .lede{color:var(--muted);font-size:16.5px;margin:14px 0 0;max-width:40ch}
.searchrow{position:relative;margin:22px 0 0;max-width:420px}
.searchrow input{width:100%;padding:13px 16px 13px 44px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:15px;transition:.16s var(--ease)}
.searchrow input::placeholder{color:#9A998F}
.searchrow input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(26,26,24,.07)}
.searchrow .si{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:17px;pointer-events:none}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0}
.pill{font-size:13.5px;font-weight:500;padding:9px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink-2);transition:.16s var(--ease)}
.pill:hover{border-color:#CFCCC4;color:var(--ink)}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

.heropic{display:flex;flex-direction:column;gap:10px}
.heropic .frame{border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-lg);cursor:pointer;background:#F2E6CF;
  max-height:330px;transition:transform .2s var(--ease)}
.heropic .frame:hover{transform:translateY(-2px)}
.heropic .frame img{width:100%;object-fit:cover;object-position:top center}
.herometa{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.shuffle{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);padding:6px 10px;border-radius:999px;transition:.16s var(--ease)}
.shuffle:hover{background:rgba(26,26,24,.06);color:var(--accent)}
@media(max-width:900px){.hero{grid-template-columns:1fr}.heropic{order:-1}}

/* ---------- section heads ---------- */
.sechead{display:flex;align-items:baseline;gap:14px;margin:40px 0 18px}
.sechead h2{font-size:clamp(20px,2.3vw,26px)}
.seeall{font-size:14px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;transition:.16s var(--ease)}
.seeall:hover{color:var(--accent);gap:9px}
.cnt{font-size:14px;color:var(--muted)}

/* ---------- recipe card (sage band holds title, page, category, photo) ---------- */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.rc{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-lg);overflow:hidden;
  display:flex;flex-direction:column;transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease)}
.rc:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--line)}
.rc .shot{aspect-ratio:1/1.02;overflow:hidden;background:#F2E6CF;cursor:pointer;position:relative}
.rc .shot img{width:100%;height:100%;object-fit:cover;object-position:top center;transition:transform .45s var(--ease)}
.rc:hover .shot img{transform:scale(1.035)}
.rc .shot.none{display:grid;place-items:center;padding:22px;text-align:center;
  background:linear-gradient(#F7EDDB,#EFE1C4);
  box-shadow:inset 0 0 0 1px rgba(226,212,182,.7)}
.rc .shot.none span{font-size:15.5px;font-weight:650;color:#6B5E42;line-height:1.3}
.tag{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.94);color:var(--ink-2);font-size:10.5px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;padding:5px 9px;border-radius:999px}
.band{background:var(--sage);border-top:1px solid var(--sage-line);padding:13px 15px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.band h3{font-size:15.5px;font-weight:650;line-height:1.3;color:var(--ink);cursor:pointer;min-height:2.6em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.band .mt{font-size:13px;color:var(--sage-ink);opacity:.85}
.band .mt .pg{font-weight:600;text-decoration:underline;text-underline-offset:2px;text-decoration-color:rgba(74,90,70,.3);cursor:pointer}
.band .mt .pg:hover{color:var(--accent);text-decoration-color:var(--accent)}
.band .act{margin-top:9px;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--accent);
  padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid var(--sage-line);align-self:flex-start;transition:.16s var(--ease)}
.band .act:hover{background:#fff}

.empty{text-align:center;padding:62px 24px;background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-lg)}
.empty h3{font-size:19px;margin-bottom:8px}
.empty p{color:var(--muted);max-width:42ch;margin:0 auto 20px}

/* ---------- family kitchen band ---------- */
.kband{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:var(--sage);border:1px solid var(--sage-line);
  border-radius:var(--r-lg);padding:22px 26px;margin:30px 0 0}
.kband .bi{font-size:34px;color:var(--sage-ink);opacity:.55;flex:none}
.kband h3{font-size:18px;color:var(--sage-ink)}
.kband p{margin:4px 0 0;font-size:14.5px;color:var(--sage-ink);opacity:.8}

/* ---------- contents / index ---------- */
.idxhead{padding:clamp(26px,4vw,46px) 0 0;max-width:720px}
.idxhead h1{font-size:clamp(30px,4.6vw,46px);font-weight:800;letter-spacing:-.032em}
.idxhead p{color:var(--muted);margin:10px 0 0;font-size:16px}
.idxtools{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin:24px 0 0}
.idxtools .searchrow{margin:0;flex:1;min-width:240px;max-width:520px}
.sortby label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.sortby select{padding:12px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:14.5px;cursor:pointer}
.sortby select:focus{outline:none;border-color:var(--ink)}
.idxgroup{margin-top:34px}
.idxgroup .gh{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.idxgroup .gh h2{font-size:21px}
.idxgroup .gh span{font-size:13.5px;color:var(--muted)}
.idxrows{border-top:1px solid var(--line-2)}
.idxrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line-2);transition:.14s var(--ease)}
.idxrow:hover{background:var(--card);padding-left:10px;padding-right:10px;border-radius:var(--r-sm)}
.idxrow .rt{font-size:15.5px;font-weight:500;flex:1;min-width:0}
.idxrow .rp{font-size:14px;color:var(--muted);white-space:nowrap}
.idxrow .rch{color:#B8B6AD;font-size:16px}
.idxrow.hit{background:var(--accent-soft);border-radius:var(--r-sm);padding-left:10px;padding-right:10px;
  box-shadow:inset 3px 0 0 var(--accent);animation:ping 2.2s var(--ease)}
@keyframes ping{0%,55%{background:var(--accent-soft)}100%{background:transparent}}
.idxfoot{display:flex;align-items:center;gap:16px;background:var(--sage);border:1px solid var(--sage-line);border-radius:var(--r-lg);padding:20px 24px;margin:36px 0 60px}
.idxfoot .bi{font-size:30px;color:var(--sage-ink);opacity:.55}
.idxfoot h4{font-size:15px;color:var(--sage-ink)}
.idxfoot p{margin:3px 0 0;font-size:13.5px;color:var(--sage-ink);opacity:.8}

/* ---------- recipe detail ---------- */
.back{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--muted);padding:24px 0 0;transition:.16s var(--ease)}
.back:hover{color:var(--ink);gap:10px}
.dhead h1{font-size:clamp(28px,4.2vw,42px);letter-spacing:-.03em;max-width:22ch;margin-top:16px}
.dsub{color:var(--muted);font-size:16px;margin:10px 0 0;max-width:62ch}
.metarow{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin:20px 0 0;padding-bottom:22px;border-bottom:1px solid var(--line-2)}
.meta{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;color:var(--ink-2)}
.meta .icon{font-size:17px;color:var(--muted)}
.meta.pg{cursor:pointer;border-radius:999px;padding:4px 10px;margin:-4px -10px;transition:.14s var(--ease)}
.meta.pg:hover{background:var(--accent-soft);color:var(--accent)}
.metarow .acts{display:flex;gap:10px;flex-wrap:wrap}
.dcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:clamp(26px,4vw,52px);margin:28px 0 0;align-items:start}
@media(max-width:940px){.dcols{grid-template-columns:1fr;gap:30px}}
.dcols h2{font-size:21px;margin-bottom:12px}

/* shared recipe render */
.ingblock{margin-bottom:22px}
.ingblock h4{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.ings{list-style:none;margin:0;padding:0}
.ings li{border-bottom:1px solid var(--line-2)}
.ings li:last-child{border-bottom:0}
.ck{display:flex;align-items:flex-start;gap:11px;padding:7px 2px;cursor:pointer;font-size:15.5px;line-height:1.5;width:100%;text-align:left;transition:.14s var(--ease)}
.box{width:17px;height:17px;border:1.5px solid #C9C6BE;border-radius:5px;flex:none;margin-top:3px;display:grid;place-items:center;transition:.14s var(--ease)}
.box .icon{font-size:12px;color:#fff;opacity:0;stroke-width:3}
.ck.done .box{background:var(--accent);border-color:var(--accent)}
.ck.done .box .icon{opacity:1}
.ck.done .tx{color:#A9A79E;text-decoration:line-through}
.stp{display:flex;gap:14px;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line-2)}
.stp:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.stp .n{width:26px;height:26px;border-radius:999px;background:#F1EFE9;color:var(--ink-2);font-size:12.5px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:1px}
.stp h4{font-size:15px;font-weight:650;margin-bottom:5px}
.stp p{margin:0 0 7px;font-size:15.5px;line-height:1.62;color:var(--ink-2)}
.stp p:last-child{margin-bottom:0}

.scanbox{position:sticky;top:84px}
.scanwrap{position:relative;background:#F2E6CF;border:1px solid #E2D4B6;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.scanwrap img{width:100%}
.expand{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:999px;background:rgba(255,255,255,.95);
  display:grid;place-items:center;font-size:15px;color:var(--ink-2);box-shadow:0 2px 8px rgba(0,0,0,.12);transition:.16s var(--ease)}
.expand:hover{background:#fff;transform:scale(1.06)}
.scancap{text-align:center;font-size:13px;color:var(--muted);margin-top:10px}

.callout{display:flex;gap:12px;background:var(--accent-soft);border-radius:var(--r);padding:16px 18px;margin:26px 0 0}
.callout .ci{color:var(--accent);font-size:18px;flex:none;margin-top:2px}
.callout h4{font-size:13.5px;font-weight:700;color:var(--accent);margin-bottom:3px}
.callout p{margin:0;font-size:15px;line-height:1.55;color:var(--ink-2)}
.callout.check{background:#FFF8E8}
.callout.check .ci,.callout.check h4{color:#A07A1C}
.callout.check ul{margin:6px 0 0;padding-left:18px;font-size:14.5px;color:var(--ink-2)}

/* family kitchen section — sage throughout */
.kitchen{background:var(--sage);border:1px solid var(--sage-line);border-radius:var(--r-lg);padding:26px 28px;margin:30px 0 60px}
.kitchen h3{font-size:19px;color:var(--sage-ink)}
.kitchen .ksub{margin:6px 0 18px;font-size:14.5px;color:var(--sage-ink);opacity:.8}
.kgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:24px;align-items:start}
@media(max-width:820px){.kgrid{grid-template-columns:1fr}}
.dropzone{border:1.5px dashed var(--sage-line);border-radius:var(--r);padding:24px;text-align:center;background:var(--sage-2);transition:.16s var(--ease);cursor:pointer;display:block}
.dropzone:hover{border-color:var(--accent);background:#E9EEE4}
.dropzone .dz2{font-size:12.5px;color:var(--sage-ink);opacity:.8;margin-top:10px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.shot-card{background:var(--sage-2);border:1px solid var(--sage-line);border-radius:var(--r);overflow:hidden}
.shot-card img{width:100%;aspect-ratio:1/1;object-fit:cover}
.shot-card .sm{padding:8px 10px;font-size:12.5px;color:var(--sage-ink);opacity:.9}
.shot-card .sm b{font-weight:600}
.knone{font-size:14.5px;color:var(--sage-ink);opacity:.75;font-style:italic}

/* ---------- cooking mode ---------- */
.cook{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column}
.cook.on{display:flex}
.cook-top{display:flex;align-items:center;gap:14px;padding:16px var(--pad);border-bottom:1px solid var(--line-2)}
.cook-top .ct{font-size:15px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cook-bar{height:3px;background:var(--line-2);margin:0 var(--pad)}
.cook-bar i{display:block;height:100%;background:var(--accent);transition:width .3s var(--ease)}
.cook-body{flex:1;overflow:auto;display:grid;place-items:center;padding:30px var(--pad)}
.cook-in{max-width:720px;width:100%}
.cook-in .sn{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.cook-in h2{font-size:clamp(26px,4.4vw,40px);margin:12px 0 18px}
.cook-in p{font-size:clamp(17px,2.1vw,20px);line-height:1.62;color:var(--ink-2);margin:0 0 12px}
.cook-ing{margin-top:28px;border-top:1px solid var(--line-2);padding-top:16px}
.cook-ing summary{font-size:14.5px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.cook-foot{display:flex;gap:12px;align-items:center;padding:16px var(--pad) calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line-2);background:var(--card)}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:210;background:rgba(20,20,18,.9);display:none;place-items:center;padding:24px;overflow:auto}
.lb.on{display:grid}
.lb img{max-width:min(940px,100%);border-radius:var(--r);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.lb .x{position:fixed;top:18px;right:20px;width:40px;height:40px;border-radius:999px;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center;font-size:18px}

/* ---------- editor ---------- */
.edhead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;padding:26px 0 0}
.edhead h1{font-size:clamp(26px,3.6vw,38px);letter-spacing:-.03em}
.edhead p{color:var(--muted);margin:8px 0 0;font-size:15.5px}
.edcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:clamp(24px,3vw,44px);margin:26px 0 60px;align-items:start}
@media(max-width:1020px){.edcols{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:clamp(20px,2.4vw,28px)}
.field{margin-bottom:16px}
.field label,.flabel{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.flabel .opt{font-weight:400;color:var(--muted)}
.field .hlp{font-size:13px;color:var(--muted);margin:0 0 7px}
.field input,.field textarea,.field select,.rowin{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;font-size:14.5px;transition:.16s var(--ease)}
.field textarea{resize:vertical;min-height:78px;line-height:1.55;font-family:inherit}
.field input:focus,.field textarea:focus,.field select:focus,.rowin:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(26,26,24,.07)}
.req{color:var(--accent)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:620px){.g2,.g3{grid-template-columns:1fr}}

/* ---------- Shaun's own recipe ---------- */
const SEED=[{
 id:"own-chicken",title:"Creamy white wine & herb braised chicken",sub:"Chicken",section:"ours",kind:"recipe",
 serves:"8–10",temp_c:null,time_value:"1.5-2",time_unit:"hrs",source:"family",added_by_name:"Shaun",
 created_at:"2026-08-16",image:"",thumb:"",credit:"",
 ingredients:[
  {group:"Chicken",items:["2 kg bone-in chicken thighs, skin-on ideally","120 g plain flour","2 tsp fine salt","1½ tsp freshly ground black pepper","1 tsp chicken powder","40 g butter","1–2 tbsp neutral oil"]},
  {group:"Braise",items:["2 large brown onions (≈400 g), finely diced","3 medium carrots (≈300 g), diced","4 celery stalks (≈250 g), diced","300 g small whole button mushrooms","300 ml dry white wine","1 litre ginger-garlic Hainanese chicken stock","2 tsp chicken powder","1 tsp MSG","5–6 sprigs fresh thyme","2 sprigs fresh rosemary","3 bay leaves","½–1 tsp black pepper, to taste","Salt, only as required after reducing"]},

  {title:"Flour & brown the chicken",body:"Combine the flour, salt, pepper and 1 tsp chicken powder. Toss the thighs through the seasoned flour and shake away the excess.\nHeat a large heavy casserole over medium-high. Add the oil and butter, then brown the chicken in batches until deeply golden on both sides. Don't try to cook it through. Remove and set aside."},

  {title:"Deglaze with white wine",body:"Pour in the 300 ml of wine and scrape the base thoroughly to release all the fond. Let it bubble and reduce for 3–5 minutes, until the harsh alcohol smell has gone."},
  {title:"Braise low and slow",body:"Return the chicken. Pour in the litre of ginger-garlic stock and add the chicken powder, MSG, thyme, rosemary, bay leaves and pepper. The liquid doesn't need to drown the chicken — this is a braise, not a soup.\nBring to a bare simmer, cover partially, and cook on very low heat for at least an hour, preferably 75–90 minutes, until the chicken is falling apart."},

/* ---------- state ---------- */
const S={user:null,profile:null,people:[],recipes:[],photos:{},view:"home",id:null,

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nl2p=s=>String(s||"").split(/\n+/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join("");

/* ====================================================================
   SHARED RECIPE RENDERER — one component for her pages, personal
   recipes and the editor preview.
   ==================================================================== */
/* ---- fractions: 1 1/4 reads as 1¼ ---- */
const FRAC={"1/2":"½","1/3":"⅓","2/3":"⅔","1/4":"¼","3/4":"¾","1/5":"⅕","2/5":"⅖","3/5":"⅗","4/5":"⅘",
            "1/6":"⅙","5/6":"⅚","1/8":"⅛","3/8":"⅜","5/8":"⅝","7/8":"⅞","1/7":"⅐","1/9":"⅑","1/10":"⅒"};
const FRAC_CHIPS=["½","⅓","⅔","¼","¾","⅛","⅜","⅝","⅞","⅙","⅕"];
function prettyFrac(s){
  if(typeof s!=="string"||s.indexOf("/")<0)return s;
  return s
    // whole number + space + fraction:  1 1/4 -> 1¼
    .replace(/(^|[^\d])(\d+)[  ]+(\d+\/\d+)(?!\d)/g,(m,p,w,f)=>FRAC[f]?p+w+FRAC[f]:m)
    // bare fraction: 1/4 -> ¼   (leaves 50/50 and 1/16 alone — it's a lookup, not a pattern)
    .replace(/(^|[^\d\/])(\d+\/\d+)(?!\d)/g,(m,p,f)=>FRAC[f]?p+FRAC[f]:m);
}

function ingText(i){
  if(typeof i==="string")return prettyFrac(i);
  if(!i)return "";
  return prettyFrac([i.qty,i.unit,i.name].filter(x=>String(x||"").trim()).join(" ").trim());
}
function normalise(r){
  // accepts either {group,items:[string|{qty,unit,name}]} or a flat editor list
  const groups=(r.ingredients||[]).map(g=>Array.isArray(g)?{group:"",items:g}:g);
  return {...r,ingredients:groups};
}
function renderIngredients(r,opts){
  const o=opts||{},tick=o.tick?(S.ticked[r.id]||{}):null;
  let n=-1;
  const out=normalise(r).ingredients.map(g=>{
    const items=(g.items||[]).map(i=>{
      const t=ingText(i); if(!t)return "";
      n++; const k=n;
      return o.tick
        ? `<li><button class="ck ${tick[k]?"done":""}" data-tick="${k}"><span class="box">${ic("check")}</span><span class="tx">${esc(t)}</span></button></li>`
        : `<li><span class="ck"><span class="box"></span><span class="tx">${esc(t)}</span></span></li>`;
    }).filter(Boolean).join("");
    if(!items)return "";
    return `<div class="ingblock">${g.group?`<h4>${esc(g.group)}</h4>`:""}<ul class="ings">${items}</ul></div>`;
  }).filter(Boolean).join("");
  return out||`<p style="color:var(--muted);font-size:14.5px">No ingredients yet.</p>`;
}
function renderMethod(r){
  const steps=(r.method||[]).filter(m=>String(m.body||m.title||"").trim());
  if(!steps.length)return `<p style="color:var(--muted);font-size:14.5px">No method yet.</p>`;
  return steps.map((m,i)=>`<div class="stp"><div class="n">${i+1}</div>
    <div>${m.title?`<h4>${esc(m.title)}</h4>`:""}${nl2p(m.body)}</div></div>`).join("");
}
function metaBits(r,clickablePage){

    ? `<button class="meta pg" data-page="${r.book_page}" title="Open the index here">${ic("book")} Page ${r.book_page}</button>`
    : `<span class="meta">${ic("book")} Page ${r.book_page}</span>`);
  return out.join("");
}

/* ---------- data ---------- */
async function loadBook(){try{const r=await fetch("recipes.json",{cache:"no-cache"});return r.ok?await r.json():[]}catch(e){return []}}
async function loadAll(){
  const book=await loadBook();
  const base=[{name:"Mum",relation:"Wrote the book"},{name:"Shaun",relation:"Typed it all up"}];
  if(!LIVE){S.recipes=[...SEED.map(r=>({...r})),...book];S.people=base;return}
  const [{data:rs},{data:ps},{data:ph}]=await Promise.all([
    sb.from("recipes").select("*").order("created_at",{ascending:false}),
    sb.from("profiles").select("*").order("joined_at",{ascending:true}),
    sb.from("photos").select("*").order("created_at",{ascending:false})]);
  S.recipes=[...SEED.map(r=>({...r})),...(rs||[]).map(r=>({...r,cooks:r.cooks||[]})),...book];
  S.people=(ps&&ps.length)?[...base,...ps]:base;
  (ph||[]).forEach(p=>{(S.photos[p.recipe_key]=S.photos[p.recipe_key]||[]).push(p)});
}
const toDataURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
async function shrink(file,max,rot){
  const url=await toDataURL(file);
  return await new Promise(res=>{
    const im=new Image();
    im.onload=()=>{
      const s=Math.min(1,max/Math.max(im.width,im.height));
      const w=Math.round(im.width*s),h=Math.round(im.height*s);
      const turned=((rot||0)/90)%2!==0;
      const c=document.createElement("canvas");
      c.width=turned?h:w;c.height=turned?w:h;
      const x=c.getContext("2d");
      x.translate(c.width/2,c.height/2);x.rotate((rot||0)*Math.PI/180);
      x.drawImage(im,-w/2,-h/2,w,h);
      res(c.toDataURL("image/jpeg",.82));
    };
    im.onerror=()=>res(url);im.src=url;
  });
}
async function logCook(r){
  const e={by:(S.profile&&S.profile.name)||"Someone",on:new Date().toISOString().slice(0,10)};

async function addPhoto(key,file,title){
  const small=await shrink(file,1400,0);
  const by=(S.profile&&S.profile.name)||"Someone";
  const entry={recipe_key:key,recipe_title:title,url:small,by_name:by,created_at:new Date().toISOString(),local:!LIVE};
  if(LIVE){
    try{
      const path=`${S.user.id}/${Date.now()}.jpg`;
      const blob=await (await fetch(small)).blob();
      const {error}=await sb.storage.from("photos").upload(path,blob,{contentType:"image/jpeg"});
      if(error)throw error;
      entry.url=sb.storage.from("photos").getPublicUrl(path).data.publicUrl;entry.local=false;
      await sb.from("photos").insert({recipe_key:key,recipe_title:title,url:entry.url,by_name:by});
    }catch(e){toast("Couldn't upload — showing it here only")}
  }
  (S.photos[key]=S.photos[key]||[]).unshift(entry);
  toast(LIVE?"Shared with the family":"Added — on this device only");render();
}

/* ---------- search ---------- */
function hay(r){
  if(r._h)return r._h;
  r._h=[r.title,r.sub,r.note,r.credit,r.serve_with,r.added_by_name,(r.tags||[]).join(" "),SECTIONS[r.section]||r.section,
    normalise(r).ingredients.map(g=>g.group+" "+(g.items||[]).map(ingText).join(" ")).join(" "),
    (r.method||[]).map(m=>m.title+" "+m.body).join(" "),
    r.book_page?("page "+r.book_page):""].join(" ").toLowerCase();
  return r._h;
}
const RANK={recipe:0,art:1,divider:2,front:3,index:4,notes:4};
function match(list,q,filter){
  const w=String(q||"").trim().toLowerCase().split(/\s+/).filter(Boolean);
  return list.filter(r=>{
    const back=["index","notes","front"].includes(r.kind);
    if(filter==="ours"){if(r.source==="mum")return false}
    else if(filter==="art"){if(r.kind!=="art")return false}
    else if(filter!=="all"){if(r.section!==filter)return false}
    else if(back&&!w.length)return false;
    if(!w.length)return true;
    const h=hay(r);return w.every(x=>h.includes(x));
  }).sort((a,b)=>(RANK[a.kind]??9)-(RANK[b.kind]??9));
}
const allRecipes=()=>S.recipes.filter(r=>r.kind==="recipe");
const recentCooks=()=>{const o=[];S.recipes.forEach(r=>(r.cooks||[]).forEach(c=>o.push({...c,title:r.title,id:r.id})));
  return o.sort((a,b)=>new Date(b.on)-new Date(a.on)).slice(0,6)};
function pickHero(){
  const pool=allRecipes().filter(r=>r.image&&(r.method||[]).length);
  if(!pool.length)return null;
  let n=pool[Math.floor(Math.random()*pool.length)];
  if(pool.length>1){let guard=0;while(n.id===S.heroId&&guard++<8)n=pool[Math.floor(Math.random()*pool.length)]}
  return n.id;
}

  allRecipes().forEach(r=>{const k=r.added_by_name||"Family";counts[k]=(counts[k]||0)+1});
  const cred={};
  allRecipes().forEach(r=>{if(r.credit)cred[r.credit]=(cred[r.credit]||0)+1});
  const top=Object.entries(cred).sort((a,b)=>b[1]-a[1]).slice(0,20);
  return `${vNav()}<main class="wrap">
    <div class="idxhead"><h1>The family</h1><p>Anyone in the family can join and add to the book.</p></div>
    <div class="people">${S.people.map(p=>`<div class="person"><div class="av">${esc(inits(p.name))}</div>
      <div><div class="pn">${esc(p.name)}</div><div class="pr">${esc(p.relation||"Family")}${counts[p.name]?` &middot; ${counts[p.name]} recipes`:""}</div></div></div>`).join("")}</div>
    ${top.length?`<div class="sechead" style="margin-top:40px"><h2>Credited in her pages</h2></div>
      <p style="color:var(--muted);font-size:15px;margin:-8px 0 0">Names she wrote beside the recipes — the friends and family who gave her the dish.</p>
      <div class="namechips">${top.map(([n,c])=>`<button class="namechip" data-search="${esc(n)}">${esc(n)}${c>1?` &middot; ${c}`:""}</button>`).join("")}</div>`:""}
    <div class="note" style="margin-top:32px;max-width:640px"><strong>Inviting someone.</strong> Send them this address.
      ${LIVE?`They pick "Join the family book" and they're in.`:`It's open to anyone with the link at the moment.`}</div>
  </main>${vFoot()}`;
}

function vAuth(){
  const up=S.authMode==="up";
  return `<div class="authpage"><div class="authcard fade"><h1>Mum's Book</h1>
    <p class="lede">${up?"Add your name to the book. You'll be able to read every recipe and add your own.":"Welcome back. The kettle's on."}</p>
    <div class="panel">${S.err?`<p class="err">${esc(S.err)}</p>`:""}
      ${up?`<div class="field"><label for="a-name">Your name</label><input id="a-name" placeholder="Shaun" autocomplete="name"></div>
      <div class="field"><label for="a-rel">Who you are in this family</label><input id="a-rel" placeholder="Her son &middot; Grandson"></div>`:""}
      <div class="field"><label for="a-email">Email</label><input id="a-email" type="email" autocomplete="email" placeholder="you@example.com"></div>
      <div class="field"><label for="a-pass">Password</label><input id="a-pass" type="password" autocomplete="${up?"new-password":"current-password"}" placeholder="At least 6 characters"></div>
      <button class="btn btn-primary btn-lg" id="a-go" style="width:100%" ${S.busy?"disabled":""}>${S.busy?"One moment…":(up?"Join the book":"Sign in")}</button>
      <p class="swap">${up?"Already in the book?":"First time here?"} <button id="a-swap">${up?"Sign in":"Join"}</button></p>
    </div></div></div>`;
}

function vCook(){
  const r=S.recipes.find(x=>String(x.id)===String(S.id));if(!r)return "";
  const steps=(r.method||[]).filter(m=>String(m.body||m.title||"").trim());
  const i=Math.min(S.cook.step,steps.length-1),m=steps[i]||{};
  return `<div class="cook-top"><button class="iconbtn" data-act="cook-close" aria-label="Close">${ic("x")}</button>
      <div class="ct">${esc(r.title)}</div><div class="cnt">${i+1} / ${steps.length}</div></div>
    <div class="cook-bar"><i style="width:${((i+1)/steps.length)*100}%"></i></div>
    <div class="cook-body"><div class="cook-in"><div class="sn">Step ${i+1}</div>
      <h2>${esc(m.title||"")}</h2>${nl2p(m.body)}
      <details class="cook-ing"><summary>Ingredients</summary>${renderIngredients(r,{tick:true})}</details></div></div>
    <div class="cook-foot"><button class="btn btn-ghost btn-lg" data-act="cook-prev" ${i===0?"disabled":""}>Back</button>
      <div class="sp"></div>
      ${i<steps.length-1?`<button class="btn btn-dark btn-lg" data-act="cook-next">Next step ${ic("arrow")}</button>`
        :`<button class="btn btn-primary btn-lg" data-act="cook-done">${ic("check")} Done — I cooked this</button>`}</div>`;
}

const vFoot=()=>{
  const n=allRecipes().length,a=S.recipes.filter(r=>r.kind==="art").length;
  return `<footer class="foot">${n} recipes &middot; ${a} paintings &middot; kept for the family</footer>`;
};

/* ====================================================================
   RENDER + EVENTS
   ==================================================================== */
function render(){
  const app=$("#app");
  if(LIVE&&!S.user){app.innerHTML=vAuth();return}
  app.innerHTML=({home:vHome,contents:vContents,recipe:vRecipe,create:vCreate,family:vFamily}[S.view]||vHome)();
  const c=$("#cook");c.className="cook"+(S.cook.on?" on":"");c.innerHTML=S.cook.on?vCook():"";
  if(S.view==="contents"&&S.idxJump){
    const el=document.getElementById("row-"+S.idxJump);
    if(el){el.classList.add("hit");el.scrollIntoView({block:"center",behavior:"smooth"})}
    S.idxJump=null;
  }
}
let wake=null;
async function keepAwake(on){try{
  if(on&&"wakeLock" in navigator)wake=await navigator.wakeLock.request("screen");
  else if(wake){wake.release();wake=null}}catch(e){}}

function openIndexAtPage(page){
  const r=allRecipes().find(x=>String(x.book_page)===String(page));
  S.idxq="";S.idxFilter="all";S.idxSort="book";S.idxJump=r?r.id:null;
  go("contents");
}

/* keep the chip palette from stealing focus off the quantity field */
document.addEventListener("mousedown",e=>{if(e.target.closest("[data-frac]"))e.preventDefault()});
document.addEventListener("focusin",e=>{
  const el=e.target;
  if(el&&el.dataset&&el.dataset.ing==="qty")S.lastQty=+el.dataset.i;
});

document.addEventListener("click",async ev=>{
  const t=ev.target.closest("[data-nav],[data-open],[data-filter],[data-idxfilter],[data-act],[data-tick],[data-zoom],[data-search],[data-photo],[data-page],[data-delrow],[data-frac],#a-go,#a-swap");
  if(!t)return;const d=t.dataset;
  if(d.frac){
    if(!S.ed)return;
    const i=(S.lastQty!=null&&S.ed.ings[S.lastQty])?S.lastQty:0;
    S.ed.ings[i].qty=(S.ed.ings[i].qty||"")+d.frac;
    render();
    setTimeout(()=>{const n=document.querySelector(`[data-ing="qty"][data-i="${i}"]`);
      if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}},0);
    return;
  }
  if(d.page){ev.stopPropagation();return openIndexAtPage(d.page)}
  if(d.nav){ev.preventDefault();if(d.nav==="create"&&!S.ed)S.ed=blankEd();return go(d.nav)}
  if(d.open)return go("recipe",d.open);
  if(d.filter){S.filter=d.filter;return render()}
  if(d.idxfilter){S.idxFilter=d.idxfilter;return render()}
  if(d.search){S.idxq=d.search;S.idxFilter="all";return go("contents")}
  if(d.zoom){$("#lb-img").src=d.zoom;$("#lb").classList.add("on");return}
  if(d.photo){const r=S.recipes.find(x=>String(x.id)===String(d.photo));if(r)pickPhoto(r);return}
  if(d.tick!==undefined){const k=S.id,tk=S.ticked[k]=S.ticked[k]||{};tk[d.tick]=!tk[d.tick];LS.set("mb-tick-"+k,tk);return render()}
  if(d.delrow){const n=+d.i;if(d.delrow==="ing")S.ed.ings.splice(n,1);else S.ed.steps.splice(n,1);return render()}
  switch(d.act){
    case "focus-search":{if(S.view!=="home")go("home");setTimeout(()=>{const q=$("#q");q&&q.focus()},60);return}
    case "clear":S.q="";S.filter="all";return render();
    case "idx-clear":S.idxq="";S.idxFilter="all";return render();
    case "see-all":S.idxq=S.q;S.idxFilter=S.filter;return go("contents");
    case "shuffle":S.heroId=pickHero();return render();
    case "lb-close":$("#lb").classList.remove("on");return;
    case "out":if(LIVE)await sb.auth.signOut();S.user=null;S.profile=null;return render();
    case "cooked":{const r=S.recipes.find(x=>String(x.id)===String(S.id));if(r)await logCook(r);return}
    case "cookmode":S.cook={on:true,step:0};keepAwake(true);return render();
    case "cook-close":S.cook.on=false;keepAwake(false);return render();
    case "cook-prev":S.cook.step=Math.max(0,S.cook.step-1);return render();
    case "cook-next":S.cook.step++;return render();
    case "cook-done":{S.cook.on=false;keepAwake(false);const r=S.recipes.find(x=>String(x.id)===String(S.id));if(r)await logCook(r);return}
    case "frac-toggle":S.ed.showFrac=!S.ed.showFrac;return render();
    case "add-ing":S.ed.ings.push({qty:"",unit:"",name:""});return render();
    case "add-step":S.ed.steps.push({title:"",body:""});return render();
    case "img-rotate":S.ed.rot=((S.ed.rot||0)+90)%360;
      if(S.ed._file)S.ed.image=await shrink(S.ed._file,1500,S.ed.rot);return render();
    case "img-replace":case "img-crop":$("#e-img").click();return;
    case "ed-preview":{const el=document.querySelector(".prevcard");el&&el.scrollIntoView({behavior:"smooth",block:"start"});return}
    case "ed-save":return saveRecipe();
  }
  if(t.id==="a-swap"){S.authMode=S.authMode==="up"?"in":"up";S.err="";return render()}
  if(t.id==="a-go")return doAuth();
});

/* editor + search inputs */
let qT;
document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.id==="q"||el.id==="idxq"){
    const key=el.id==="q"?"q":"idxq";S[key]=el.value;
    clearTimeout(qT);qT=setTimeout(()=>{const p=el.selectionStart;render();
      const n=document.getElementById(el.id);if(n){n.focus();n.setSelectionRange(p,p)}},160);
    return;
  }
  if(!S.ed)return;
  if(el.dataset.ed!==undefined){S.ed[el.dataset.ed]=el.value;return schedulePreview()}
  if(el.dataset.ing!==undefined){
    let v=el.value;
    if(el.dataset.ing==="qty"){
      const pv=prettyFrac(v);
      if(pv!==v){
        const pos=el.selectionStart;
        const newPos=prettyFrac(v.slice(0,pos)).length;
        el.value=v=pv;
        try{el.setSelectionRange(newPos,newPos)}catch(x){}
      }
    }
    S.ed.ings[+el.dataset.i][el.dataset.ing]=v;
    return schedulePreview();
  }
  if(el.dataset.step!==undefined){S.ed.steps[+el.dataset.i][el.dataset.step]=el.value;return schedulePreview()}
});
document.addEventListener("change",async ev=>{
  const el=ev.target;
  if(el.id==="sortsel"){S.idxSort=el.value;return render()}
  if(el.dataset&&el.dataset.ed==="time_unit"){S.ed.time_unit=el.value;return schedulePreview()}
  if(el.dataset&&el.dataset.ing==="unit"){S.ed.ings[+el.dataset.i].unit=el.value;return schedulePreview()}
  if(el.id==="shotfile"){const f=el.files[0];if(f)await addPhoto(el.dataset.for,f,(S.recipes.find(x=>x.id===el.dataset.for)||{}).title);return}
  if(el.id==="e-img"){const f=el.files[0];if(!f)return;S.ed._file=f;S.ed.rot=0;S.ed.image=await shrink(f,1500,0);return render()}
});
/* live preview without stealing focus from the field being typed in */
let pT;
function schedulePreview(){
  clearTimeout(pT);
  pT=setTimeout(()=>{
    const host=document.querySelector(".prevcard");if(!host)return;
    const prev=edToRecipe(S.ed);
    host.innerHTML=`<div class="ph">Recipe preview</div><div class="psub">This is how your recipe will look.</div>
      <div class="prevtitle">${esc(prev.title)}</div>
      ${metaBits(prev,false)?`<div class="prevmeta">${metaBits(prev,false)}</div>`:""}
      <h2 style="font-size:16px;margin:14px 0 8px">Ingredients</h2>${renderIngredients(prev,{tick:false})}
      <h2 style="font-size:16px;margin:18px 0 8px">Method</h2>${renderMethod(prev)}
      ${noteBlock(prev)||`<div class="callout" style="opacity:.55">${ic("heart","ci")}<div><h4>Author's note</h4>
        <p style="font-style:italic">A tip, memory or serving suggestion in your own words.</p></div></div>`}`;
  },220);
}

/* reorder: drag, and arrow keys on the handle */
let dragFrom=null,dragKind=null;
document.addEventListener("dragstart",e=>{
  const row=e.target.closest("[data-row]");if(!row)return;
  dragKind=row.dataset.row;dragFrom=+row.dataset.i;row.classList.add("dragging");
  e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",String(dragFrom))}catch(x){}
});
document.addEventListener("dragover",e=>{
  const row=e.target.closest("[data-row]");if(!row||row.dataset.row!==dragKind)return;
  e.preventDefault();row.classList.add("dragover");
});
document.addEventListener("dragleave",e=>{const r=e.target.closest("[data-row]");r&&r.classList.remove("dragover")});
document.addEventListener("drop",e=>{
  const row=e.target.closest("[data-row]");if(!row||row.dataset.row!==dragKind||dragFrom===null)return;
  e.preventDefault();
  const to=+row.dataset.i,list=dragKind==="ing"?S.ed.ings:S.ed.steps;
  const [m]=list.splice(dragFrom,1);list.splice(to,0,m);
  dragFrom=null;dragKind=null;render();
});
document.addEventListener("dragend",()=>{document.querySelectorAll(".dragging,.dragover").forEach(n=>n.classList.remove("dragging","dragover"));dragFrom=null});

document.addEventListener("keydown",e=>{
  const h=e.target.closest("[data-drag]");
  if(h&&(e.key==="ArrowUp"||e.key==="ArrowDown")){
    e.preventDefault();
    const kind=h.dataset.drag,i=+h.dataset.i,list=kind==="ing"?S.ed.ings:S.ed.steps;
    const to=e.key==="ArrowUp"?i-1:i+1;if(to<0||to>=list.length)return;
    const [m]=list.splice(i,1);list.splice(to,0,m);render();
    setTimeout(()=>{const n=document.querySelector(`[data-drag="${kind}"][data-i="${to}"]`);n&&n.focus()},0);
    return;
  }
  if($("#lb").classList.contains("on")&&e.key==="Escape"){$("#lb").classList.remove("on");return}
  if(S.cook.on){
    if(e.key==="Escape"){S.cook.on=false;keepAwake(false);return render()}
    const r=S.recipes.find(x=>String(x.id)===String(S.id));
    const n=((r&&r.method)||[]).filter(m=>String(m.body||m.title||"").trim()).length;
    if(e.key==="ArrowRight"&&S.cook.step<n-1){S.cook.step++;return render()}
    if(e.key==="ArrowLeft"){S.cook.step=Math.max(0,S.cook.step-1);return render()}
  }
  if(e.key==="Enter"&&LIVE&&!S.user&&["a-email","a-pass","a-name","a-rel"].includes(e.target.id))doAuth();
});
$("#lb").addEventListener("click",e=>{if(e.target.id==="lb")e.currentTarget.classList.remove("on")});

function pickPhoto(r){
  const inp=document.createElement("input");inp.type="file";inp.accept="image/*";
  inp.onchange=async()=>{if(inp.files[0])await addPhoto(r.id,inp.files[0],r.title)};inp.click();
}

/* ---------- save ---------- */
async function saveRecipe(){
  const e=S.ed;
  if(!String(e.title).trim()){S.err="Give it a name — even a rough one.";window.scrollTo({top:0,behavior:"smooth"});return render()}
  if(!String(e.sub).trim()){S.err="Pick a category so it files in the right place.";window.scrollTo({top:0,behavior:"smooth"});return render()}
  S.busy=true;S.err="";render();
  try{
    const rec=edToRecipe(e);
    delete rec.id;
    rec.created_at=new Date().toISOString().slice(0,10);
    rec.tags=[e.sub.toLowerCase()].filter(Boolean);
    if(LIVE){
      if(e.image&&e._file){
        try{
          const path=`${S.user.id}/${Date.now()}.jpg`;
          const blob=await (await fetch(e.image)).blob();
          const {error}=await sb.storage.from("photos").upload(path,blob,{contentType:"image/jpeg"});
          if(!error){rec.image=sb.storage.from("photos").getPublicUrl(path).data.publicUrl;rec.thumb=rec.image}
        }catch(x){}
      }
      rec.added_by=S.user.id;
      const {data,error}=await sb.from("recipes").insert(rec).select().single();
      if(error)throw error;
      S.recipes.unshift({...data,cooks:data.cooks||[]});
    }else{
      S.recipes.unshift({...rec,id:"local-"+Date.now()});
    }
    S.ed=null;S.busy=false;toast("Saved to the book");go("home");
  }catch(err){S.busy=false;S.err=err.message||"Couldn't save that. Try again.";render()}
}

/* ---------- auth ---------- */
async function doAuth(){
  const g=id=>(($("#"+id)||{}).value||"").trim();
  const email=g("a-email"),pass=($("#a-pass")||{}).value,name=g("a-name"),rel=g("a-rel");
  const up=S.authMode==="up";
  if(!email||!pass){S.err="Enter your email and a password to continue.";return render()}
  if(up&&!name){S.err="Add your name so the family knows who wrote what.";return render()}
  S.busy=true;S.err="";render();
  try{
    if(up){
      const {data,error}=await sb.auth.signUp({email,password:pass});if(error)throw error;
      if(!data.session){S.busy=false;S.err="Check your email, confirm the link, then sign in.";S.authMode="in";return render()}
      S.user=data.user;await sb.from("profiles").insert({id:data.user.id,name,relation:rel||null});
      S.profile={name,relation:rel};
    }else{
      const {data,error}=await sb.auth.signInWithPassword({email,password:pass});if(error)throw error;
      S.user=data.user;
      const {data:p}=await sb.from("profiles").select("*").eq("id",data.user.id).single();
      S.profile=p||{name:email.split("@")[0]};
    }
    await loadAll();S.busy=false;go("home");
  }catch(err){S.busy=false;
    S.err=/Invalid login/i.test(err.message||"")?"That email and password don't match. Try again.":(err.message||"Something went wrong.");render()}
}

/* ---------- boot ---------- */
(async()=>{
  if(LIVE){
    const {data:{session}}=await sb.auth.getSession();
    if(session){S.user=session.user;
      const {data:p}=await sb.from("profiles").select("*").eq("id",session.user.id).single();
      S.profile=p||{name:session.user.email.split("@")[0]};}
  }
  await loadAll();
  S.recipes.forEach(r=>{const t=LS.get("mb-tick-"+r.id,null);if(t)S.ticked[r.id]=t});
  S.heroId=pickHero();
  render();
})();
</script>
