<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order online</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f0e8; --ink:#1c241e; --muted:#5f6b62; --line:#ddd4c6;
  --card:#fffcf7; --accent:#1f5c3a; --accent-text:#fff;
  --font-display:'Fraunces',Georgia,serif; --font-ui:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--font-ui);color:var(--ink);background:
  radial-gradient(1000px 420px at 0% -10%, #e4eee6 0%, transparent 55%),
  radial-gradient(800px 360px at 100% 0%, #f0e2d2 0%, transparent 50%),
  var(--bg);}
.shell{width:min(1440px,100%);margin:0 auto;padding:28px 16px 72px;}
.lp-oe-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin:0 0 22px;flex-wrap:wrap;}
.lp-oe-head-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lp-oe-cart-btn,.lp-oe-primary, .lp-oe-card button, .lp-oe-link, .lp-oe-view-btn{
  appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-text);
  font:600 13.5px/1 var(--font-ui);padding:11px 14px;border-radius:10px;cursor:pointer;
}
.lp-oe-view-btn{background:transparent;color:var(--accent);padding:8px 12px}
.lp-oe-view-btn.on{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.lp-oe-link{background:transparent;color:var(--accent);margin-bottom:12px;}
.lp-oe-card button{width:100%;margin-top:10px;}
.lp-oe-filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;}
.lp-oe-filters button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:8px 12px;font:600 12.5px/1 var(--font-ui);cursor:pointer;}
.lp-oe-filters button.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);}
.lp-oe-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:0 0 14px}
.lp-oe-layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:960px){.lp-oe-layout{grid-template-columns:1fr}}
.lp-oe-main{min-width:0}
.lp-oe-aside{
  position:sticky;top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:16px;box-shadow:0 12px 28px rgba(28,36,30,.05);max-height:calc(100vh - 32px);overflow:auto;
}
.lp-oe-aside h3{margin:0 0 10px;font-family:var(--font-display);font-size:22px}
.lp-oe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
.lp-oe-list{display:flex;flex-direction:column;gap:10px}
.lp-oe-list .lp-oe-card{display:grid;grid-template-columns:88px 1fr auto;gap:12px;align-items:center;padding:10px}
.lp-oe-list .lp-oe-img{aspect-ratio:1;width:88px;border-radius:10px}
.lp-oe-list .lp-oe-body{padding:0}
.lp-oe-list .lp-oe-body h3{font-size:30px;margin:0 0 2px}
.lp-oe-list .lp-oe-card button{width:auto;margin:0;padding:9px 12px}
.lp-oe-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 10px 28px rgba(28,36,30,.04);}
.lp-oe-img{aspect-ratio:4/3;background:#e8e2d6 center/cover no-repeat;}
.lp-oe-img.text{display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#e8efe9,#f3ebe1);}
.lp-oe-img.text span{font-family:var(--font-display);font-size:42px;color:var(--accent);opacity:.7;}
.lp-oe-card.no-img .lp-oe-img{aspect-ratio:5/2;}
.lp-oe-body{padding:14px;}
.lp-oe-body h3{margin:0 0 6px;font-size:32px;line-height:1.2;letter-spacing:-.02em;}
.lp-oe-ey{margin:0 0 6px;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);}
.lp-oe-brand{font-family:var(--font-display);font-size:clamp(32px,4.4vw,52px);margin:10px 0 0;font-weight:600;}
.lp-oe-sub{margin:13px 0 0;color:var(--muted);font-size:18px;font-weight:500;line-height:1.45;max-width:62ch;}
.lp-oe-price{margin-top:8px;font-weight:700;color:var(--accent);}
.lp-oe-note{color:var(--muted);font-size:13.5px;line-height:1.45;margin:16px 0 0;}
.lp-oe-empty{padding:28px;text-align:center;color:var(--muted);}
.lp-oe-msg{background:color-mix(in srgb,var(--accent) 10%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line));color:var(--ink);padding:10px 12px;border-radius:10px;margin:0 0 12px;}
.lp-oe-msg.is-ok{background:color-mix(in srgb,var(--accent) 12%,var(--card));border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.lp-oe-msg.is-error{background:#f8ebe7;border-color:#e2b5a8;color:#6e2416}
.lp-oe-body p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.4;}
.lp-oe-fields{display:grid;gap:10px;margin:14px 0;}
.lp-oe-fields label{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--muted);}
.lp-oe-fields input,.lp-oe-fields textarea,.lp-oe-fields select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);}
.lp-oe-line{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);}
.lp-oe-line-main{flex:1;min-width:0}
.lp-oe-line-meta{margin:4px 0 0;color:var(--muted);font-size:13px}
.lp-oe-line-actions{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.lp-oe-qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.lp-oe-qty-btn{appearance:none;border:0;background:transparent;width:34px;height:34px;font:700 16px/1 var(--font-ui);cursor:pointer;color:var(--ink)}
.lp-oe-qty-btn:hover{background:rgba(0,0,0,.04)}
.lp-oe-qty-val{min-width:28px;text-align:center;font:700 13px/1 var(--font-ui)}
.lp-oe-remove{appearance:none;border:1px solid #c45c26;background:transparent;color:#c45c26;font:600 12px/1 var(--font-ui);padding:8px 12px;border-radius:999px;cursor:pointer}
.lp-oe-remove:hover{background:#c45c26;color:#fff}
.lp-oe-summary{margin:14px 0;padding:14px;background:#f7f3ec;border:1px solid var(--line);border-radius:12px;}
.lp-oe-summary .row{display:flex;justify-content:space-between;gap:10px;margin:0 0 8px;font-size:14.5px;}
.lp-oe-summary .row.emph{font-weight:700;padding-top:8px;border-top:1px dashed var(--line);}
.lp-oe-login{margin:0 0 14px;padding:12px;border:1px dashed var(--line);border-radius:12px;background:#faf7f1}
.lp-oe-login h4{margin:0 0 6px;font-size:14px}
.lp-oe-login p{margin:0 0 8px;font-size:12.5px;color:var(--muted);line-height:1.4}
.lp-oe-portal-btn,.lp-oe-account-chip{appearance:none;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--accent) 8%,var(--card));color:var(--accent);font:700 13px/1 var(--font-ui);padding:10px 14px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.lp-oe-account{margin:0 0 16px;padding:14px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(165deg,color-mix(in srgb,var(--accent) 10%,var(--card)),var(--card))}
.lp-oe-account-ey{margin:0 0 4px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.lp-oe-account-name{margin:0 0 4px;font-size:15px;font-weight:700}
.lp-oe-account-meta{margin:0 0 10px;font-size:12.5px;color:var(--muted);line-height:1.4}
.lp-oe-account-actions{display:flex;flex-wrap:wrap;gap:8px}
.lp-oe-account-btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:#fff;font:600 12.5px/1 var(--font-ui);padding:9px 12px;border-radius:10px;cursor:pointer}
.lp-oe-account-btn.ghost{background:transparent;color:var(--accent)}
.lp-oe-orders-title{margin:8px 0 6px;font-family:var(--font-display);font-size:clamp(22px,3vw,28px)}
.lp-oe-order-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px}
.lp-oe-modal-backdrop{position:fixed;inset:0;z-index:10050;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(18,24,20,.48)}
.lp-oe-modal{position:relative;width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px 18px;box-shadow:0 24px 60px rgba(18,24,20,.22)}
.lp-oe-mobile-cart{display:none}
@media(max-width:960px){
  .lp-oe-aside{position:static;max-height:none}
  .lp-oe-mobile-cart{display:inline-flex}
}
.lp-oe-primary:disabled,.lp-oe-cart-btn:disabled{opacity:.55;cursor:not-allowed}
.lp-oe-detail{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.lp-oe-related ul{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:8px;}
.lp-oe-related button{background:transparent;color:var(--accent);}
</style>
</head>
<body>
<div class="shell">
  <div id="lp-order-storefront" data-slug="" data-mode="page" data-show-portal="1"></div>
</div>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var slug = params.get('slug') || '';
  var el = document.getElementById('lp-order-storefront');
  if (el) el.setAttribute('data-slug', slug);
  if (!slug) {
    el.innerHTML = '<div class="lp-oe-empty"><p>Missing site slug. Open /order-shop?slug=your-site-slug</p></div>';
  }
})();
</script>
<script src="/assets/lp-order-storefront.js?v=oe-13" defer></script>
</body>
</html>
