# One-off: copy the LeadPages database (Tokyo) into the new Sydney Supabase project.
# Uses Supabase's documented CLI backup/restore (roles, schema incl. RLS policies & functions,
# then data incl. auth users) — see docs/ops/Database-move-Sydney.md.
#
# Needs two repo secrets (Settings → Secrets and variables → Actions):
#   OLD_DB_URL  Tokyo project  → Connect → Session pooler connection string (with password)
#   NEW_DB_URL  Sydney project → Connect → Session pooler connection string (with password)
#
# Run modes (Actions → "DB copy to Sydney" → Run workflow):
#   full   first copy: roles + schema + data into the empty Sydney project
#   data   re-copy data only (switch-over): empties the Sydney tables, then loads fresh data
#   check  row counts on both sides, nothing written
# Dumps are never uploaded or printed; they're deleted at the end of the run.
name: DB copy to Sydney

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full | data | check'
        required: true
        default: 'check'

concurrency: db-copy-sydney

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLD_DB_URL: ${{ secrets.OLD_DB_URL }}
      NEW_DB_URL: ${{ secrets.NEW_DB_URL }}
      MODE: ${{ github.event.inputs.mode }}
    steps:
      - name: Check inputs
        run: |
          case "$MODE" in full|data|check) ;; *) echo "mode must be full, data or check"; exit 1;; esac
          [ -n "$OLD_DB_URL" ] || { echo "Missing secret OLD_DB_URL"; exit 1; }
          [ -n "$NEW_DB_URL" ] || { echo "Missing secret NEW_DB_URL"; exit 1; }

      - name: Install Postgres 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Use Session pooler addresses (GitHub runners have no IPv6)
        run: |
          # A Direct connection string (db.<ref>.supabase.co, IPv6 only) is turned into the same
          # project's Session pooler string (IPv4): user postgres.<ref>, same password.
          topooler() {
            local url="$1" region="$2" rest userpart pw hostpart host ref cand p
            rest="${url#*://}"; userpart="${rest%%@*}"; hostpart="${rest#*@}"; host="${hostpart%%[:/]*}"
            case "$host" in db.*.supabase.co) ;; *) echo "$url"; return;; esac
            ref="${host#db.}"; ref="${ref%.supabase.co}"; pw="${userpart#*:}"
            for p in aws-0 aws-1 aws-2; do
              cand="postgresql://postgres.${ref}:${pw}@${p}-${region}.pooler.supabase.com:5432/postgres"
              if psql "$cand" -Atc 'select 1' >/dev/null 2>&1; then echo "$cand"; return; fi
            done
            echo "$url"
          }
          o=$(topooler "$OLD_DB_URL" ap-northeast-1); n=$(topooler "$NEW_DB_URL" ap-southeast-2)
          echo "::add-mask::$o"; echo "::add-mask::$n"
          { echo "OLD_DB_URL=$o"; echo "NEW_DB_URL=$n"; } >> "$GITHUB_ENV"

      - name: Test connections
        run: |
          ok=1
          for v in OLD_DB_URL NEW_DB_URL; do
            [ "$v" = OLD_DB_URL ] && name="Tokyo (OLD_DB_URL)" || name="Sydney (NEW_DB_URL)"
            url="${!v}"
            # Describe the string's shape without revealing it (no password, no full host).
            scheme="${url%%://*}"; rest="${url#*://}"; userpart="${rest%%@*}"; user="${userpart%%:*}"; hostpart="${rest#*@}"; host="${hostpart%%/*}"; hostonly="${host%%:*}"; port="${host##*:}"
            case "$userpart" in *:*) haspw=yes;; *) haspw=no;; esac
            case "$url" in *'['*|*']'*) brackets=yes;; *) brackets=no;; esac
            shape="scheme=$scheme user=$user password_given=$haspw brackets_left_in=$brackets host_kind=$(echo "$hostonly" | sed -E 's/^[^.]+\.//') port=$port"
            rc=0; psql "$url" -Atc "select current_database()||' '||split_part(version(),' ',2)" > conn.txt 2>&1 || rc=$?
            out=$(head -2 conn.txt | sed -E 's#postgres(ql)?://[^ ]*#<url>#g' | tr '\n' ' '); rm -f conn.txt
            if [ "$rc" = 0 ]; then
              echo "::notice::$name connected ($out) [$shape]"
            else
              echo "::error::$name could not connect: $out [$shape]"; ok=0
            fi
          done
          [ $ok = 1 ]

      - name: Row counts before
        run: |
          Q="select table_schema||'.'||table_name||' '||(xpath('/row/c/text()', query_to_xml('select count(*) as c from '||quote_ident(table_schema)||'.'||quote_ident(table_name), false, true, '')))[1]::text from information_schema.tables where table_schema in ('public','auth') and table_type='BASE TABLE' order by 1"
          echo "== Tokyo (source) =="; psql "$OLD_DB_URL" -Atc "$Q" > old_counts.txt; wc -l < old_counts.txt
          echo "== Sydney (target) =="; psql "$NEW_DB_URL" -Atc "$Q" > new_counts.txt || true; wc -l < new_counts.txt

      - name: Dump Tokyo
        if: env.MODE != 'check'
        run: |
          supabase db dump --db-url "$OLD_DB_URL" -f roles.sql --role-only
          supabase db dump --db-url "$OLD_DB_URL" -f schema.sql
          supabase db dump --db-url "$OLD_DB_URL" -f data_all.sql --use-copy --data-only
          # Keep only our data (public) and logins (auth); Supabase's internal schemas (storage,
          # realtime, vault…) are managed by the new project itself and refuse direct writes.
          python3 - <<'PY'
          import re
          keep = ('"public".', '"auth".', 'public.', 'auth.')
          out, skip, kept, dropped = [], False, 0, 0
          for line in open('data_all.sql', encoding='utf-8'):
              if skip:
                  if line.rstrip('\n') == '\\.':
                      skip = False
                  continue
              m = re.match(r'COPY\s+(\S+)', line)
              if m:
                  if m.group(1).startswith(keep): kept += 1; out.append(line)
                  else: dropped += 1; skip = True
                  continue
              m = re.match(r"SELECT pg_catalog\.setval\('([^']+)'", line)
              if m and not m.group(1).lstrip('"').startswith(('public', 'auth')):
                  continue
              out.append(line)
          open('data.sql', 'w', encoding='utf-8').writelines(out)
          print(f"::notice::Data tables kept {kept}, skipped {dropped} (Supabase internal)")
          PY
          rm -f data_all.sql
          echo "::notice::Dumped roles $(wc -c < roles.sql)B, schema $(wc -c < schema.sql)B, data $(wc -c < data.sql)B"

      - name: Restore into Sydney (full)
        if: env.MODE == 'full'
        run: |
          set -o pipefail
          psql "$NEW_DB_URL" --single-transaction --variable ON_ERROR_STOP=1 \
            --file roles.sql --file schema.sql \
            --command 'SET session_replication_role = replica' --file data.sql > restore.log 2>&1 \
            || { echo "::error::Restore failed (nothing was kept — it runs as one transaction): $(grep -m3 -i 'error' restore.log | sed -E 's#postgres(ql)?://[^ ]*#<url>#g' | tr '\n' ' ')"; exit 1; }
          echo "::notice::Restore into Sydney finished"

      - name: Re-copy data into Sydney (switch-over)
        if: env.MODE == 'data'
        run: |
          # Empty every public + auth table in Sydney, then load the fresh data, in one transaction.
          T=$(psql "$NEW_DB_URL" -Atc "select string_agg(format('%I.%I', schemaname, tablename), ', ') from pg_tables where schemaname in ('public','auth') and tablename <> 'schema_migrations'")
          psql "$NEW_DB_URL" --single-transaction --variable ON_ERROR_STOP=1 \
            --command 'SET session_replication_role = replica' \
            --command "TRUNCATE $T CASCADE" \
            --file data.sql

      - name: Row counts after (must match)
        if: env.MODE != 'check'
        run: |
          Q="select table_schema||'.'||table_name||' '||(xpath('/row/c/text()', query_to_xml('select count(*) as c from '||quote_ident(table_schema)||'.'||quote_ident(table_name), false, true, '')))[1]::text from information_schema.tables where table_schema in ('public','auth') and table_type='BASE TABLE' order by 1"
          psql "$OLD_DB_URL" -Atc "$Q" > old_counts.txt
          psql "$NEW_DB_URL" -Atc "$Q" > new_counts.txt
          if diff old_counts.txt new_counts.txt > diff.txt; then echo "::notice::All $(wc -l < old_counts.txt) tables match (public + auth row counts)"; else echo "::error::Row counts differ: $(grep '^[<>]' diff.txt | head -15 | tr '\n' ';')"; exit 1; fi

      - name: Remove dumps
        if: always()
        run: rm -f roles.sql schema.sql data.sql data_all.sql
