<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your order — LeadPages</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee; --ink:#1a1f1c; --muted:#5c675f; --line:#ddd6cb;
  --card:#fffdf9; --accent:#1f5c3a; --accent-2:#c45c26; --warn:#8a5a00; --ok:#1f5c3a;
  --font-display:'Fraunces',Georgia,serif; --font-ui:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:
  radial-gradient(1200px 500px at 10% -10%, #e7efe8 0%, transparent 55%),
  radial-gradient(900px 400px at 100% 0%, #f3e6d8 0%, transparent 50%),
  var(--bg);
  color:var(--ink);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;}
.wrap{width:min(720px,100%);margin:0 auto;padding:28px 18px 64px;}
.brand{font-family:var(--font-display);font-size:28px;font-weight:600;margin:0 0 4px;}
.sub{color:var(--muted);margin:0 0 22px;font-size:14.5px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;margin:0 0 14px;box-shadow:0 10px 30px rgba(26,31,28,.04);}
.hrow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.02em;}
.b-open{background:#e7f3ea;color:var(--ok);}
.b-soon{background:#fff1d6;color:var(--warn);}
.b-locked{background:#f1e4e0;color:#8a2f1d;}
.b-tbc{background:#efeaf6;color:#5b3d8a;}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
@media(max-width:560px){.meta{grid-template-columns:1fr;}}
.meta div{background:#f7f4ef;border-radius:10px;padding:10px 12px;}
.meta label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 4px;}
.meta strong{font-size:15px;}
.item{border-top:1px solid var(--line);padding:12px 0;}
.item:first-child{border-top:0;padding-top:0;}
.item h3{margin:0 0 4px;font-size:16px;}
.item p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.45;}
.totals{display:grid;gap:8px;margin-top:8px;}
.totals .row{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;}
.totals .row.emph{font-weight:700;font-size:16px;padding-top:8px;border-top:1px dashed var(--line);}
.note{font-size:13.5px;color:var(--muted);line-height:1.5;margin:10px 0 0;}
.locked{border-left:4px solid #8a2f1d;padding:12px 14px;background:#fbf1ee;border-radius:10px;margin:0 0 14px;font-weight:600;}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
button,.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:#fff;font:600 14px/1 var(--font-ui);padding:11px 14px;border-radius:10px;cursor:pointer;}
button.ghost,.btn.ghost{background:transparent;color:var(--accent);}
button:disabled{opacity:.55;cursor:not-allowed;}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;}
label.f{display:block;font-size:12px;font-weight:700;margin:0 0 4px;color:var(--muted);}
.edit-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
@media(max-width:560px){.edit-row{grid-template-columns:1fr;}}
.err{color:#8a2f1d;font-size:14px;}
.gate{max-width:420px;margin:12vh auto;padding:24px;text-align:center;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="gate" id="gate"><p class="err">Loading your order…</p></div>
  <div id="view" style="display:none"></div>
</div>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var token = params.get('t') || '';
  var wantPay = params.get('pay') === '1';
  var paid = params.get('paid') === '1';
  var $ = function(id){ return document.getElementById(id); };

  function money(c){ if(c==null) return 'TBC'; return '$'+(Number(c)/100).toFixed(2); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);}); }

  async function api(path, opts){
    opts = opts || {};
    var r = await fetch(path, {
      method: opts.method || 'GET',
      headers: opts.body ? {'content-type':'application/json'} : undefined,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    var j = null; try{ j = await r.json(); }catch(e){ j = {}; }
    if(!r.ok) throw new Error((j && j.error) || ('HTTP '+r.status));
    return j;
  }

  function badge(state){
    if(state==='locked') return '<span class="badge b-locked">ORDER LOCKED</span>';
    if(state==='closing_soon') return '<span class="badge b-soon">CLOSING SOON</span>';
    return '<span class="badge b-open">CHANGES OPEN</span>';
  }

  function render(data){
    $('gate').style.display='none';
    $('view').style.display='';
    var o = data.order, d = data.display || {}, items = data.items || [];
    var biz = (data.business && data.business.business_name) || 'Your order';
    var html = '';
    html += '<p class="sub" style="margin:0 0 6px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:var(--accent)">'+esc(biz)+'</p>';
    html += '<h1 class="brand">Order '+esc(o.order_number)+'</h1>';
    html += '<p class="sub">Status: <strong>'+esc(o.status.replace(/_/g,' '))+'</strong></p>';
    if(paid) html += '<div class="card" style="border-color:#b7d7c0;background:#f3faf5"><strong>Deposit received.</strong> Thank you — your order is confirmed.</div>';
    if(o.editing_state==='locked') html += '<div class="locked">'+esc(d.locked_message||'ORDER LOCKED')+'</div>';
    else html += '<div class="hrow" style="margin:0 0 12px">'+badge(o.editing_state)+'<span class="note" style="margin:0">Changes allowed until <strong>'+esc(o.effective_cutoff_at?new Date(o.effective_cutoff_at).toLocaleString():'—')+'</strong></span></div>';
    if(o.cutoff_reason) html += '<p class="note">'+esc(o.cutoff_reason)+'</p>';

    html += '<div class="card"><div class="meta">';
    html += '<div><label>Pickup / delivery</label><strong>'+esc(o.fulfilment_type)+'</strong></div>';
    html += '<div><label>Date</label><strong>'+esc(o.pickup_date||'—')+(o.pickup_time?(' · '+esc(o.pickup_time)):'')+'</strong></div>';
    html += '<div><label>Customer</label><strong>'+esc(o.customer_name)+'</strong></div>';
    html += '<div><label>Price status</label><strong>'+(o.has_unknown_prices?'<span class="badge b-tbc">Final price TBC</span>':esc(o.price_status))+'</strong></div>';
    html += '</div></div>';

    html += '<div class="card"><h2 style="margin:0 0 10px;font-family:var(--font-display);font-size:20px">Items</h2>';
    items.forEach(function(it, idx){
      html += '<div class="item" data-i="'+idx+'"><h3>'+esc(it.product_name)+'</h3>';
      html += '<p>Qty '+esc(it.quantity)+(it.requested_weight_kg!=null?(' · approx '+esc(it.requested_weight_kg)+' kg'):'')+(it.actual_weight_kg!=null?(' · actual '+esc(it.actual_weight_kg)+' kg'):'')+'</p>';
      var price = it.line_final_cents!=null?money(it.line_final_cents):(it.price_status==='tbc'||it.price_status==='quote_required'?'Price TBC':(it.line_known_cents!=null?money(it.line_known_cents):'—'));
      html += '<p style="margin-top:4px"><strong>'+price+'</strong>'+(it.price_status==='estimated'?' <span class="badge b-tbc">Est.</span>':'')+'</p>';
      if(data.can_edit){
        html += '<div class="edit-row">';
        html += '<div><label class="f">Quantity</label><input type="number" min="0" step="0.01" class="ed-qty" data-id="'+esc(it.id)+'" value="'+esc(it.quantity)+'"></div>';
        html += '<div><label class="f">Approx. weight (kg)</label><input type="number" min="0" step="0.001" class="ed-w" data-id="'+esc(it.id)+'" value="'+(it.requested_weight_kg!=null?esc(it.requested_weight_kg):'')+'"></div>';
        html += '</div>';
      }
      html += '</div>';
    });
    html += '</div>';

    html += '<div class="card"><h2 style="margin:0 0 10px;font-family:var(--font-display);font-size:20px">Payment</h2><div class="totals">';
    html += '<div class="row"><span>Known subtotal</span><span>'+esc(d.known_subtotal||money(o.known_subtotal_cents))+'</span></div>';
    if(o.has_unknown_prices) html += '<div class="row"><span>Other items</span><span>Price TBC after preparation</span></div>';
    html += '<div class="row"><span>Deposit required</span><span>'+esc(d.deposit_required||money(o.deposit_required_cents))+'</span></div>';
    html += '<div class="row"><span>Deposit paid</span><span>'+esc(d.deposit_paid||money(o.deposit_paid_cents))+'</span></div>';
    html += '<div class="row emph"><span>Balance</span><span>'+esc(d.balance||'TBC')+'</span></div>';
    html += '</div>';
    html += '<p class="note">Deposit today secures your order. Final order price will be confirmed after your items are prepared/weighed. Balance settlement: <strong>'+esc((o.balance_settlement||'').replace(/_/g,' '))+'</strong>.</p>';
    html += '<div class="actions">';
    if((o.deposit_paid_cents||0) < (o.deposit_required_cents||0)){
      html += '<button type="button" id="payBtn">PAY '+esc(d.deposit_required||money(o.deposit_required_cents))+' DEPOSIT &amp; CONFIRM ORDER</button>';
    }
    if(data.can_edit) html += '<button type="button" class="ghost" id="saveBtn">Save changes</button>';
    html += '</div></div>';

    if(data.can_edit){
      html += '<div class="card"><h2 style="margin:0 0 10px;font-size:16px">Edit pickup & notes</h2>';
      html += '<label class="f">Pickup date</label><input type="date" id="ed-date" value="'+esc(o.pickup_date||'')+'">';
      html += '<label class="f" style="margin-top:8px">Pickup time</label><input type="time" id="ed-time" value="'+esc(o.pickup_time||'')+'">';
      html += '<label class="f" style="margin-top:8px">Notes</label><textarea id="ed-notes">'+(o.customer_notes?esc(o.customer_notes):'')+'</textarea>';
      html += '</div>';
    }

    if(o.customer_notes && !data.can_edit) html += '<div class="card"><h2 style="margin:0 0 8px;font-size:16px">Notes</h2><p class="note" style="margin:0">'+esc(o.customer_notes)+'</p></div>';

    $('view').innerHTML = html;

    var payBtn = document.getElementById('payBtn');
    if(payBtn) payBtn.onclick = async function(){
      payBtn.disabled = true; payBtn.textContent = 'Opening secure checkout…';
      try{
        var out = await api('/api/order/checkout-deposit', { method:'POST', body:{ t: token } });
        if(out.url) location.href = out.url; else throw new Error('No checkout URL');
      }catch(e){ payBtn.disabled=false; payBtn.textContent='Try again'; alert(e.message||e); }
    };

    var saveBtn = document.getElementById('saveBtn');
    if(saveBtn) saveBtn.onclick = async function(){
      saveBtn.disabled = true;
      var changes = [];
      document.querySelectorAll('.ed-qty').forEach(function(inp){
        var id = inp.getAttribute('data-id');
        var w = document.querySelector('.ed-w[data-id="'+id+'"]');
        changes.push({ order_item_id:id, quantity: parseFloat(inp.value), requested_weight_kg: w && w.value!=='' ? parseFloat(w.value) : null });
      });
      var payload = { t: token, changes: changes };
      var nd = document.getElementById('ed-date');
      var nt = document.getElementById('ed-time');
      var nn = document.getElementById('ed-notes');
      if(nd) payload.pickup_date = nd.value || null;
      if(nt) payload.pickup_time = nt.value || null;
      if(nn) payload.customer_notes = nn.value;
      try{
        await api('/api/order/portal', { method:'POST', body: payload });
        location.reload();
      }catch(e){ saveBtn.disabled=false; alert(e.message||e); }
    };

    if(wantPay && payBtn) payBtn.click();
  }

  function renderHistory(data, sessionToken, slug){
    $('gate').style.display='none';
    $('view').style.display='';
    var customer = data.customer || {};
    var orders = data.orders || [];
    var html = '';
    html += '<h1 class="brand">Welcome'+(customer.name?(', '+esc(String(customer.name).split(/\s+/)[0])):'')+'</h1>';
    html += '<p class="sub">Your order history. Reorder available products into a new cart (current prices apply; unavailable items are skipped).</p>';
    if(!orders.length){
      html += '<div class="card"><p class="note" style="margin:0">No past orders found for this mobile number yet.</p></div>';
    } else {
      orders.forEach(function(o){
        html += '<div class="card">';
        html += '<div class="hrow"><div><strong>Order '+esc(o.order_number)+'</strong><p class="note" style="margin:4px 0 0">Pickup '+esc(o.pickup_date||'—')+' · '+esc((o.status||'').replace(/_/g,' '))+'</p></div>';
        html += '<button type="button" class="ghost" data-reorder="'+esc(o.id)+'">Order again</button></div>';
        html += '<div style="margin-top:10px">';
        (o.items||[]).forEach(function(it){
          html += '<p class="note" style="margin:0 0 4px">'+esc(it.quantity)+' × '+esc(it.product_name)+(it.notes?(' — '+esc(it.notes)):'')+'</p>';
        });
        html += '</div></div>';
      });
    }
    html += '<p class="note"><button type="button" class="ghost" id="hist-out">Sign out</button></p>';
    $('view').innerHTML = html;
    document.getElementById('hist-out').onclick = function(){
      try{ localStorage.removeItem('lp.order.portal.'+slug); }catch(e){}
      location.search = '?slug='+encodeURIComponent(slug);
    };
    document.querySelectorAll('[data-reorder]').forEach(function(btn){
      btn.onclick = async function(){
        btn.disabled = true;
        btn.textContent = 'Creating cart…';
        try{
          var out = await api('/api/order/portal-auth', {
            method:'POST',
            body:{ action:'reorder', slug:slug, token:sessionToken, order_id: btn.getAttribute('data-reorder') }
          });
          var msg = 'Added '+(out.added||[]).length+' item(s)';
          if((out.skipped||[]).length) msg += ', skipped '+(out.skipped||[]).length+' unavailable';
          if(out.shop_url){
            alert(msg);
            location.href = out.shop_url;
          } else alert(msg);
        }catch(e){
          btn.disabled=false; btn.textContent='Order again'; alert(e.message||e);
        }
      };
    });
  }

  function showPhoneLogin(){
    var slug = params.get('slug') || '';
    $('gate').innerHTML =
      '<h1 class="brand">Your orders</h1>'+
      '<p class="sub">Enter the mobile number used on your orders. We’ll text a one-time code.</p>'+
      (slug?'':'<p class="err">Add ?slug=your-site to this page URL (or open the link from the butcher).</p>')+
      '<label class="f">Mobile</label><input id="otp-phone" type="tel" placeholder="04xx xxx xxx" '+(slug?'':'disabled')+'>'+
      '<div id="otp-step2" style="display:none;margin-top:12px">'+
      '<label class="f">SMS code</label><input id="otp-code" type="text" inputmode="numeric" placeholder="6-digit code">'+
      '</div>'+
      '<div class="actions" style="justify-content:center;margin-top:14px">'+
      '<button type="button" id="otp-send"'+(slug?'':' disabled')+'>Send code</button>'+
      '<button type="button" class="ghost" id="otp-verify" style="display:none">Verify &amp; view history</button>'+
      '</div>'+
      '<p class="err" id="otp-err"></p>';
    var send = document.getElementById('otp-send');
    var verify = document.getElementById('otp-verify');
    var err = document.getElementById('otp-err');
    send.onclick = async function(){
      err.textContent='';
      send.disabled=true;
      try{
        await api('/api/order/portal-auth', { method:'POST', body:{ action:'send_code', slug:slug, phone: document.getElementById('otp-phone').value } });
        document.getElementById('otp-step2').style.display='';
        verify.style.display='inline-flex';
        send.textContent='Resend code';
      }catch(e){ err.textContent=e.message||e; }
      send.disabled=false;
    };
    verify.onclick = async function(){
      err.textContent='';
      verify.disabled=true;
      try{
        var out = await api('/api/order/portal-auth', {
          method:'POST',
          body:{ action:'verify_code', slug:slug, phone: document.getElementById('otp-phone').value, code: document.getElementById('otp-code').value }
        });
        try{ localStorage.setItem('lp.order.portal.'+slug, out.token); }catch(e){}
        var hist = await api('/api/order/portal-auth?token='+encodeURIComponent(out.token));
        renderHistory(hist, out.token, slug);
      }catch(e){ err.textContent=e.message||e; verify.disabled=false; }
    };
  }

  if(!token){
    var slug = params.get('slug') || '';
    var saved = '';
    try{ saved = localStorage.getItem('lp.order.portal.'+slug) || ''; }catch(e){}
    if(saved && slug){
      api('/api/order/portal-auth?token='+encodeURIComponent(saved)).then(function(data){
        renderHistory(data, saved, slug);
      }).catch(function(){
        try{ localStorage.removeItem('lp.order.portal.'+slug); }catch(e){}
        showPhoneLogin();
      });
    } else {
      showPhoneLogin();
    }
    return;
  }
  api('/api/order/portal?t='+encodeURIComponent(token)).then(render).catch(function(e){
    $('gate').innerHTML = '<h1 class="brand">Unable to open order</h1><p class="err">'+esc(e.message||e)+'</p><p class="sub">Links expire for security. Ask the store to resend your order link.</p>';
  });
})();
</script>
</body>
</html>
