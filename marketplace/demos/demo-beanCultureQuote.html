<!DOCTYPE html>
<html lang="en-AU" class="mp-demo-embed">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bean Culture quote — marketplace showcase</title>
<link rel="stylesheet" href="./demo-shared.css">
<script src="https://www.leadpages.com.au/icons.js"></script>
<style>
html.mp-demo-embed, html.mp-demo-embed body{
  margin:0;padding:0;min-height:0!important;height:auto!important;
  background:#F7F4EF;
  /* Parent page scrolls — avoid nested iframe scroll trap */
  overflow:hidden!important
}
html.mp-demo-embed main#top{margin:0;padding:12px 12px 16px;min-height:0}
html.mp-demo-embed .lp-a11y-root,html.mp-demo-embed #lp-visitor-a11y{display:none!important}
.oq-showcase-wrap{max-width:920px;margin:0 auto}
#lp-online-quote{min-height:0}
</style>
</head>
<body>
<main id="top">
  <div class="oq-showcase-wrap">
    <div id="lp-online-quote"
      data-showcase="1"
      data-slug="beanculture-showcase"
      data-shell-url="/marketplace/bean-culture-quote-shell.json"></div>
  </div>
</main>
<script src="/assets/lp-quote-wizard-logic.js"></script>
<script src="/assets/lp-quote-display.js"></script>
<script src="/assets/lp-quote-planning.js"></script>
<script src="/assets/lp-online-quote.js"></script>
<script>
(function () {
  'use strict';
  var last = 0;
  function measure() {
    var root = document.documentElement;
    var body = document.body;
    var h = Math.max(
      root ? root.scrollHeight : 0,
      body ? body.scrollHeight : 0,
      root ? root.offsetHeight : 0,
      body ? body.offsetHeight : 0
    );
    var q = document.getElementById('lp-online-quote');
    if (q) h = Math.max(h, q.offsetTop + q.offsetHeight + 20);
    h = Math.ceil(h);
    if (h < 240) h = 240;
    if (h === last) return;
    last = h;
    try {
      parent.postMessage({ type: 'lp-mp-embed-height', height: h }, '*');
    } catch (_e) {}
  }
  function tick() {
    measure();
    requestAnimationFrame(measure);
  }
  window.addEventListener('load', tick);
  window.addEventListener('resize', measure);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', tick);
  else tick();
  try {
    var mo = new MutationObserver(function () { measure(); });
    mo.observe(document.documentElement, { childList: true, subtree: true, attributes: true, characterData: true });
  } catch (_e) {}
  setInterval(measure, 800);
})();
</script>
</body>
</html>
