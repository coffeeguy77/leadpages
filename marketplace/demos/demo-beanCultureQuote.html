<!DOCTYPE html>
<html lang="en-AU" class="mp-demo-embed">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bean Culture quote — marketplace showcase</title>
<link rel="stylesheet" href="./demo-shared.css">
<script src="https://www.leadpages.com.au/icons.js"></script>
<style>
html.mp-demo-embed, html.mp-demo-embed body{
  margin:0;padding:0;min-height:0!important;height:auto!important;
  background:#F7F4EF;overflow:auto
}
html.mp-demo-embed main#top{margin:0;padding:20px 16px 28px;min-height:0}
html.mp-demo-embed .lp-a11y-root,html.mp-demo-embed #lp-visitor-a11y{display:none!important}
.oq-showcase-wrap{max-width:920px;margin:0 auto}
.oq-showcase-kicker{
  font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:#A84A5E;margin:0 0 8px
}
.oq-showcase-title{
  font-family:Georgia,"Times New Roman",serif;font-size:clamp(22px,3vw,30px);
  margin:0 0 8px;color:#2E2A2B
}
.oq-showcase-lede{margin:0 0 18px;color:#5A5248;font-size:15px;line-height:1.5;max-width:52ch}
#lp-online-quote{min-height:420px}
</style>
</head>
<body>
<main id="top">
  <div class="oq-showcase-wrap">
    <p class="oq-showcase-kicker">Premium example · Bean Culture</p>
    <h1 class="oq-showcase-title">Verified quote flow — end result</h1>
    <p class="oq-showcase-lede">Browse the steps to see how a finished quote looks. Nothing here submits, verifies, texts or bills — LeadPages configures this with you.</p>
    <div id="lp-online-quote"
      data-showcase="1"
      data-slug="beanculture-showcase"
      data-shell-url="/marketplace/bean-culture-quote-shell.json"></div>
  </div>
</main>
<script src="/assets/lp-quote-wizard-logic.js"></script>
<script src="/assets/lp-quote-display.js"></script>
<script src="/assets/lp-quote-planning.js"></script>
<script src="/assets/lp-online-quote.js"></script>
</body>
</html>
