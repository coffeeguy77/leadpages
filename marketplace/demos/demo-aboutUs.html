<!DOCTYPE html>
<html lang="en-AU" class="mp-demo-embed">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="./demo-shared.css">
<link rel="stylesheet" href="/assets/lp-about-us.css">
<script src="https://www.leadpages.com.au/icons.js"></script>
<style>
html.mp-demo-embed, html.mp-demo-embed body{
  margin:0;padding:0;min-height:0!important;height:auto!important;
  background:#fff!important;overflow:hidden;
}
html.mp-demo-embed main#top{margin:0;padding:0;min-height:0;background:#fff}
html.mp-demo-embed .lp-a11y-root,
html.mp-demo-embed #lp-visitor-a11y{display:none!important}
html.mp-demo-embed section[data-sec="aboutUs"]{
  display:block!important;
}
</style>
</head>
<body>
<main id="top">
<section data-sec="aboutUs" class="section au-section" id="aboutUs">
  <div class="wrap au-story">
    <div class="au-grid">
      <div class="au-col au-col-lead">
        <span class="au-eyebrow"></span>
        <h2 class="au-heading"></h2>
        <div class="au-rule" aria-hidden="true"></div>
        <p class="au-intro"></p>
      </div>
      <div class="au-col au-col-body">
        <div class="au-body"></div>
        <a class="au-cta" href="#quote"><span class="au-cta-label"></span><span class="au-cta-arrow" aria-hidden="true">→</span></a>
      </div>
      <div class="au-col au-col-media">
        <div class="au-media-wrap">
          <img class="au-img" alt="" loading="lazy">
          <blockquote class="au-quote">
            <p class="au-quote-text"></p>
            <cite class="au-quote-attr"></cite>
          </blockquote>
        </div>
      </div>
    </div>
  </div>
  <div class="au-band" hidden>
    <div class="au-band-decor" aria-hidden="true"></div>
    <div class="wrap au-band-inner">
      <div class="au-band-copy">
        <h3 class="au-band-heading"></h3>
        <p class="au-band-sub"></p>
      </div>
      <a class="au-band-cta" href="#quote"><span class="au-band-cta-label"></span><span class="au-cta-arrow" aria-hidden="true">→</span></a>
      <div class="au-band-tag">
        <span class="au-band-tagline"></span>
      </div>
    </div>
  </div>
</section>
</main>

<script>
var SITE_CONFIG = {
  "theme": { "pipe": "#1f7bb8", "hivis": "#e87722" },
  "business": "Ace Plumbing Co.",
  "trade": "plumber",
  "phone": "0261000000",
  "sections": {
    "aboutUs": {
      "on": true,
      "layout": "story",
      "eyebrow": "About {{businessName}}",
      "heading": "Built on trade skills.\nDriven by people.",
      "intro": "We were founded by a tradesperson with a passion for helping people through life's big home transitions.",
      "body": "From renovation and maintenance through to specialist work, we bring the right people to every job.\n\nWe take pride in honest advice and quality workmanship for homeowners in our local area.",
      "ctaLabel": "Our Story",
      "ctaAction": "scroll",
      "ctaTarget": "quote",
      "image": "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800&h=1000&fit=crop",
      "quoteOn": true,
      "quoteStyle": "handwriting",
      "quoteSize": 100,
      "quoteX": 50,
      "quoteY": 78,
      "quoteMaxW": 86,
      "quoteScrim": 86,
      "quoteAlign": "left",
      "imageFit": "cover",
      "imagePos": "center",
      "quote": "Good work helps people move forward.",
      "quoteAttr": "Founder",
      "bandOn": true,
      "bandBg": "#0a2744",
      "bandHeading": "You don't have to manage it all yourself.",
      "bandSub": "Let's talk about how we can help with your next step.",
      "bandCtaLabel": "Start the Conversation",
      "bandCtaAction": "scroll",
      "bandCtaTarget": "quote",
      "bandTagline": "Same home. New possibilities.",
      "bandDecor": true
    }
  }
};
</script>
<script src="/assets/lp-about-us.js"></script>
<script src="./demo-shared.js"></script>
</body>
</html>
