<!DOCTYPE html>
<html lang="en-AU" class="mp-demo-embed">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="./demo-shared.css">
<script src="https://www.leadpages.com.au/icons.js"></script>
<style>
html.mp-demo-embed, html.mp-demo-embed body{
  margin:0;padding:0;min-height:0!important;height:auto!important;
  background:var(--light,#eef2f6)!important;overflow:hidden;
}
html.mp-demo-embed main#top{margin:0;padding:0;min-height:0;background:var(--light,#eef2f6)}
html.mp-demo-embed .lp-a11y-root,
html.mp-demo-embed #lp-visitor-a11y{display:none!important}
html.mp-demo-embed section[data-sec="videoReels"]{
  display:block!important;
  background:linear-gradient(180deg,#f4f7fb 0%,#eef2f6 55%,#e8eef5 100%);
  padding:28px 0 36px;
  color:var(--ink,#1a2230);
}
html.mp-demo-embed section[data-sec="videoReels"] h2{color:var(--ink,#1a2230)}
html.mp-demo-embed section[data-sec="videoReels"] .section-head p{color:var(--muted,#5b6878)}
html.mp-demo-embed section[data-sec="videoReels"] .eyebrow{color:var(--pipe,#1f7bb8)}
/* Keep reels fully visible inside the marketplace iframe height clamp */
html.mp-demo-embed .vr-row{
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  max-width:560px;
  margin-left:auto;
  margin-right:auto;
  margin-top:22px;
}
html.mp-demo-embed .vr-card{aspect-ratio:9/16;border-radius:16px}
html.mp-demo-embed .vr-cap{font-size:15px;bottom:12px;left:12px;right:12px}
html.mp-demo-embed .vr-play{width:48px;height:48px}
html.mp-demo-embed .vr-play::after{border-width:9px 0 9px 14px;margin-left:4px}
@media(max-width:560px){
  html.mp-demo-embed .vr-row{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:100%}
  html.mp-demo-embed .vr-cap{font-size:12px}
}
</style>
</head>
<body>
<main id="top">
<section data-sec="videoReels" class="section">
<div class="wrap">
      <div class="section-head"><span class="eyebrow">Watch</span><h2>Reels from the job</h2><p>Short clips from real jobs — tap a card to watch.</p></div>
      <div class="vr-row"></div>
    </div>
</section>
</main>
