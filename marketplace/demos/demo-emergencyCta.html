<!DOCTYPE html>
<html lang="en-AU" class="mp-demo-embed">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emergency CTA demo</title>
<!-- Alias of demo-emerg.html — keeps camelCase marketplace paths from 404ing -->
<link rel="stylesheet" href="./demo-shared.css">
<script src="https://www.leadpages.com.au/icons.js"></script>
<style>
html.mp-demo-embed, html.mp-demo-embed body{margin:0;padding:0;min-height:0!important;height:auto!important;background:transparent;overflow:hidden}
html.mp-demo-embed main#top{margin:0;padding:0;min-height:0}
html.mp-demo-embed .lp-a11y-root,html.mp-demo-embed #lp-visitor-a11y{display:none!important}
html.mp-demo-embed header.site{position:relative!important;top:auto!important}
html.mp-demo-embed .mp-emerg-demo-hero{
  padding:36px 20px 40px;
  background:linear-gradient(165deg,#1a2230 0%,#243142 45%,#1f7bb8 130%);
  color:#fff;
  font-family:"Barlow",system-ui,sans-serif;
}
html.mp-demo-embed .mp-emerg-demo-hero .biz{font-weight:700;font-size:1.2rem;letter-spacing:.02em}
html.mp-demo-embed .mp-emerg-demo-hero .tag{margin-top:6px;font-size:.9rem;opacity:.85;max-width:28rem;line-height:1.4}
</style>
</head>
<body>
<div class="emerg" data-sec="emerg"><a id="emergCall" href="tel:0261000000">Call 02 6100 0000 now</a></div>
<header class="site">
  <div class="wrap bar">
    <a class="brand" href="#top">
      <span class="mark">A</span>
      <span class="nm">Ace Plumbing Co.</span>
    </a>
    <div class="head-call">
      <div class="head-phone"><small>Call us</small><b id="navPhone">02 6100 0000</b></div>
      <a class="btn btn-call" id="headCall" href="tel:0261000000">Call now</a>
    </div>
  </div>
</header>
<main id="top">
  <div class="mp-emerg-demo-hero" aria-hidden="true">
    <div class="biz">Ace Plumbing Co.</div>
    <div class="tag">The emergency bar sits above the logo header — try sticky, colours and message-only demos below.</div>
  </div>
</main>
<script>
var SITE_CONFIG = {
  "theme": { "pipe": "#1f7bb8", "hivis": "#ff6a1f", "steel": "#1a2230" },
  "business": "Ace Plumbing Co.",
  "trade": "plumber",
  "phone": "0261000000",
  "sections": {
    "emerg": {
      "on": true,
      "text": "24/7 emergency plumber — call now",
      "callOn": true,
      "sticky": true,
      "bgTransparent": false,
      "bg": "#ff6a1f",
      "fg": "#ffffff"
    }
  }
};
</script>
<script src="./demo-shared.js"></script>
</body>
</html>
