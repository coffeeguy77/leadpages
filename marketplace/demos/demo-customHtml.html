<!DOCTYPE html>
<html lang="en-AU" class="mp-demo-embed">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="./demo-shared.css">
<script src="https://www.leadpages.com.au/icons.js"></script>
<style>
html.mp-demo-embed, html.mp-demo-embed body{margin:0;padding:0;min-height:0!important;height:auto!important;background:transparent;overflow:hidden}
html.mp-demo-embed main#top{margin:0;padding:0;min-height:0}
html.mp-demo-embed .lp-a11y-root,html.mp-demo-embed #lp-visitor-a11y{display:none!important}
section[data-sec="customHtml"]{display:block;width:100%;background:#f4f7fb}
section[data-sec="customHtml"] .lp-ch-wrap{max-width:720px;margin:0 auto;padding:28px 18px}
.lp-ch-demo{font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#122033}
.lp-ch-demo h3{margin:0 0 8px;font-size:22px}
.lp-ch-demo p{margin:0 0 14px;color:#3a4a5c}
.lp-ch-demo .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lp-ch-demo input{flex:1;min-width:140px;padding:10px 12px;border:1px solid #c9d3e0;border-radius:8px}
.lp-ch-demo button{padding:10px 14px;border:0;border-radius:8px;background:#1f7bb8;color:#fff;font-weight:600;cursor:pointer}
.lp-ch-demo .out{margin-top:12px;font-weight:700;color:#0e6a3c}
</style>
</head>
<body>
<main id="top">
<section data-sec="customHtml" class="sec lp-custom-html-sec" id="customHtml" style="display:block">
  <div class="in wrap lp-ch-wrap">
    <h2 class="lp-ch-title" style="display:none"></h2>
    <div class="lp-custom-html-mount" data-lp-custom-html></div>
  </div>
</section>
</main>
<script>
var SITE_CONFIG = {
  "theme":{"pipe":"#1f7bb8","hivis":"#ff6a1f"},
  "business":"Ace Plumbing Co.",
  "trade":"plumber",
  "phone":"0261000000",
  "sections":{
    "customHtml":{
      "on":true,
      "title":"",
      "fullBleed":true,
      "bg":"#f4f7fb",
      "html":"<div class=\"lp-ch-demo\"><h3>Custom HTML embed</h3><p>This block is mounted in the page (not an iframe). Attach CSS/JS URLs for tools like the Transfer Matcher.</p><div class=\"row\"><input id=\"ch-demo-a\" type=\"number\" value=\"120\" aria-label=\"Amount\"><button type=\"button\" id=\"ch-demo-go\">Add GST</button></div><div class=\"out\" id=\"ch-demo-out\"></div></div>",
      "cssUrls":[],
      "jsUrls":[]
    }
  }
};
</script>
<script src="/assets/lp-custom-html.js"></script>
<script src="./demo-shared.js"></script>
<script>
(function(){
  function run(){
    var a=document.getElementById('ch-demo-a');
    var out=document.getElementById('ch-demo-out');
    var btn=document.getElementById('ch-demo-go');
    if(!a||!out||!btn) return;
    function calc(){ var n=Number(a.value)||0; out.textContent='Inc GST: $'+(n*1.1).toFixed(2); }
    btn.addEventListener('click', calc);
    calc();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run,0); });
  else setTimeout(run,0);
})();
</script>
</body>
</html>
