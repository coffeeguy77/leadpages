<!DOCTYPE html>
<html lang="en-AU" class="mp-demo-embed">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="./demo-shared.css">
<script src="https://www.leadpages.com.au/icons.js"></script>
<style>
html.mp-demo-embed, html.mp-demo-embed body{margin:0;padding:0;min-height:0!important;height:auto!important;background:transparent;overflow:hidden}
html.mp-demo-embed main#top{margin:0;padding:0;min-height:0}
html.mp-demo-embed .lp-a11y-root,html.mp-demo-embed #lp-visitor-a11y{display:none!important}
html.mp-demo-embed section[data-sec="heroBeforeAfter"]{display:block!important;padding:28px 0 36px}
</style>
</head>
<body>
<main id="top">
<section data-sec="heroBeforeAfter" class="section">
<div class="wrap">
      <div class="section-head"><span class="eyebrow">See The Difference</span><h2>Drag To Reveal The Result</h2><p>Show customers the transformation in one simple swipe.</p></div>
      <div class="bahs">
        <div class="bahs-stage" data-pos="50">
          <div class="bahs-after"></div>
          <div class="bahs-before"></div>
          <div class="bahs-handle" aria-label="Before and after slider" role="slider" aria-valuemin="0" aria-valuemax="100"><span class="bahs-grip"></span></div>
        </div>
        <div class="bahs-meta">
          <div class="bahs-text"><h3 class="bahs-title">Real local transformation</h3><p class="bahs-cap">A clear look at the problem before and the finished result after the job was completed.</p></div>
          <a class="btn btn-call bahs-cta" href="#quote">Get a free quote</a>
        </div>
      </div>
    </div>
</section>
</main>

<script>
var SITE_CONFIG = {
  "theme": { "pipe": "#1f7bb8" },
  "business": "Ace Plumbing Co.",
  "trade": "plumber",
  "phone": "0261000000",
  "sections": {
    "heroBeforeAfter": {
      "on": true,
      "eyebrow": "See The Difference",
      "heading": "Drag To Reveal The Result",
      "intro": "Show customers the transformation in one simple swipe.",
      "beforeLabel": "Before",
      "afterLabel": "After",
      "beforeImage": "https://images.unsplash.com/photo-1503387762-592deb58ef4e?w=1400&h=900&fit=crop&q=80",
      "afterImage": "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=1400&h=900&fit=crop&q=80",
      "title": "Real local transformation",
      "caption": "A clear look at the problem before and the finished result after the job was completed."
    }
  }
};
</script>
<script src="./demo-shared.js"></script>
</body>
</html>
