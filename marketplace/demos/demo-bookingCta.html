<!DOCTYPE html>
<html lang="en-AU" class="mp-demo-embed">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Booking CTA — demo</title>
<link rel="stylesheet" href="./demo-shared.css">
<style>
html.mp-demo-embed, html.mp-demo-embed body{margin:0;padding:0;min-height:0!important;height:auto!important;background:transparent;overflow:hidden}
html.mp-demo-embed main#top{margin:0;padding:0;min-height:0}
html.mp-demo-embed section[data-sec="bookingCta"]{display:block!important;padding:36px 0;background:color-mix(in srgb, var(--pipe,#0B1B2A) 8%, #fff)}
.mp-book{max-width:920px;margin:0 auto;padding:0 24px;text-align:center}
.mp-book .eyebrow{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--pipe,#0B1B2A);margin-bottom:10px}
.mp-book h2{margin:0 0 12px;font-size:clamp(1.6rem,3vw,2.2rem);line-height:1.15;color:#0B1B2A}
.mp-book .intro{margin:0 auto 22px;max-width:42ch;color:#5c6675;font-size:1.05rem;line-height:1.5}
.mp-book .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 22px;border-radius:10px;background:var(--pipe,#0B1B2A);color:#fff;font-weight:700;text-decoration:none}
.mp-book .fine{margin:14px 0 0;font-size:13px;color:#6B7680}
</style>
</head>
<body>
<main id="top">
<section data-sec="bookingCta" class="section">
  <div class="mp-book wrap">
    <span class="eyebrow" data-r="eyebrow">Bookings</span>
    <h2 data-r="heading">Ready to book your appointment?</h2>
    <p class="intro" data-r="intro">Pick a time that suits you — we will confirm by email or phone within one business day.</p>
    <a class="btn" data-r="cta" href="#quote">Book now</a>
    <p class="fine" data-r="fine">No payment required to request a time.</p>
  </div>
</section>
</main>
<script>
var SITE_CONFIG = {
  "business": "Local Studio",
  "theme": { "pipe": "#0B1B2A" },
  "sections": {
    "bookingCta": {
      "on": true,
      "eyebrow": "Bookings",
      "heading": "Ready to book your appointment?",
      "intro": "Pick a time that suits you — we will confirm by email or phone within one business day.",
      "ctaLabel": "Book now",
      "ctaHref": "#quote",
      "finePrint": "No payment required to request a time."
    }
  }
};
</script>
<script src="./demo-shared.js"></script>
<script>
(function(){
  function apply(cfg){
    var s=(cfg&&cfg.sections&&cfg.sections.bookingCta)||{};
    var root=document.querySelector('[data-sec="bookingCta"]');
    if(!root) return;
    if(cfg&&cfg.theme&&cfg.theme.pipe) document.documentElement.style.setProperty('--pipe', cfg.theme.pipe);
    var eb=root.querySelector('[data-r="eyebrow"]');
    var h=root.querySelector('[data-r="heading"]');
    var intro=root.querySelector('[data-r="intro"]');
    var cta=root.querySelector('[data-r="cta"]');
    var fine=root.querySelector('[data-r="fine"]');
    if(eb) eb.textContent=s.eyebrow||'';
    if(h) h.textContent=s.heading||'';
    if(intro) intro.textContent=s.intro||'';
    if(cta){ cta.textContent=s.ctaLabel||'Book now'; cta.setAttribute('href', s.ctaHref||'#quote'); }
    if(fine) fine.textContent=s.finePrint||'';
  }
  apply(SITE_CONFIG);
  window.addEventListener('message', function(ev){
    var d=ev.data||{};
    if(d.type==='lp-demo-config' && d.config){ SITE_CONFIG=d.config; apply(SITE_CONFIG); }
  });
})();
</script>
</body>
</html>
