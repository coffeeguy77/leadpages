<!DOCTYPE html>
<html lang="en-AU" class="mp-demo-embed">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="./demo-shared.css">
<link rel="stylesheet" href="/assets/lp-scrolling-sponsor-banner.css">
<script src="https://www.leadpages.com.au/icons.js"></script>
<style>
html.mp-demo-embed, html.mp-demo-embed body {
  margin: 0;
  padding: 0;
  min-height: 0 !important;
  height: auto !important;
  background: transparent;
  overflow: hidden;
}
html.mp-demo-embed main#top { margin: 0; padding: 0; min-height: 0; }
html.mp-demo-embed .lp-a11y-root,
html.mp-demo-embed #lp-visitor-a11y,
html.mp-demo-embed .lp-visitor-a11y { display: none !important; }
</style>
</head>
<body>
<main id="top">
<section data-sec="scrollingSponsorBanner" class="section ssb-section" aria-label="Sponsor banners"></section>
</main>
<script>
var SITE_CONFIG = {
  theme: { pipe: "#1f7a63" },
  business: "Harbour Club",
  sections: {
    scrollingSponsorBanner: {
      on: true,
      instances: [{
        id: "demo-inst-1",
        adminName: "Major Sponsors",
        enabled: true,
        bannerLinksEnabled: true,
        heading: {
          eyebrow: "Partners",
          title: "Proudly supported by",
          intro: "Local brands that back our community.",
          align: "center",
          maxWidth: 720,
          gap: 16
        },
        tiles: [
          { id: "t1", name: "Northside", enabled: true, image: "https://res.cloudinary.com/demo/image/upload/w_200,h_80,c_pad,b_white/sample", alt: "Northside", contentMode: "image" },
          { id: "t2", name: "Coastal Co", enabled: true, image: "https://res.cloudinary.com/demo/image/upload/w_200,h_80,c_pad,b_white/docs/models", alt: "Coastal Co", contentMode: "image" },
          { id: "t3", name: "Metro Tools", enabled: true, image: "https://res.cloudinary.com/demo/image/upload/w_200,h_80,c_pad,b_white/sample", alt: "Metro Tools", contentMode: "image" },
          { id: "t4", name: "Greenline", enabled: true, image: "https://res.cloudinary.com/demo/image/upload/w_200,h_80,c_pad,b_white/docs/models", alt: "Greenline", contentMode: "image" }
        ],
        motion: { scrolling: true, direction: "left", speedPxPerSec: 40, pauseOnHover: true, showPauseControl: true, staticGrid: false },
        layout: { imageHeightDesktop: 88, imageHeightMobile: 64, tileWidthDesktop: 180, tileWidthMobile: 140, gapDesktop: 24, gapMobile: 16, tilePadding: 12, imageFit: "contain", imagePos: "center" },
        appearance: { edgeFade: true, edgeFadeWidth: 40, fullWidth: true, padTop: 16, padBottom: 16, radius: 8 }
      }]
    }
  }
};
</script>
<script src="/assets/lp-scrolling-sponsor-banner.js"></script>
<script src="./demo-shared.js"></script>
</body>
</html>
