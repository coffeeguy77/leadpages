<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book online</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--a:#155c4a;--ink:#16151d;--muted:#5d5b6b;--faint:#86849a;--line:#e7e6ee;--line2:#d6d4e0;--bg:#f6f6f8;
  --ok-bg:#ecfdf5;--ok:#065f46;--few-bg:#fef3c7;--few:#92400e;--full-bg:#e4e4e7;--full:#52525b;--font:'DM Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:22px 16px 72px}
.brand{display:flex;gap:14px;align-items:center;margin:0 0 18px}
.brand img{width:52px;height:52px;border-radius:12px;object-fit:cover;background:#fff}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--a);margin:0 0 2px}
.brand h1{margin:0;font-size:1.5rem;letter-spacing:-.01em;line-height:1.2}
.brand p{margin:3px 0 0;color:var(--muted);font-size:14px}
.brand a{color:inherit}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.is-done .layout{grid-template-columns:minmax(0,640px);justify-content:center}
.steps{display:flex;flex-direction:column;gap:14px;min-width:0}
.step{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 1px 2px rgba(20,20,40,.05)}
.step.done:not(.cur){padding:14px 20px}
.step.todo{opacity:.55}
.sh{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.step.done:not(.cur) .sh,.step.todo .sh{margin:0}
.step.done:not(.cur) .sh{margin-bottom:6px}
.sh h2{margin:0;font-size:1.0625rem;font-weight:700;line-height:1.25;flex:1}
.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:#f1f1f4;color:var(--muted);flex:0 0 auto}
.cur .num,.done .num{background:var(--a);color:#fff}
.edit{border:0;background:none;color:var(--a);font:inherit;font-weight:600;font-size:14px;cursor:pointer;padding:6px}
.recap{margin:0 0 0 38px;font-size:15px;line-height:1.45}
.recap small{color:var(--muted)}
.hint{color:var(--muted);font-size:14px;margin:10px 0 0;line-height:1.45}
.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:12px;padding:10px 12px;font-size:14px;margin:12px 0 0}
.urgent{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin:12px 0 0}
/* services */
.svcs{display:flex;flex-direction:column;gap:10px}
.svc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;font:inherit;color:var(--ink);cursor:pointer;transition:border-color .12s,box-shadow .12s,transform .12s}
.svc:hover{border-color:var(--line2);box-shadow:0 8px 20px -12px rgba(20,20,40,.35);transform:translateY(-1px)}
.svc.on{border-color:var(--a);box-shadow:0 0 0 2px var(--a)}
.svc b{display:block;font-size:15.5px}
.svc small{display:block;color:var(--muted);font-size:13.5px;margin-top:3px;line-height:1.4}
.svc .price{font-weight:700;white-space:nowrap;text-align:right}
.svc .price small{font-weight:500}
.cat{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:6px 2px 0}
/* calendar */
.field{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.field>span{font-size:13px;font-weight:600}
.field em{font-style:normal;color:var(--faint);font-weight:500}
.in{height:48px;width:100%;border:1px solid var(--line2);border-radius:14px;background:#fff;padding:0 14px;font:inherit;font-size:16px;color:var(--ink);margin:0}
textarea.in{height:auto;padding:12px 14px;resize:vertical}
.in:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 22%,transparent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.month{user-select:none}
.mhead{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px}
.mhead strong{font-size:16px}
.mnav{width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);background:#fff;font-size:22px;line-height:1;cursor:pointer;color:var(--ink)}
.mnav:disabled{opacity:.35;cursor:default}
.wd,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);text-align:center;padding:2px 0}
.cell{min-height:58px;border-radius:12px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit;color:var(--ink);cursor:pointer;padding:4px 2px;transition:transform .12s,box-shadow .12s}
.cell:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 6px 16px -8px rgba(20,20,40,.25)}
.blank{border:0;background:none;min-height:0}
.dn{font-size:15px;font-weight:700;line-height:1}
.dp{font-size:10.5px;font-weight:700;line-height:1;padding:3px 6px;border-radius:999px;white-space:nowrap}
.ok .dp{background:var(--ok-bg);color:var(--ok)}
.few .dp{background:var(--few-bg);color:var(--few)}
.full .dp,.closed .dp{background:var(--full-bg);color:var(--full)}
.cell:disabled{cursor:default;background:#fafafa;color:#a1a1aa}
.na .dn{color:#c4c4cc}
.sel{border-color:var(--a)!important;box-shadow:0 0 0 2px var(--a)!important;background:color-mix(in srgb,var(--a) 8%,#fff)!important}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:10px 0 0;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.k{width:10px;height:10px;border-radius:3px;display:inline-block}
.k.ok{background:#34d399}.k.few{background:#fbbf24}.k.full{background:#a1a1aa}
.loading{opacity:.55;pointer-events:none}
.times-h{font-size:14px;font-weight:700;margin:18px 0 8px}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.time{border:1px solid var(--line2);background:#fff;border-radius:12px;min-height:48px;padding:6px 8px;font:inherit;font-weight:700;font-size:14.5px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.time small{font-size:11px;font-weight:700;padding:2px 6px;border-radius:999px;background:var(--ok-bg);color:var(--ok)}
.time small.few{background:var(--few-bg);color:var(--few)}
.time:hover{border-color:var(--a)}
.time.on{border-color:var(--a);background:color-mix(in srgb,var(--a) 10%,#fff);color:var(--a);box-shadow:0 0 0 2px var(--a)}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;margin:16px 0 0;border:0;border-radius:14px;background:var(--a);color:#fff;font:inherit;font-size:16.5px;font-weight:700;cursor:pointer;text-decoration:none}
.cta:hover{filter:brightness(.95)}
.cta:disabled{opacity:.45;cursor:not-allowed}
.cta.ghost{background:#fff;color:var(--ink);border:1px solid var(--line2)}
.cta.busy{opacity:.7;pointer-events:none}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;margin:14px 0 0;cursor:pointer}
.agree input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--a);flex:0 0 auto}
.policy{background:#f8f8fa;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--muted);line-height:1.5;white-space:pre-line;margin:12px 0 0}
/* summary */
.sum{position:sticky;top:16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 1px 2px rgba(20,20,40,.05)}
.sum h3{margin:0 0 12px;font-size:1rem}
.sum dl{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;margin:0;font-size:14.5px}
.sum dt{color:var(--muted)}
.sum dd{margin:0;text-align:right;font-weight:600}
.sum .tot{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;display:flex;justify-content:space-between;font-size:17px;font-weight:700}
.sum .note{color:var(--muted);font-size:13px;margin:10px 0 0;line-height:1.45}
.sum .empty{color:var(--faint);font-size:14px;margin:0}
.is-done .sum{display:none}
.is-done .brand{justify-content:center;text-align:center}
/* done */
.donecard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 24px;text-align:center;box-shadow:0 1px 2px rgba(20,20,40,.05)}
.tick{width:64px;height:64px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px}
.tick svg{width:32px;height:32px}
.tick.wait{background:var(--few-bg);color:var(--few)}
.donecard h2{margin:0 0 6px;font-size:1.5rem}
.donecard p{color:var(--muted);margin:0 0 6px;line-height:1.5}
.donecard dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;text-align:left;margin:18px auto 4px;max-width:420px;font-size:15px}
.donecard dt{color:var(--muted)}
.donecard dd{margin:0;font-weight:600}
.actions{display:grid;gap:10px;margin-top:18px}
.actions .cta{margin:0}
.legal{font-size:12px;color:var(--faint);margin:18px 0 0;line-height:1.45;text-align:center}
@media(max-width:860px){
  .layout{grid-template-columns:1fr}
  .sum{position:static;order:2}
}
@media(max-width:520px){
  .wrap{padding:16px 12px 64px}
  .step{padding:16px 14px}
  .recap{margin-left:0}
  .grid2{grid-template-columns:1fr}
  .cell{min-height:52px;border-radius:10px}
  .wd,.days{gap:4px}
  .dp{font-size:9.5px;padding:2px 4px}
}
@media(prefers-reduced-motion:reduce){.svc,.cell{transition:none}.svc:hover,.cell:not(:disabled):hover{transform:none}}
</style>
</head>
<body>
<main class="wrap" id="wrap">
  <header class="brand">
    <img id="logo" class="hidden" alt="">
    <div>
      <p class="eyebrow">Book online</p>
      <h1 id="biz-name">Book online</h1>
      <p id="biz-meta"></p>
    </div>
  </header>
  <div class="err hidden" id="err" role="alert"></div>
  <div class="layout" id="layout">
    <div class="steps" id="steps"></div>
    <aside class="sum" id="sum" aria-live="polite"></aside>
  </div>
  <p class="legal" id="legal">Times are shown in the business’s local time.</p>
</main>
<script>
(function(){
  'use strict';
  var params=new URLSearchParams(location.search);
  var slug=params.get('slug')||'';
  var preService=params.get('service')||'';
  var WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var state={
    catalogue:null, step:0, service:null, teamId:'', date:'', slot:null, holdKey:'',
    month:'', monthData:{}, today:'', slots:null, slotsFor:'', customer:{}, agree:false, result:null,
    idempotency:(window.crypto&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2))
  };

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);}); }
  function money(c){ c=Number(c)||0; return '$'+(c/100).toFixed(c%100?2:0); }
  function showErr(m){ var e=$('err'); e.textContent=m||''; e.classList.toggle('hidden', !m); }
  function pad(n){ return (n<10?'0':'')+n; }
  function ymdParts(ymd){ var p=ymd.split('-').map(Number); return { y:p[0], m:p[1], d:p[2], wd:new Date(Date.UTC(p[0],p[1]-1,p[2])).getUTCDay() }; }
  function niceDate(ymd){ if(!ymd) return ''; var p=ymdParts(ymd); return WD[p.wd]+' '+p.d+' '+MON[p.m-1].slice(0,3); }
  function niceTime(hm){ var p=String(hm||'').split(':').map(Number); if(isNaN(p[0])) return hm||''; var h=p[0]%12||12; return h+(p[1]?':'+pad(p[1]):'')+(p[0]<12?'am':'pm'); }
  function tz(){ return (state.catalogue&&state.catalogue.business.timezone)||'Australia/Sydney'; }
  function fmtIso(iso, opts){ try{ return new Date(iso).toLocaleString('en-AU', Object.assign({ timeZone:tz() }, opts)); }catch(_e){ return iso; } }
  function capacity(){ return Number(state.service&&state.service.capacity)||1; }
  function isClass(){ return capacity()>1; }
  function unitWord(n){ return isClass()?(n===1?'spot':'spots'):(n===1?'time':'times'); }
  function priceLabel(s){
    if(!s) return '';
    if(s.price_model==='free') return 'Free';
    if(s.price_model==='quote_required' || !Number(s.price_cents)) return 'Price on enquiry';
    var suf={ per_hour:' / hr', per_person:' / person', per_day:' / day' }[s.price_model]||'';
    return (s.price_model==='from'||s.price_model==='variable'?'From ':'')+money(s.price_cents)+suf;
  }
  function durLabel(m){ m=Number(m)||0; if(!m) return ''; if(m<60) return m+' min'; var h=Math.floor(m/60), r=m%60; return h+(h===1?' hr':' hrs')+(r?' '+r+' min':''); }
  var ICON={
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
  };

  async function getJson(url, opts){
    var r=await fetch(url, opts); var j=await r.json().catch(function(){ return {}; });
    j.__ok=r.ok&&j.ok!==false; j.__status=r.status; return j;
  }
  function post(url, body){ return getJson(url,{ method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body) }); }

  /* ---------------------------------------------------------------- load */
  async function load(){
    if(!slug){ showErr('This booking link is missing the business name (?slug=).'); $('layout').classList.add('hidden'); return; }
    var j=await getJson('/api/bookings/public?slug='+encodeURIComponent(slug));
    if(!j.__ok){
      $('layout').classList.add('hidden');
      showErr(j.error==='not_found'
        ? 'Online booking isn’t switched on for this business yet. Please contact them directly to book.'
        : (j.message||(j.error==='rate_limit'?'Too many requests — please try again in a minute.':'')||'Bookings are unavailable right now. Please try again later.'));
      return;
    }
    state.catalogue=j;
    var b=j.business||{};
    if(b.accent) document.documentElement.style.setProperty('--a', b.accent);
    document.title='Book online — '+(b.name||'');
    $('biz-name').textContent=b.name||'Book online';
    $('biz-meta').innerHTML=b.phone?'Prefer to talk? Call <a href="tel:'+esc(String(b.phone).replace(/\s+/g,''))+'">'+esc(b.phone)+'</a>':'';
    if(b.logo_url){ var img=$('logo'); img.src=b.logo_url; img.classList.remove('hidden'); }
    var services=j.services||[];
    if(preService) state.service=services.find(function(s){ return s.id===preService||s.slug===preService; })||null;
    if(!state.service && services.length===1) state.service=services[0];
    if(state.service && state.service.booking_type==='resource_hire'){ openHire(); return; }
    if(state.service) state.step=1;
    render();
    if(params.get('bkh_ref')) openHire();
  }

  /* Hire services use the hire booking flow (vehicles, days, bond). */
  function openHire(){
    function go(){
      var F=window.LPBookingFlow; if(!F) return;
      if(params.get('bkh_ref')){ F.resumeFromStripe(slug); return; }
      F.load(slug).then(function(cal){
        if(!cal||!cal.live){ showErr('Online hire bookings aren’t open yet. Please call to book.'); return; }
        F.open({ accent:(state.catalogue.business||{}).accent||'' });
      });
    }
    if(window.LPBookingFlow) return go();
    if(!document.querySelector('link[data-bkh]')){ var l=document.createElement('link'); l.rel='stylesheet'; l.href='/assets/lp-booking-hire.css?v=2'; l.setAttribute('data-bkh','1'); document.head.appendChild(l); }
    var sc=document.createElement('script'); sc.src='/assets/lp-booking-flow.js?v=1'; sc.onload=go; document.head.appendChild(sc);
    render();
  }

  /* ---------------------------------------------------------------- months */
  function monthOf(ymd){ return ymd.slice(0,7); }
  function addMonth(ym, n){ var y=Number(ym.slice(0,4)), m=Number(ym.slice(5,7))-1+n; y+=Math.floor(m/12); m=((m%12)+12)%12; return y+'-'+pad(m+1); }
  async function loadMonth(ym){
    var key=state.service.id+'|'+(state.teamId||'')+'|'+ym;
    if(state.monthData[key]) return state.monthData[key];
    var q='/api/bookings/availability?slug='+encodeURIComponent(slug)+'&service_id='+encodeURIComponent(state.service.id)+'&month='+ym;
    if(state.teamId) q+='&team_member_id='+encodeURIComponent(state.teamId);
    var j=await getJson(q);
    if(!j.__ok) throw new Error(j.message||'We couldn’t load the calendar.');
    if(j.today) state.today=j.today;
    state.monthData[key]=j;
    return j;
  }
  function dayInfo(ymd){
    var j=state.monthData[state.service.id+'|'+(state.teamId||'')+'|'+monthOf(ymd)];
    var d=j&&j.days&&j.days[ymd];
    if(!d) return { cls:'na', label:'', n:0, off:true };
    if(state.today && ymd<state.today) return { cls:'na', label:'', n:0, off:true };
    var n=isClass()?(d.best!=null?d.best:d.spots):d.slots;
    if(!d.slots) return d.closed?{ cls:'closed', label:'Closed', n:0, off:true }:{ cls:'full', label:'Full', n:0, off:true };
    if(n<=2) return { cls:'few', label:n===1?'Last one!':n+' left', n:n, off:false };
    return { cls:'ok', label:n+' '+unitWord(n), n:n, off:false };
  }

  /* ---------------------------------------------------------------- render */
  function render(){
    var steps=$('steps');
    if(state.step===4){ $('wrap').classList.add('is-done'); steps.innerHTML=doneHtml(); $('sum').innerHTML=''; return; }
    $('wrap').classList.remove('is-done');
    var titles=['Choose a service', isClass()?'Pick a session':'Pick a date & time','Your details','Confirm'];
    var html='';
    for(var i=0;i<4;i++){
      var cls=i===state.step?'cur':(i<state.step?'done':'todo');
      html+='<section class="step '+cls+'" data-step="'+i+'"><div class="sh"><span class="num">'+(i<state.step?ICON.check:(i+1))+'</span><h2>'+esc(titles[i])+'</h2>'
        +(i<state.step?'<button type="button" class="edit" data-goto="'+i+'">Change</button>':'')+'</div>';
      if(i===state.step) html+=bodyFor(i);
      else if(i<state.step) html+='<div class="recap">'+recapFor(i)+'</div>';
      html+='</section>';
    }
    steps.innerHTML=html;
    paintSummary();
    if(state.step===1) paintCalendar();
  }
  function recapFor(i){
    if(i===0) return '<b>'+esc(state.service.name)+'</b> <small>· '+esc(durLabel(state.service.duration_minutes))+'</small>';
    if(i===1) return '<b>'+esc(niceDate(state.date))+'</b> at <b>'+esc(niceTime(state.slot&&state.slot.localTime))+'</b>'+(state.teamName?' <small>· with '+esc(state.teamName)+'</small>':'');
    if(i===2) return '<b>'+esc(state.customer.name)+'</b> <small>· '+esc([state.customer.phone,state.customer.email].filter(Boolean).join(' · '))+'</small>';
    return '';
  }
  function bodyFor(i){
    var c=state.catalogue;
    if(i===0){
      var svcs=c.services||[];
      if(!svcs.length) return '<p class="hint">There’s nothing to book online yet. Please contact the business.</p>';
      var cats={}; (c.categories||[]).forEach(function(x){ cats[x.id]=x.name; });
      var groups=[], seen={};
      svcs.forEach(function(s){ var k=s.category_id&&cats[s.category_id]?s.category_id:''; if(!seen[k]){ seen[k]=[]; groups.push(k); } seen[k].push(s); });
      return '<div class="svcs">'+groups.map(function(k){
        return (k&&groups.length>1?'<div class="cat">'+esc(cats[k])+'</div>':'')+seen[k].map(function(s){
          var meta=[durLabel(s.duration_minutes)];
          if(Number(s.capacity)>1) meta.push('Group · up to '+s.capacity);
          if(s.location_label) meta.push(s.location_label);
          if(s.booking_type==='resource_hire') meta=['Hire by the day'];
          return '<button type="button" class="svc'+(state.service&&state.service.id===s.id?' on':'')+'" data-svc="'+esc(s.id)+'"><span><b>'+esc(s.name)+'</b><small>'+esc(meta.filter(Boolean).join(' · '))+'</small>'
            +(s.short_description?'<small>'+esc(s.short_description)+'</small>':'')+'</span><span class="price">'+esc(priceLabel(s))+'</span></button>';
        }).join('');
      }).join('')+'</div>';
    }
    if(i===1){
      var team=c.team||[];
      return (team.length?'<label class="field"><span>Who with?</span><select class="in" id="team"><option value="">Anyone available</option>'
          +team.map(function(t){ return '<option value="'+esc(t.id)+'"'+(state.teamId===t.id?' selected':'')+'>'+esc(t.display_name)+'</option>'; }).join('')+'</select></label>':'')
        +'<div class="month" id="month"><p class="hint">Loading dates…</p></div>'
        +'<div id="times"></div>';
    }
    if(i===2){
      var d=state.customer||{};
      return '<div class="grid2">'
        +'<label class="field"><span>Full name</span><input class="in" id="name" autocomplete="name" value="'+esc(d.name||'')+'"></label>'
        +'<label class="field"><span>Mobile</span><input class="in" id="phone" type="tel" autocomplete="tel" inputmode="tel" value="'+esc(d.phone||'')+'"></label></div>'
        +'<label class="field"><span>Email</span><input class="in" id="email" type="email" autocomplete="email" value="'+esc(d.email||'')+'"></label>'
        +'<label class="field"><span>Anything we should know? <em>(optional)</em></span><textarea class="in" id="notes" rows="3">'+esc(d.notes||'')+'</textarea></label>'
        +'<div class="err hidden" id="d-err"></div>'
        +'<button type="button" class="cta" id="next">Continue</button>';
    }
    if(i===3){
      var s=state.service, b=c.business||{};
      var dep=Number(s.deposit_cents)||0;
      return '<p class="hint" style="margin-top:0">Check the details, then confirm. '+(b.email||b.phone?'You’ll get a confirmation'+(state.customer.email?' by email':'')+'.':'')+'</p>'
        +(s.customer_instructions?'<div class="policy">'+esc(s.customer_instructions)+'</div>':'')
        +'<label class="agree"><input type="checkbox" id="agree"'+(state.agree?' checked':'')+'> <span>I agree to '+esc(b.name||'the business')+'’s booking and cancellation policy.</span></label>'
        +'<div class="err hidden" id="c-err"></div>'
        +'<button type="button" class="cta" id="book">Confirm booking'+(Number(s.price_cents)&&s.price_model!=='quote_required'&&s.price_model!=='free'?' · '+esc(money(s.price_cents)):'')+'</button>'
        +(dep?'<p class="hint">A deposit may be needed to lock it in — you’ll be shown how after confirming.</p>':'');
    }
    return '';
  }
  function paintSummary(){
    var s=state.service, el=$('sum');
    if(!s){ el.innerHTML='<h3>Your booking</h3><p class="empty">Choose a service to get started.</p>'; return; }
    el.innerHTML='<h3>Your booking</h3><dl>'
      +'<dt>Service</dt><dd>'+esc(s.name)+'</dd>'
      +(s.duration_minutes?'<dt>Length</dt><dd>'+esc(durLabel(s.duration_minutes))+'</dd>':'')
      +(state.date?'<dt>Date</dt><dd>'+esc(niceDate(state.date))+'</dd>':'')
      +(state.slot?'<dt>Time</dt><dd>'+esc(niceTime(state.slot.localTime))+'</dd>':'')
      +(state.teamName?'<dt>With</dt><dd>'+esc(state.teamName)+'</dd>':'')
      +(s.location_label?'<dt>Where</dt><dd>'+esc(s.location_label)+'</dd>':'')
      +'</dl><div class="tot"><span>Price</span><span>'+esc(priceLabel(s))+'</span></div>'
      +(state.slot&&state.holdKey?'<p class="note">We’re holding this time for you for a few minutes while you finish.</p>':'');
  }

  /* ---------------------------------------------------------------- calendar */
  async function paintCalendar(){
    var host=$('month'); if(!host) return;
    if(!state.month){ state.month=monthOf(state.date||state.today||new Date().toISOString().slice(0,10)); }
    host.classList.add('loading');
    try{ await loadMonth(state.month); }
    catch(e){ host.classList.remove('loading'); host.innerHTML='<div class="err">'+esc(e.message)+'</div>'; return; }
    if(!$('month')) return;
    host=$('month'); host.classList.remove('loading');
    var ym=state.month, y=Number(ym.slice(0,4)), m=Number(ym.slice(5,7));
    var first=new Date(Date.UTC(y,m-1,1)).getUTCDay(), lead=(first+6)%7, dim=new Date(Date.UTC(y,m,0)).getUTCDate();
    var cells='';
    for(var b=0;b<lead;b++) cells+='<span class="cell blank"></span>';
    for(var d=1;d<=dim;d++){
      var ymd=ym+'-'+pad(d), inf=dayInfo(ymd);
      cells+='<button type="button" class="cell '+inf.cls+(ymd===state.date?' sel':'')+'" data-ymd="'+ymd+'"'+(inf.off?' disabled':'')+' aria-label="'+esc(niceDate(ymd)+(inf.label?' — '+inf.label:''))+'"><span class="dn">'+d+'</span>'+(inf.label?'<span class="dp">'+esc(inf.label)+'</span>':'')+'</button>';
    }
    var atStart=state.today&&ym<=monthOf(state.today);
    host.innerHTML='<div class="mhead"><button type="button" class="mnav" data-mnav="-1" aria-label="Previous month"'+(atStart?' disabled':'')+'>‹</button><strong>'+MON[m-1]+' '+y+'</strong><button type="button" class="mnav" data-mnav="1" aria-label="Next month">›</button></div>'
      +'<div class="wd"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>'
      +'<div class="days">'+cells+'</div>'
      +'<div class="legend"><span><i class="k ok"></i>Available</span><span><i class="k few"></i>Almost gone</span><span><i class="k full"></i>Full / closed</span></div>';
    // If nothing at all is free this month, nudge to the next.
    var any=false; for(var dd=1;dd<=dim;dd++){ if(!dayInfo(ym+'-'+pad(dd)).off){ any=true; break; } }
    if(!any) host.insertAdjacentHTML('beforeend','<p class="hint">Nothing free in '+MON[m-1]+' — try next month.</p>');
    if(state.date) paintTimes();
  }
  async function paintTimes(){
    var box=$('times'); if(!box) return;
    if(!state.date){ box.innerHTML=''; return; }
    var key=state.service.id+'|'+(state.teamId||'')+'|'+state.date;
    if(state.slotsFor!==key){
      box.innerHTML='<p class="hint">Loading times…</p>';
      var q='/api/bookings/availability?slug='+encodeURIComponent(slug)+'&service_id='+encodeURIComponent(state.service.id)+'&date='+state.date;
      if(state.teamId) q+='&team_member_id='+encodeURIComponent(state.teamId);
      var j=await getJson(q);
      if(!j.__ok){ box.innerHTML='<div class="err">'+esc(j.message||'We couldn’t load times. Please try again.')+'</div>'; return; }
      state.slots=j.slots||[]; state.slotsFor=key;
    }
    var inf=dayInfo(state.date);
    var html='<p class="times-h">'+esc(niceDate(state.date))+'</p>';
    if(!state.slots.length){
      html+='<p class="hint" style="margin-top:0">That day has just filled up.</p>'+waitlistHtml();
    } else {
      if(inf.cls==='few') html+='<div class="urgent">'+(inf.n===1?'Only one '+(isClass()?'spot':'time'):'Only '+inf.n+' '+unitWord(inf.n))+' left on '+esc(niceDate(state.date))+' — lock it in now.</div><div style="height:10px"></div>';
      html+='<div class="times">'+state.slots.map(function(s){
        var left=Number(s.remaining), tag='';
        if(isClass()) tag='<small class="'+(left<=2?'few':'')+'">'+(left===1?'Last spot':left+' left')+'</small>';
        return '<button type="button" class="time'+(state.slot&&state.slot.start===s.start?' on':'')+'" data-start="'+esc(s.start)+'">'+esc(niceTime(s.localTime))+tag+'</button>';
      }).join('')+'</div>'
      +(state.slot?'<button type="button" class="cta" id="to-details">Continue</button>':'<p class="hint">Pick a time to continue.</p>');
    }
    box.innerHTML=html;
  }
  function waitlistHtml(){
    return '<div class="policy" id="wl" style="white-space:normal"><b style="color:var(--ink)">Join the waitlist</b><br>We’ll let you know if a time opens up on '+esc(niceDate(state.date))+'.'
      +'<div class="grid2" style="margin-top:10px"><input class="in" id="wl-name" placeholder="Your name" autocomplete="name"><input class="in" id="wl-phone" type="tel" placeholder="Mobile" autocomplete="tel"></div>'
      +'<input class="in" id="wl-email" type="email" placeholder="Email (optional)" style="margin-top:10px" autocomplete="email">'
      +'<div class="err hidden" id="wl-err"></div><button type="button" class="cta ghost" id="wl-go" style="height:48px">Join waitlist</button></div>';
  }

  /* ---------------------------------------------------------------- done */
  function doneHtml(){
    var r=state.result||{}, b=r.booking||{}, pay=r.checkout_url;
    var pending=b.status==='pending'||b.status==='awaiting_payment'||pay;
    var when=b.starts_at?fmtIso(b.starts_at,{ weekday:'long', day:'numeric', month:'long', hour:'numeric', minute:'2-digit' }):'';
    return '<div class="donecard"><div class="tick'+(pending?' wait':'')+'">'+(pending?ICON.clock:ICON.check)+'</div>'
      +'<h2>'+(pay?'Almost done — pay to lock it in':(b.status==='pending'?'Request received!':'You’re booked!'))+'</h2>'
      +'<p>'+(pay?'Your time is reserved. Pay the deposit to confirm it.':(b.status==='pending'?'We’ll check it and confirm shortly.':'We’ve saved your spot.'+(b.customer_email?' A confirmation is on its way to '+esc(b.customer_email)+'.':'')))+'</p>'
      +'<dl><dt>Booking</dt><dd>'+esc(b.reference||'')+'</dd><dt>Service</dt><dd>'+esc(b.service_name||(state.service&&state.service.name)||'')+'</dd>'
      +(when?'<dt>When</dt><dd>'+esc(when)+'</dd>':'')
      +(state.teamName?'<dt>With</dt><dd>'+esc(state.teamName)+'</dd>':'')
      +(b.deposit_cents?'<dt>Deposit</dt><dd>'+esc(money(b.deposit_cents))+'</dd>':'')
      +'</dl>'
      +(b.customer_instructions?'<div class="policy" style="text-align:left">'+esc(b.customer_instructions)+'</div>':'')
      +'<div class="actions">'
      +(pay?'<a class="cta" href="'+esc(pay)+'">Pay deposit securely</a>':'')
      +(b.starts_at?'<button type="button" class="cta'+(pay?' ghost':'')+'" id="ics">Add to calendar</button>':'')
      +(r.portal_url?'<a class="cta ghost" href="'+esc(r.portal_url)+'">Manage or change booking</a>':'')
      +'<a class="cta ghost" href="'+esc(location.pathname+'?slug='+encodeURIComponent(slug))+'">Book something else</a>'
      +'</div></div>';
  }
  function downloadIcs(){
    var b=(state.result||{}).booking||{}; if(!b.starts_at) return;
    function z(iso){ return new Date(iso).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''); }
    function t(s){ return String(s||'').replace(/[\\,;]/g,function(c){ return '\\'+c; }).replace(/\n/g,'\\n'); }
    var biz=(state.catalogue&&state.catalogue.business)||{};
    var ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//LeadPages//Bookings//EN','BEGIN:VEVENT',
      'UID:'+t(b.reference||Date.now())+'@leadpages','DTSTAMP:'+z(new Date().toISOString()),'DTSTART:'+z(b.starts_at),'DTEND:'+z(b.ends_at||b.starts_at),
      'SUMMARY:'+t((b.service_name||'Booking')+' — '+(biz.name||'')),
      'DESCRIPTION:'+t('Booking '+(b.reference||'')+(biz.phone?' · '+biz.phone:'')),
      (state.service&&state.service.location_label?'LOCATION:'+t(state.service.location_label):''),
      'END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([ics],{ type:'text/calendar' })); a.download=(b.reference||'booking')+'.ics';
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  /* ---------------------------------------------------------------- holds */
  function releaseHold(){
    if(!state.holdKey) return;
    var k=state.holdKey; state.holdKey='';
    post('/api/bookings/holds',{ slug:slug, action:'release', hold_key:k }).catch(function(){});
  }
  async function takeHold(){
    try{
      var hj=await post('/api/bookings/holds',{ slug:slug, service_id:state.service.id, starts_at:state.slot.start, team_member_id:state.teamId||null, hold_key:state.holdKey||undefined });
      if(hj.__ok&&hj.hold_key) state.holdKey=hj.hold_key;
    }catch(_e){}
  }

  /* ---------------------------------------------------------------- events */
  function go(step){ showErr(''); state.step=step; render(); var el=document.querySelector('.step.cur'); if(el&&el.getBoundingClientRect().top<0) el.scrollIntoView({ behavior:'smooth', block:'start' }); }

  document.addEventListener('click', async function(e){
    var t=e.target;
    var svc=t.closest('[data-svc]');
    if(svc){
      var picked=state.catalogue.services.find(function(s){ return s.id===svc.getAttribute('data-svc'); });
      if(picked&&picked.booking_type==='resource_hire'){ state.service=picked; openHire(); return; }
      if(!state.service||state.service.id!==picked.id){ releaseHold(); state.date=''; state.slot=null; state.slots=null; state.slotsFor=''; state.month=''; }
      state.service=picked; go(1); return;
    }
    var gt=t.closest('[data-goto]'); if(gt){ go(Number(gt.getAttribute('data-goto'))); return; }
    var mn=t.closest('[data-mnav]'); if(mn){ state.month=addMonth(state.month, Number(mn.getAttribute('data-mnav'))); paintCalendar(); return; }
    var day=t.closest('.cell[data-ymd]');
    if(day&&!day.disabled){
      if(state.date!==day.getAttribute('data-ymd')){ releaseHold(); state.slot=null; }
      state.date=day.getAttribute('data-ymd');
      document.querySelectorAll('.cell.sel').forEach(function(c){ c.classList.remove('sel'); }); day.classList.add('sel');
      paintSummary(); await paintTimes();
      var tb=$('times'); if(tb&&window.innerWidth<860) tb.scrollIntoView({ behavior:'smooth', block:'start' });
      return;
    }
    var tm=t.closest('.time[data-start]');
    if(tm){
      var start=tm.getAttribute('data-start');
      state.slot=(state.slots||[]).find(function(s){ return s.start===start; })||null;
      document.querySelectorAll('.time.on').forEach(function(x){ x.classList.remove('on'); }); tm.classList.add('on');
      await takeHold(); paintSummary(); paintTimes(); return;
    }
    if(t.id==='to-details'){ if(state.slot) go(2); return; }
    if(t.id==='next'){
      var d={ name:$('name').value.trim(), email:$('email').value.trim(), phone:$('phone').value.trim(), notes:$('notes').value.trim() };
      var er=$('d-err'), msg='';
      if(!d.name) msg='Please add your name.';
      else if(!d.email&&!d.phone) msg='Please add a mobile number or email so we can confirm.';
      else if(d.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) msg='That email doesn’t look right.';
      else if(d.phone&&d.phone.replace(/\D/g,'').length<8) msg='That phone number looks too short.';
      if(msg){ er.textContent=msg; er.classList.remove('hidden'); return; }
      state.customer=d; go(3); return;
    }
    if(t.id==='agree'){ state.agree=t.checked; if(t.checked){ var ce=$('c-err'); if(ce) ce.classList.add('hidden'); } return; }
    if(t.id==='book'){
      var ce2=$('c-err');
      if(!$('agree').checked){ ce2.textContent='Please tick to agree to the booking policy.'; ce2.classList.remove('hidden'); return; }
      t.disabled=true; t.classList.add('busy');
      var j=await post('/api/bookings/public',{
        slug:slug, service_id:state.service.id, starts_at:state.slot.start, team_member_id:state.teamId||null,
        customer_name:state.customer.name, customer_email:state.customer.email, customer_phone:state.customer.phone,
        customer_notes:state.customer.notes, idempotency_key:state.idempotency, hold_key:state.holdKey||null
      }).catch(function(){ return { __ok:false }; });
      if(!j.__ok){
        t.disabled=false; t.classList.remove('busy');
        var gone=j.__status===409||/capacity|conflict|taken|unavailable|slot/i.test(String(j.error||''));
        ce2.textContent=gone?'Sorry — that time was just taken. Please pick another.':(j.message||j.error||'We couldn’t make the booking. Please try again or call us.');
        ce2.classList.remove('hidden');
        if(gone){ state.slot=null; state.slotsFor=''; state.monthData={}; setTimeout(function(){ go(1); }, 1400); }
        return;
      }
      state.holdKey=''; state.result=j; state.step=4; render(); window.scrollTo({ top:0, behavior:'smooth' });
      return;
    }
    if(t.id==='ics'){ downloadIcs(); return; }
    if(t.id==='wl-go'){
      var name=$('wl-name').value.trim(), phone=$('wl-phone').value.trim(), email=$('wl-email').value.trim(), we=$('wl-err');
      if(!name||(!phone&&!email)){ we.textContent='Add your name and a mobile or email.'; we.classList.remove('hidden'); return; }
      t.disabled=true;
      var w=await post('/api/bookings/waitlist',{ slug:slug, service_id:state.service.id, team_member_id:state.teamId||null, name:name, email:email, phone:phone, preferred_date:state.date });
      if(!w.__ok){ t.disabled=false; we.textContent=w.message||w.error||'Couldn’t add you to the waitlist.'; we.classList.remove('hidden'); return; }
      $('wl').innerHTML='<b style="color:var(--ink)">You’re on the waitlist.</b><br>We’ll be in touch if a time opens up.';
      return;
    }
  });
  document.addEventListener('change', function(e){
    if(e.target.id==='team'){
      state.teamId=e.target.value;
      var o=e.target.options[e.target.selectedIndex]; state.teamName=state.teamId&&o?o.textContent:'';
      releaseHold(); state.slot=null; state.slotsFor=''; paintSummary(); paintCalendar();
    }
  });
  window.addEventListener('pagehide', releaseHold);
  load();
})();
</script>
</body>
</html>
